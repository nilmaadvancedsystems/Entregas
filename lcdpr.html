<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importador LCDPR — Nilma Contabilidade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="nilma-icones.css?v=345">
<!-- Aparência (tema, cor, texto, espaçamento, animação) igual à do Entregas:
     o script vem ANTES da folha e sem defer, senão a tela pisca no tema errado. -->
<script src="nilma-ui.js?v=347"></script>
<link rel="stylesheet" href="nilma-ui.css?v=352">
<style>
/* Importador LCDPR — só o que é desta página. Tokens, casca, caixa (.card,
   .card.caixa), botões, campos, tabela, selos, dobra, janela e aviso vêm de
   nilma-ui.css (visual da Conferência Contábil). */

/* ---------- área de conteúdo (= main.main > .content da Conferência) ---------- */
.lcdpr-conteudo { min-width: 0; padding: 0 32px 64px; }
.screen { max-width: 1216px; margin: 0 auto; }
@media (max-width: 767px) { .lcdpr-conteudo { padding: 0 16px 48px; } }
/* com submenu, o título é o do grupo; o de cada categoria some */
.screen.com-submenu > section > .nilma-topo { display: none; }

.small { font-size: 12px; line-height: 1.5; color: var(--ink-muted); }
.truncate { display: block; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- portão de acesso (= entrada da Conferência) ---------- */
.gate {
  position: fixed; inset: 0; z-index: var(--z-tela); overflow-y: auto;
  display: flex; justify-content: center; align-items: flex-start;
  padding: 40px 16px; background: var(--bg);
}
.gate-box { width: 100%; max-width: 340px; text-align: center; }
.gate-logo svg { display: block; height: 48px; width: auto; margin: 0 auto 20px; }
.gate-box h1 { font-size: 24px; font-weight: 400; line-height: 1.25; color: var(--ink); margin: 0 0 20px; }
.gate-card {
  padding: 16px; text-align: left; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 6px;
}
.gate-card #gateMsg { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); }
.gate-card #gateAction { margin: 0; }
.gate-card #gateAction:not(:empty) { margin-top: 12px; }
.gate-card #gateAction .btn { width: 100%; }

/* ---------- importação (= card "Importar …" da Conferência) ---------- */
.lcdpr-import .dropzone { width: 100%; min-height: 40px; color: var(--ink-muted); transition: border-color .12s ease, background-color .12s ease, color .12s ease; }
.lcdpr-import .dropzone .ph { font-size: 16px; flex: none; }
.lcdpr-import .dropzone .big { color: inherit; }
.lcdpr-import .dropzone:hover .big, .lcdpr-import .dropzone.drag .big { color: inherit; }
.lcdpr-import .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.lcdpr-import .dropzone.lendo { opacity: .7; pointer-events: none; }
.lcdpr-import .dropzone.carregando { cursor: default; opacity: .7; }
.lcdpr-import .dropzone.carregando:hover { border-color: var(--border-strong); color: var(--ink-muted); }
.lcdpr-import .dropzone .btn-spinner { width: 14px; height: 14px; }
.lcdpr-import > .hint { margin: 8px 0 0; }

/* ---------- caixa recolhível (arquivos lidos, backup e limpeza) ---------- */
details.card.caixa > summary.card-head-row { list-style: none; cursor: pointer; user-select: none; }
details.card.caixa > summary.card-head-row::-webkit-details-marker { display: none; }
details.card.caixa > summary.card-head-row::after {
  content: ""; flex: none; width: 6px; height: 6px; margin: 0 4px 3px 0;
  border-right: 1.5px solid var(--ink-muted); border-bottom: 1.5px solid var(--ink-muted);
  transform: rotate(45deg); transition: transform .12s ease;
}
details.card.caixa[open] > summary.card-head-row::after { transform: rotate(-135deg); margin-bottom: -3px; }
details.card.caixa > summary.card-head-row:hover { background: var(--hover-bg); }
details.card.caixa:not([open]) > summary.card-head-row { border-bottom: none; border-radius: 6px; }

/* arquivos lidos nesta sessão (resumo em lista da Conferência) */
.registro-tab td:first-child { overflow-wrap: anywhere; }
.registro-tab td:nth-child(2) { color: var(--ink-muted); white-space: nowrap; }
.registro-tab td:last-child { text-align: right; white-space: nowrap; width: 1%; }
.registro-tab .small { font-size: 14px; }
.badge-erro { color: var(--destructive); }

/* ---------- caixa dos lançamentos ---------- */
.lanc-caixa > .progresso-lcdpr,
.lanc-caixa > .toolbar,
.lanc-caixa > .bulkbar { margin: 0; padding: 8px 16px; border-bottom: 1px solid var(--border); }
/* sem lançamento: só o cabeçalho e o vazio */
.lanc-caixa.vazia > .toolbar, .lanc-caixa.vazia > .bulkbar,
.lanc-caixa.vazia #toggleRevisar, .lanc-caixa.vazia thead { display: none; }

/* progresso: "dá pra exportar?" */
.progresso-lcdpr { padding-top: 12px !important; padding-bottom: 12px !important; }
.progresso-topo {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px;
  font-size: 14px; font-weight: 600; line-height: 20px; margin-bottom: 8px;
}
.progresso-valor { color: var(--ink-muted); font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
.progresso-lcdpr .barra { height: 8px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.progresso-lcdpr .barra span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .15s ease; }
.progresso-pe { margin: 8px 0 0; }
.progresso-pe strong { color: var(--danger); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input[type=search] { flex: 1 1 320px; max-width: 480px; }
.bulkbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--ink-muted); }
.bulkbar > span:first-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bulkbar select { width: 240px; max-width: 100%; }
.bulkbar label.small { font-size: 14px; color: var(--ink); cursor: pointer; white-space: nowrap; }

/* pendências agrupadas: uma decisão para notas que são a mesma coisa */
.lanc-caixa > .grupos-revisar { border-bottom: 1px solid var(--border); }
.grupo-revisar {
  display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap;
  padding: 8px 16px; border-top: 1px solid var(--border-muted);
}
.grupo-revisar:first-child { border-top: none; }
.grupo-revisar:hover { background: var(--surface-2); }
.grupo-topo { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; }
.grupo-topo strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grupo-revisar select { flex: 0 1 280px; width: 280px; }

/* ---------- tabela (moram numa .card.caixa: a borda é a da caixa) ---------- */
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--surface); }
.card.caixa > .tablewrap:last-child { border-radius: 0 0 6px 6px; }
.lanc-caixa > .tablewrap { max-height: 560px; overflow: auto; }
table.t { width: 100%; }
table.t th:first-child, table.t td:first-child { padding-left: 16px; }
table.t th:last-child, table.t td:last-child { padding-right: 16px; }

/* lançamentos: linha de 40px (célula 4px + campo 32px) */
.lanc-caixa table.t thead th { padding: 8px 12px; position: sticky; top: 0; z-index: 1; }
.lanc-caixa table.t tbody td { padding: 4px 12px; height: 40px; }
.lanc-caixa table.t td:first-child, .lanc-caixa table.t th:first-child { width: 1%; padding-right: 4px; }
.lanc-caixa table.t td[data-rot="Categoria"] select { min-width: 200px; }
.lanc-caixa table.t td[data-rot="Data"] { color: var(--ink-muted); }
table.t tbody tr.revisar { background: var(--danger-soft); }
table.t tbody tr.lanc-vazio:hover { background: none; }
.lanc-caixa table.t tbody tr.lanc-vazio > td { width: auto; height: auto; padding: 24px 16px; }
.status-cell { display: flex; flex-wrap: nowrap; gap: 4px; align-items: center; white-space: nowrap; }

/* etiquetas = .badge (pílula de contorno) */
.tag {
  display: inline-block; font-size: 12px; font-weight: 500; line-height: 18px; padding: 0 7px;
  border: 1px solid var(--border); border-radius: 2em; white-space: nowrap; color: var(--ink-muted); background: none;
}
.tag-warn { color: var(--danger); border-color: var(--danger); }
.tag-ncm { color: var(--success); border-color: var(--success); }

/* abrir detalhes */
.chev {
  width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 6px; background: none; color: var(--ink-muted); cursor: pointer;
}
.chev .ph { font-size: 16px; transition: transform .12s ease; }
.chev:hover { background: var(--hover-bg); color: var(--ink); }
.chev.open .ph { transform: rotate(90deg); }
.chev.open { color: var(--ink); }

tr.row-detail > td { background: var(--surface-2); padding: 16px !important; height: auto; border-top: 1px solid var(--border-muted); }
table.t tbody tr.row-detail:hover { background: none; }
.lanc-caixa table.t tbody tr.row-detail > td { width: auto; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 12px 16px; margin-bottom: 12px; }
.detail-field label { display: block; font-size: 14px; font-weight: 600; line-height: 20px; color: var(--ink); margin-bottom: 6px; }

/* campo dentro de tabela: o desenho (também sem type e com .mono) é da fundação */
.tbl-input { min-width: 64px; margin: 0; transition: border-color .12s ease, box-shadow .12s ease, background-color .12s ease; }
textarea.tbl-input { display: block; resize: vertical; min-height: 56px; }
.tbl-input:not(:focus) { box-shadow: none; }

/* ---------- cadastros (Classificação e Tabelas de apoio) ---------- */
.card.caixa > .card-head-row .input {
  width: auto; flex: 0 1 16rem; min-height: 28px; padding: 3px 8px; font-size: 12px; line-height: 20px;
}
/* variáveis do histórico sempre à vista */
.caixa-vars {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 16px;
  border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink-muted);
}
.caixa-vars code {
  font-size: 12px; line-height: 18px; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 6px; padding: 0 6px;
}
/* a tabela de cadastro cresce com a página: o cabeçalho gruda sob a barra de cima */
.card.caixa > .tablewrap:has(> table.t-cfg) { overflow: visible; }
table.t-cfg thead th { position: sticky; top: var(--topo-total); z-index: 1; padding: 8px 8px 8px 21px; }
table.t-cfg thead th:first-child { padding-left: 29px; }
table.t-cfg tbody td { padding: 4px 8px; }
/* o campo parece texto até passar o mouse na linha ou focar */
table.t-cfg .tbl-input { background-color: transparent; border-color: transparent; padding: 5px 12px; }
table.t-cfg select.tbl-input { padding-right: 32px; text-overflow: ellipsis; }
table.t-cfg tbody tr:hover .tbl-input { border-color: var(--border); background-color: var(--surface); }
table.t-cfg .tbl-input:focus { background-color: var(--surface); }
table.t-cfg textarea.tbl-longo {
  display: block; resize: none; overflow: hidden; field-sizing: content; min-height: 32px;
}
table.t-cfg tr[hidden] { display: none !important; }
table.t-cfg .c-cod { width: 6rem; }
table.t-cfg .c-conta { width: 5.5rem; }
table.t-cfg .c-hist { width: 6.5rem; }
table.t-cfg .c-nome { width: 16rem; }
table.t-cfg .c-clas { width: 10rem; }
table.t-cfg .c-tipo { width: 9rem; }
table.t-cfg .c-ie { width: 10rem; }
table.t-cfg .c-del { width: 48px; text-align: center; padding-left: 0 !important; }
/* × só se destaca ao passar o mouse (lista de itens da Conferência) */
table.t-cfg .del {
  width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 6px; background: none; color: var(--ink-muted); cursor: pointer;
}
table.t-cfg .del .ph { font-size: 14px; }
table.t-cfg .del:hover { background: var(--destructive-soft); color: var(--destructive); }
table.t-cfg tr.vazio > td { text-align: center; color: var(--ink-muted); padding: 24px 16px; }
table.t-cfg tbody tr.vazio:hover { background: none; }
@media (min-width: 801px) { table.t-cfg { table-layout: fixed; } }
@media (min-width: 801px) and (max-width: 1100px) {
  table.t-cfg .c-nome { width: 9rem; }
  table.t-cfg .c-conta { width: 4.5rem; }
  table.t-cfg .c-hist { width: 5.5rem; }
}
@media (min-width: 1101px) { table.t-cfg.t-cat .c-nome { width: 18rem; } }

.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 16px; align-items: start; }
@media (max-width: 1100px) { .twocol { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Configuração geral ---------- */
.cfg-campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 16px; max-width: 46rem; }
.cfg-campos .largo { grid-column: 1 / -1; }
.cfg-campos .field { margin: 0; }
.cfg-raro-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 16px; }
.cfg-raro-acoes .sep { flex: 1; }

/* ---------- aviso com "Desfazer" (toast da folha, canto de baixo à esquerda) ---------- */
.toast-acao {
  margin: -4px -8px -4px 8px; min-height: 28px; padding: 3px 8px; vertical-align: baseline;
  border: none; border-radius: 6px; background: none; color: var(--accent);
  font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
}
.toast-acao:hover { background: var(--hover-bg); }

/* ---------- celular ---------- */
@media (max-width: 800px) {
  /* lançamentos: cada linha vira um bloco; o rótulo da coluna vem junto do dado */
  .lanc-caixa > .tablewrap { max-height: none; overflow: visible; }
  .lanc-caixa table.t, .lanc-caixa table.t tbody { display: block; }
  .lanc-caixa table.t thead { display: none; }
  .lanc-caixa table.t tbody tr:not(.row-detail):not(.lanc-vazio) {
    display: grid; grid-template-columns: 24px minmax(0, 1fr) 28px; gap: 4px 8px; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--border-muted);
  }
  .lanc-caixa table.t tbody tr:first-child { border-top: none; }
  .lanc-caixa table.t tbody td { display: block; height: auto; padding: 0 !important; border: none; width: auto; }
  .lanc-caixa table.t tbody td:nth-child(1) { grid-column: 1; grid-row: 1; }
  .lanc-caixa table.t tbody td:nth-child(2) { grid-column: 2; grid-row: 1; }
  .lanc-caixa table.t tbody td:nth-child(8) { grid-column: 3; grid-row: 1; }
  .lanc-caixa table.t tbody td[data-rot] {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; text-align: left !important;
  }
  .lanc-caixa table.t td[data-rot]::before {
    content: attr(data-rot); flex: none; width: 88px; font-size: 12px; color: var(--ink-muted);
  }
  .lanc-caixa table.t td[data-rot] > select, .lanc-caixa table.t td[data-rot] > .truncate { flex: 1; min-width: 0; max-width: none; }
  .lanc-caixa table.t td[data-rot="Categoria"] select { min-width: 0; width: 100%; }
  .lanc-caixa table.t tr.row-detail, .lanc-caixa table.t tr.row-detail > td,
  .lanc-caixa table.t tr.lanc-vazio, .lanc-caixa table.t tr.lanc-vazio > td { display: block; }
  .lanc-caixa table.t tr.row-detail > td { padding: 12px 16px !important; }
  .lanc-caixa table.t tbody tr.lanc-vazio > td { padding: 24px 16px !important; }
  .toolbar input[type=search] { max-width: none; }
  .bulkbar select { flex: 1 1 100%; min-width: 0; }
  .grupo-revisar select { flex: 1 1 100%; width: 100%; }

  /* arquivos lidos: nome em cima, o resto embaixo */
  .registro-tab thead { display: none; }
  .registro-tab, .registro-tab tbody { display: block; }
  .registro-tab tbody tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 8px 16px; border-top: 1px solid var(--border-muted); }
  .registro-tab tbody tr:first-child { border-top: none; }
  .registro-tab tbody td { display: block; padding: 0 !important; border: none; }
  .registro-tab td:first-child { flex: 1 1 100%; }
  .registro-tab td:last-child { margin-left: auto; width: auto; }

  /* cadastros: cada linha vira uma grade de 2–3 faixas, com o rótulo de
     12px em cima de cada campo (data-rot) e os campos sempre desenhados */
  .card.caixa > .card-head-row .input { order: 3; flex: 1 1 100%; }
  table.t.t-cfg, table.t.t-cfg tbody { display: block; }
  table.t.t-cfg thead { display: none; }
  table.t.t-cfg tbody tr { display: grid; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border-muted); align-items: start; }
  table.t.t-cfg tbody tr:first-child { border-top: none; }
  table.t.t-cfg td { display: block; padding: 0 !important; border: none; min-width: 0; width: auto; }
  table.t.t-cfg td[data-rot]::before {
    content: attr(data-rot); display: block; margin-bottom: 4px; font-size: 12px; line-height: 16px; color: var(--ink-muted);
  }
  table.t.t-cfg td.c-del { justify-self: end; padding-top: 22px !important; }
  table.t.t-cfg .del { width: 32px; height: 32px; }
  table.t.t-cfg .tbl-input { border-color: var(--border); background-color: var(--surface); }
  table.t.t-cfg tr.vazio { display: block; }
  table.t.t-2 tr { grid-template-columns: 4rem minmax(0, 1fr) 32px; }
  table.t.t-ie tr { grid-template-columns: minmax(0, 1fr) 32px; grid-template-areas: "a e" "b b"; }
  table.t.t-ncm tr, table.t.t-cat tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 32px; }
  table.t.t-plano tr { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) minmax(0, 3fr) 32px; grid-template-areas: "b b b e" "a c d d"; }
  @media (max-width: 360px) { table.t.t-plano tr { grid-template-areas: "b b b e" "a a c c" "d d d d"; } }
  table.t.t-ncm tr { grid-template-areas: "a b c c" "d d d e"; }
  table.t.t-cat tr { grid-template-areas: "a a a e" "b b c c" "d d d d"; }
  :is(table.t.t-plano, table.t.t-ncm, table.t.t-cat, table.t.t-ie) td:nth-child(1) { grid-area: a; }
  :is(table.t.t-plano, table.t.t-ncm, table.t.t-cat, table.t.t-ie) td:nth-child(2) { grid-area: b; }
  :is(table.t.t-plano, table.t.t-ncm, table.t.t-cat) td:nth-child(3) { grid-area: c; }
  :is(table.t.t-plano, table.t.t-ncm, table.t.t-cat) td:nth-child(4) { grid-area: d; }
  :is(table.t.t-plano, table.t.t-ncm, table.t.t-cat) td:nth-child(5), table.t.t-ie td:nth-child(3) { grid-area: e; }
  :is(table.t.t-plano, table.t.t-ncm, table.t.t-cat, table.t.t-ie) tr.vazio td { grid-area: auto; }
  table.t.t-ncm td.c-del, table.t.t-2 td.c-del { padding-top: 22px !important; }
}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <span class="gate-logo" aria-hidden="true"><svg viewBox="0 0 720 1176"><use href="#nshLogo"/></svg></span>
    <h1 id="gateTitle">Conectando…</h1>
    <div class="gate-card">
      <p id="gateMsg">Só um instante.</p>
      <p id="gateAction"></p>
    </div>
  </div>
</div>
<!-- Casca comum (barra de cima, menu ☰ e menu da conta): nilma-shell.js.
     As telas do LCDPR são as abas (fixas à esquerda no PC, sublinhadas no
     celular); renderNav() monta os botões dentro de #navlist. -->
<script src="nilma-dialogo.js?v=345"></script>
<script src="nilma-shell.js?v=355"></script>
<script src="nilma-config.js?v=355"></script>
<script src="nilma-extras.js?v=355"></script>
<script>
  NilmaShell.montar({ modulo: 'Fiscal', moduloId: 'fiscal', buscaRotulo: 'Perguntar à IA', buscaIcone: 'ph-chats-circle', notas: false, buscaGlobal: false, versao: '2.355 · 26/09/2026' });
  // o LCDPR é um submódulo do Fiscal: "Nilma / Fiscal / Importador LCDPR"
  NilmaShell.definirSubmodulo('fiscal/lcdpr', 'Importador LCDPR');
  document.getElementById('topo').hidden = true;
</script>
<nav class="tabs" id="tabsNav" aria-label="Telas do LCDPR" hidden>
  <div id="navlist" style="display:contents"></div>
  <div class="tabs-pe" id="sidebarFoot">Conectando à nuvem…</div>
</nav>
<div id="app" hidden>
  <main class="lcdpr-conteudo"><div class="screen" id="screen"></div></main>
</div>

<script>

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    // shallow-merge top level, keep saved arrays/objects if present
    const merged = Object.assign(d, parsed);
    merged.lancamentos = []; // lançamentos nunca ficam salvos — ver save()
    merged.importacoes = [];
    return merged;
  }catch(e){ console.warn('Falha ao carregar estado salvo, usando padrão.', e); return defaultState(); }
}
function save(){
  // Lançamentos importados NÃO ficam salvos (nem local, nem na nuvem) — são
  // dados de trabalho, recriados a qualquer momento reimportando os relatórios
  // do SIEG. Só regras/cadastros (que dão trabalho pra recriar) persistem.
  const { lancamentos, importacoes, ...toPersist } = state;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toPersist));
  scheduleCloudSync();
}

const SETTINGS_FIELDS = ['config','categorias','planoContas','ncmRules','imoveis','ieDest','tipoDoc','tipoLanc'];

async function bootstrapCloud(){
  if(!db){ cloudStatus='error'; renderSidebarFoot(); return; }
  try{
    const settingsSnap = await db.collection('lcdpr').doc('config').get();
    if(settingsSnap.exists){
      const d = settingsSnap.data();
      for(const k of SETTINGS_FIELDS) if(d[k]!==undefined) state[k] = d[k];
    }
    cloudReady = true; cloudStatus = 'ok';
    const { lancamentos, importacoes, ...toPersist } = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toPersist)); // atualiza o cache local, sem reagendar sync
    render();
    renderSidebarFoot();
  }catch(e){
    console.warn('Não foi possível conectar à nuvem — usando dados salvos neste navegador.', e);
    cloudStatus = 'error';
    renderSidebarFoot();
  }
}
function scheduleCloudSync(){
  if(!db) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(syncSettingsToCloud, 700);
}
async function syncSettingsToCloud(){
  if(!db) return;
  try{
    const payload = {};
    for(const k of SETTINGS_FIELDS) payload[k] = state[k];
    await db.collection('lcdpr').doc('config').set(payload);
    if(cloudStatus!=='ok'){ cloudStatus='ok'; renderSidebarFoot(); }
  }catch(e){ console.warn('Falha ao sincronizar configurações com a nuvem.', e); cloudStatus='error'; renderSidebarFoot(); }
}
function renderSidebarFoot(){
  const el = document.getElementById('sidebarFoot');
  if(!el) return;
  el.textContent = cloudStatus==='ok' ? 'Sincronizado com a nuvem'
    : cloudStatus==='connecting' ? 'Conectando à nuvem…'
    : 'Sem conexão com a nuvem — salvo só neste navegador';
}

/* ============================== HELPERS ============================== */
function onlyDigits(s){ return String(s==null?'':s).replace(/\D/g,''); }
function fmtCnpjCpf(digits){
  digits = onlyDigits(digits);
  if(digits.length===11) return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  if(digits.length===14) return digits.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
  return digits;
}
function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDateBR(d){
  if(!d) return '';
  if(d instanceof Date) return d.toLocaleDateString('pt-BR');
  return String(d);
}
function excelDateToJS(v){
  if(v instanceof Date) return v;
  if(typeof v === 'number'){
    const parsed = XLSX.SSF.parse_date_code(v);
    if(parsed) return new Date(Date.UTC(parsed.y, parsed.m-1, parsed.d));
  }
  if(typeof v === 'string'){
    const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
    const d = new Date(v);
    if(!isNaN(d)) return d;
  }
  return null;
}
function normSerie(s){
  if(s===undefined||s===null||s==='') return '';
  const n = parseFloat(s);
  if(isNaN(n)) return String(s).trim();
  return String(n);
}
function buildDocumento(numero, serie){
  const num = String(numero||'').trim();
  const ser = normSerie(serie);
  if(!ser || ser==='1') return num;
  return num + '/' + ser;
}
function applyTemplate(tmpl, ctx){
  const cnpjFmt = fmtCnpjCpf(ctx.cnpj);
  return String(tmpl||'')
    .replaceAll('{{doc}}', ctx.documento||'')
    .replaceAll('{{fornecedor}}', ctx.fornecedor||'')
    .replaceAll('{{cnpj}}', cnpjFmt);
}
function findCategoriaLabel(conta, codHist){
  const c = state.categorias.find(c=>String(c.conta)===String(conta) && String(c.codHist||'')===String(codHist||''));
  return c ? c.nome : '';
}

// Quem fica sem volta quando o aviso some ou é trocado por outro (as

// não encerra o anterior: ele soma, e o Desfazer vale para tudo.
let toastAoExpirar = null;
function encerraToastAnterior(aoExpirarNovo){

  if(f && f!==aoExpirarNovo) f();
}
// Toast com saída: aplicar em lote reescrevia 200 linhas sem volta.
function toastComDesfazer(msg, aoDesfazer, aoExpirar){
  encerraToastAnterior(aoExpirar);
  toastAoExpirar = aoExpirar || null;
  let el = document.getElementById('__toast');
  if(!el){ el=document.createElement('div'); el.id='__toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg + ' ';

  // .toast-acao, não .btn-ghost: o vermelho do ghost sobre o fundo quase

  el.style.display='block'; el.classList.add('show');

let uid = 1;

/* ============================== CLASSIFICAÇÃO ============================== */
function classifyNF(doc){
  // NCM: um documento pode misturar itens de categorias diferentes (ex: nota de
  // combustível com um filtro de brinde). Em vez de decidir pela primeira linha
  // que bater uma regra, somamos o valor das linhas por regra e escolhemos a
  // regra cujo total responde pela maior parte do valor da nota — assim o item
  // principal manda, não o primeiro da lista.
  const totals = new Map(); // key: índice da regra -> {rule, total}
  for(const line of doc.linhas){
    let ncmStr = String(line.ncm||'').trim();
    // O Excel guarda NCM como número quando a célula não está formatada como texto,
    // o que apaga o(s) zero(s) à esquerda (ex: NCM real 01022190 vira "1022190").
    // Sem isso, nenhuma regra de capítulo 00-09 (carnes, frutas, café, gado...) bate.
    if(/^\d+$/.test(ncmStr)) ncmStr = ncmStr.padStart(8,'0');
    if(!ncmStr) continue;
    for(let i=0;i<state.ncmRules.length;i++){
      const rule = state.ncmRules[i];
      const pref = String(rule.prefixo||'').trim();
      if(pref && ncmStr.startsWith(pref)){
        const acc = totals.get(i) || {rule, total:0};
        acc.total += Number(line.valor)||0;
        totals.set(i, acc);
        break; // essa linha já achou sua regra, não avalia as demais pra ela
      }
    }
  }
  if(totals.size){
    let best = null;
    for(const acc of totals.values()){ if(!best || acc.total>best.total) best = acc; }
    return {conta:best.rule.conta, codHist:best.rule.codHist, historico:best.rule.historico, origemRegra:'NCM'};
  }
  // Sem NCM correspondente, vai pra REVISAR — classificação é só por NCM.
  return null;
}
function classifyCTe(doc){
  // CT-e não carrega NCM/produto confiável — mas ao contrário de uma nota de compra,
  // o serviço prestado é sempre frete, então a categoria padrão configurada é segura
  // independente da transportadora.
  const cat = state.categorias.find(c=>c.nome===state.config.categoriaFretesCTe);
  if(cat) return {conta:cat.conta, codHist:cat.codHist, historico:cat.historico, origemRegra:'Padrão CT-e'};
  return null;
}
function buildLancamentoFromDoc(doc, origem){
  const match = origem==='NF' ? classifyNF(doc) : classifyCTe(doc);
  const ctx = {documento:doc.documento, fornecedor:doc.fornecedor, cnpj:doc.cnpj};
  // IE às vezes vem com zero(s) à esquerda diferentes entre notas (ex: "0011288860080"
  // vs "11288860080") — normaliza removendo antes de comparar.
  const normIe = s => onlyDigits(s).replace(/^0+/, '');
  const ieEntry = doc.ieDestRaw ? state.ieDest.find(x=>normIe(x.ie) && normIe(x.ie)===normIe(doc.ieDestRaw)) : null;
  const imovel = ieEntry ? ieEntry.imovel : state.config.imovelPadrao;
  const row = {
    id: uid++,
    selected:false,
    origem,
    data: doc.dataISO,
    documento: doc.documento,
    cnpj: onlyDigits(doc.cnpj),
    fornecedor: doc.fornecedor,
    categoria: '',
    contaDeved: match ? match.conta : '',
    contaCred: state.config.contaCredoraPadrao,
    codHist: match ? (match.codHist||'') : '',
    historico: match ? applyTemplate(match.historico, ctx) : '⚠ Sem regra correspondente — classificar manualmente',
    valor: doc.valor,
    imovel,
    tipoDoc: state.config.tipoDocPadrao,
    tipoLanc: state.config.tipoLancPadrao,
    produto: doc.produtoJoined || '',
    ncm: doc.ncmJoined || '', // guardado no HTML (atributo data-ncm da linha), não mostrado na UI
    revisar: !match,
    origemRegra: match ? match.origemRegra : 'Nenhuma'
  };
  if(match) row.categoria = findCategoriaLabel(match.conta, match.codHist);
  return row;
}

/* ============================== IMPORTAÇÃO DE ARQUIVOS ============================== */
async function handleFiles(fileList){
  const files = Array.from(fileList);
  let added = 0, skippedFiles = 0;
  const zona = document.getElementById('dropzone');
  for(let k=0;k<files.length;k++){
    const file = files[k];
    // Arquivo grande congelava a aba sem dizer nada: agora pelo menos diz
    // em qual está e desabilita a zona enquanto lê.
    if(zona){ zona.classList.add('lendo'); zona.querySelector('.big').textContent = 'Lendo ' + (k+1) + ' de ' + files.length + ': ' + file.name + '…'; }
    await new Promise(r=>setTimeout(r,0));
    const antes = state.lancamentos.length;
    let erro = '';
    try{
      // Mesmo arquivo de novo empilhava tudo em dobro, sem aviso nenhum.
      const jaVeio = (state.importacoes||[]).find(i=>i.arquivo===file.name && i.bytes===file.size);
      if(jaVeio && !(await NilmaDialogo.confirmar({titulo:'Importar este arquivo de novo?', texto:'"'+file.name+'" já foi importado em '+new Date(jaVeio.em).toLocaleString('pt-BR')+'. Importar de novo duplica os lançamentos.', acao:'Importar de novo', perigo:true}))){ skippedFiles++; continue; }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length){ skippedFiles++; erro = 'planilha vazia'; registrarImportacao(file, 0, erro); continue; }
      const headers = Object.keys(rows[0]);
      let doArquivo = 0;
      if(headers.includes('Valor_Transporte') || headers.includes('Prod_Predominante')){
        doArquivo = importCTe(rows);
      } else if(headers.includes('Produto') && headers.includes('Valor_Unitario')){
        doArquivo = importDetalhamento(rows);
      } else {
        skippedFiles++;
        erro = 'não é Detalhamento de Produtos nem CT-e';
        toast('Arquivo "'+file.name+'" não reconhecido (não é Detalhamento de Produtos nem CT-e).');
      }
      added += doArquivo;
      registrarImportacao(file, doArquivo, erro, state.lancamentos.slice(antes).map(r=>r.id));
    }catch(err){
      console.error(err);
      registrarImportacao(file, 0, err.message);
      toast('Erro ao ler "'+file.name+'": '+err.message);
    }
  }
  if(zona){ zona.classList.remove('lendo'); zona.querySelector('.big').textContent = 'Clique para escolher os arquivos, ou arraste aqui'; }
  save();
  render();
  if(added>0) toast(added+' lançamento(s) importado(s).');
  else if(skippedFiles>0 && added===0) toast('Nenhum lançamento novo importado.');
}

// Uma linha por arquivo lido: nome, data, quantos entraram, o que deu errado
// e quais lançamentos vieram dali — que é o que permite desfazer.
function registrarImportacao(file, quantos, erro, ids){
  if(!state.importacoes) state.importacoes = [];
  state.importacoes.unshift({
    id: Date.now() + Math.random(),
    arquivo: file.name, bytes: file.size, em: new Date().toISOString(),
    quantos: quantos || 0, erro: erro || '', ids: ids || []
  });
  state.importacoes = state.importacoes.slice(0, 40);
}

async function desfazerImportacao(id){
  const imp = (state.importacoes||[]).find(i=>String(i.id)===String(id));
  if(!imp || !imp.ids.length) return;
  if(!(await NilmaDialogo.confirmar({titulo:'Desfazer esta importação?', texto:'Saem os '+imp.ids.length+' lançamento(s) que vieram de "'+imp.arquivo+'".', acao:'Desfazer', perigo:true}))) return;
  const fora = new Set(imp.ids);
  state.lancamentos = state.lancamentos.filter(r=>!fora.has(r.id));
  imp.desfeita = new Date().toISOString();
  imp.ids = [];
  save(); render();
  toast('Importação desfeita.');
}

function importDetalhamento(rows){
  const cpfProdutor = onlyDigits(state.config.cpfProdutor);
  const groups = {};
  for(const r of rows){
    const numero = r.Numero, serie = r.Serie;
    if(!numero) continue;
    const status = String(r.Status||'');
    if(!status.startsWith('Autorizado')) continue;
    const tpnf = String(r.Tp_NF||'');
    if(tpnf !== 'Saída' && tpnf !== 'Saida') continue; // só compras (despesa); notas de Entrada = venda, fora do escopo
    const key = numero+'|'+serie;
    if(!groups[key]) groups[key] = {
      documento: buildDocumento(numero, serie),
      fornecedor: String(r.Rz_Emit||'').trim(),
      cnpj: onlyDigits(r.CNPJ_CPF_Emit),
      valor: Number(r.Valor_Total_Nota)||0,
      dataISO: excelDateToJS(r.Dt_Emissao),
      ieDestRaw: r.IE_Dest,
      produtos: [],
      linhas: []
    };
    const g = groups[key];
    const prod = String(r.Produto||'').trim();
    if(prod) g.produtos.push(prod);
    g.linhas.push({ncm:r.NCM, valor:Number(r.Valor_Produto)||0});
  }
  let count=0;
  for(const key in groups){
    const g = groups[key];
    g.produtoJoined = g.produtos.join(' | ');
    g.ncmJoined = [...new Set(g.linhas.map(l=>{
      let n = String(l.ncm||'').trim();
      if(/^\d+$/.test(n)) n = n.padStart(8,'0');
      return n;
    }).filter(Boolean))].join(', ');
    const row = buildLancamentoFromDoc(g, 'NF');
    state.lancamentos.push(row);
    count++;
  }
  return count;
}

function importCTe(rows){
  const cpfProdutor = onlyDigits(state.config.cpfProdutor);
  let count=0;
  for(const r of rows){
    const numero = r.Numero;
    if(!numero) continue;
    const status = String(r.Status||'');
    if(!status.startsWith('Autorizado')) continue;
    const destCnpj = onlyDigits(r.CNPJ_CPF_Dest);
    if(cpfProdutor && destCnpj !== cpfProdutor) continue; // frete não é do produtor (ex: pago pela trading)
    const doc = {
      documento: buildDocumento(numero, r.Serie),
      fornecedor: String(r.Rz_Emit||'').trim(),
      cnpj: onlyDigits(r.CNPJ_CPF_Emitente),
      valor: Number(r.Valor_Transporte)||0,
      dataISO: excelDateToJS(r.Dt_Emissao),
      ieDestRaw: null,
      produtoJoined: String(r.Prod_Predominante||'').trim(),
      linhas: []
    };
    const row = buildLancamentoFromDoc(doc, 'CTe');
    state.lancamentos.push(row);
    count++;
  }
  return count;
}

/* ============================== EXPORTAÇÃO ============================== */
// Sem conta devedora e com "⚠ Sem regra correspondente" no histórico, a
// linha ia pro arquivo entregue ao cliente do mesmo jeito. Agora é preciso
// dizer de novo que quer, sabendo quantas linhas vão assim.
async function exportPlanilha(){
  const pendentes = state.lancamentos.filter(r=>r.revisar);
  if(pendentes.length){
    const soma = pendentes.reduce((s,r)=>s+(Number(r.valor)||0),0);
    const ok = await NilmaDialogo.confirmar({titulo:'Baixar com lançamentos sem classificar?', acao:'Baixar assim mesmo', texto: pendentes.length + ' lançamento(s), somando R$ ' + fmtMoney(soma) + ', ainda não foram classificados.\n\nEles vão para a planilha sem conta e com o aviso de classificar manualmente no histórico.'});
    if(!ok) return;
  }
  const header = ['Lancamento Automatico','Data','Conta Devedora','Conta Credora','Codigo Historico','Historico','Valor','Documento','Imovel','Tipo de Documento','Tipo de Lancamento','CPF/CNPJ','Produto'];
  const rows = [header];
  const list = state.lancamentos.slice().sort((a,b)=> (a.data? new Date(a.data):0) - (b.data? new Date(b.data):0));
  for(const r of list){
    rows.push(['', fmtDateBR(r.data), r.contaDeved, r.contaCred, r.codHist, r.historico, Number(r.valor)||0, r.documento, r.imovel, r.tipoDoc, r.tipoLanc, r.cnpj, r.produto]);
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Lancamentos LCDPR');
  XLSX.writeFile(wb, 'Lancamentos_LCDPR.xls', {bookType:'biff8'});
}

/* ============================== NAVEGAÇÃO / RENDER ============================== */
// Menu (abas da casca) e submenu (a barrinha de categorias no alto do
// conteúdo), no mesmo padrão do Entregas: "Classificação" junta as telas
// de regras, e cada uma vira uma categoria do submenu. Categorias e regras
// de NCM eram uma página só de 143 linhas; agora cada uma tem a sua. O id
// "regras" fica (a tela aberta por último é guardada com ele).
const NAV = [
  {id:'importar', label:'Importar e conferir', icone:'ph-tray-arrow-down'},
  {id:'classificacao', label:'Classificação', icone:'ph-tag', sub:[
    {id:'categorias', label:'Categorias', icone:'ph-tag'},
    {id:'regras', label:'Regras de NCM', icone:'ph-barcode'},
    {id:'plano', label:'Plano de contas', icone:'ph-list-numbers'},
    {id:'tabelas', label:'Tabelas de apoio', icone:'ph-table'}
  ]},
  {id:'config', label:'Configuração geral', icone:'ph-gear'}
];
function itemDoMenu(tela){
  return NAV.find(item => item.id===tela || (item.sub && item.sub.some(s=>s.id===tela)));
}
function renderNav(){
  const el = document.getElementById('navlist');
  el.innerHTML = NAV.map(item=>{
    const ativo = itemDoMenu(state.currentScreen)===item;
    return `<button type="button" class="tab${ativo ? ' active' : ''}" data-nav="${item.id}"${ativo ? ' aria-current="page"' : ''}>` +
      `<span class="tab-ico"><i class="ph ${item.icone}" aria-hidden="true"></i></span><span class="tab-label">${esc(item.label)}</span></button>`;
  }).join('');
  el.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>{
    const item = NAV.find(x=>x.id===b.dataset.nav);
    // tocar no menu de um grupo abre a categoria em que a pessoa estava
    state.currentScreen = item && item.sub
      ? (item.sub.some(s=>s.id===state.currentScreen) ? state.currentScreen : item.sub[0].id)
      : b.dataset.nav;
    save(); render();
  }));
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  renderNav();
  const el = document.getElementById('screen');
  if(state.currentScreen==='importar') el.innerHTML = screenImportar();
  else if(state.currentScreen==='plano') el.innerHTML = screenPlano();
  else if(state.currentScreen==='categorias') el.innerHTML = screenCategorias();
  else if(state.currentScreen==='regras') el.innerHTML = screenRegras();
  else if(state.currentScreen==='tabelas') el.innerHTML = screenTabelas();
  else if(state.currentScreen==='config') el.innerHTML = screenConfig();
  const grupo = itemDoMenu(state.currentScreen);
  if(grupo && grupo.sub){
    el.insertAdjacentHTML('afterbegin',
      `<div class="nilma-topo"><div><h1>${esc(grupo.label)}</h1></div></div>` +
      `<div class="mode-toggle clientes-subnav aba-subnav" role="group" aria-label="Categorias">` +
      grupo.sub.map(s=>`<button type="button" class="mode-btn${s.id===state.currentScreen?' active':''}" data-sub="${s.id}"><i class="ph ${s.icone}" aria-hidden="true"></i> ${esc(s.label)}</button>`).join('') +
      `</div>`);
    el.classList.add('com-submenu');
    // No celular a faixa não cabe e rola de lado (sem barra visível): sem
    // isto, "Tabelas de apoio" ativa ficava meio cortada na borda direita.
    // Centraliza a categoria ativa só dentro da faixa (mexer em scrollLeft
    // não rola a página, ao contrário de scrollIntoView); o vizinho cortado
    // que sobra de cada lado mostra que dá para arrastar.
    const faixa = el.querySelector('.aba-subnav'), ativa = faixa && faixa.querySelector('.mode-btn.active');
    if(ativa && faixa.scrollWidth > faixa.clientWidth){
      const f = faixa.getBoundingClientRect(), a = ativa.getBoundingClientRect();
      faixa.scrollLeft += (a.left + a.width/2) - (f.left + f.width/2);
    }
    el.querySelectorAll('[data-sub]').forEach(b=>b.addEventListener('click', ()=>{
      state.currentScreen = b.dataset.sub; save(); render();
    }));
  } else el.classList.remove('com-submenu');
  wireScreen();
}

// Agrupa o que falta classificar pelo que ele tem em comum: mesmo NCM e
// mesmo fornecedor quase sempre é a mesma conta.
function gruposDeRevisar(){
  const mapa = new Map();
  state.lancamentos.filter(r=>r.revisar).forEach(r=>{
    const ncm = ncmDaLinha(r).slice(0,4);
    const chave = ncm + '|' + (r.fornecedor||'').toUpperCase();
    if(!mapa.has(chave)) mapa.set(chave, {chave, ncm, fornecedor:r.fornecedor||'(sem fornecedor)', linhas:[], valor:0});
    const g = mapa.get(chave);
    g.linhas.push(r);
    g.valor += Number(r.valor)||0;
  });
  return Array.from(mapa.values()).sort((a,b)=>b.linhas.length-a.linhas.length || b.valor-a.valor);
}

function aplicarNoGrupo(chave, catNome){
  const g = gruposDeRevisar().find(x=>x.chave===chave);
  if(!g || !catNome) return;
  const antes = g.linhas.map(r=>({id:r.id, dados:Object.assign({}, r)}));
  g.linhas.forEach(r=>applyCategoriaToRow(r, catNome));
  if(g.linhas[0]) talvezVirarRegra(g.linhas[0]);
  save(); render();
  toastComDesfazer(g.linhas.length + ' lançamento(s) classificados.', ()=>{
    antes.forEach(x=>{ const i = state.lancamentos.findIndex(r=>r.id===x.id); if(i!==-1) state.lancamentos[i] = x.dados; });
    save(); render();
  });
}

function findLanc(id){ return state.lancamentos.find(r=>r.id===Number(id)); }
function applyCategoriaToRow(row, catNome){
  const cat = state.categorias.find(c=>c.nome===catNome);
  row.categoria = catNome||'';
  if(cat){
    row.contaDeved = cat.conta;
    row.codHist = cat.codHist||'';
    row.historico = applyTemplate(cat.historico, {documento:row.documento, fornecedor:row.fornecedor, cnpj:row.cnpj});
    row.revisar = false;
    row.origemRegra = 'Manual';
  }
}

// O NCM da linha, com os zeros à esquerda que o Excel come.
function ncmDaLinha(row){
  const bruto = String(row.ncm||'').split(/[^0-9]+/).filter(Boolean)[0];
  if(!bruto) return '';
  return /^\d+$/.test(bruto) ? bruto.padStart(8,'0') : '';
}
// Já existe regra que pega esse NCM?
function regraQuePega(ncm){
  return state.ncmRules.find(r=>{ const p=String(r.prefixo||'').trim(); return p && ncm.startsWith(p); });
}
// Depois de classificar uma linha à mão, oferece transformar aquilo em regra.
// O prefixo sugerido é o capítulo de 4 dígitos: pega a família do produto
// sem casar com o país inteiro.
async function talvezVirarRegra(row){
  const ncm = ncmDaLinha(row);
  if(!ncm || !row.contaDeved) return;
  if(regraQuePega(ncm)) return;
  const prefixo = ncm.slice(0,4);
  const quantas = state.lancamentos.filter(r=>ncmDaLinha(r).startsWith(prefixo)).length;
  const ok = await NilmaDialogo.confirmar({titulo:'Classificar sempre o NCM ' + prefixo + '… na conta ' + row.contaDeved + '?', acao:'Criar regra', texto:
    'Vale para ' + quantas + ' lançamento(s) desta importação e para as próximas, sem passar por REVISAR.\n' +
    'Dá para mudar depois em Classificação › Regras de NCM.'});
  if(!ok) return;
  state.ncmRules.push({prefixo:prefixo, conta:row.contaDeved, codHist:row.codHist||'', historico:row.historico||''});
  // quem chamou já salvou antes da resposta do diálogo: salva a regra agora
  save(); render();
  toast('Regra criada para o NCM ' + prefixo + '.');
}

// Todas as listas editáveis seguem o mesmo molde: caixa com contador e o
// "+ Novo" no cabeçalho, uma linha por item, ✕ com borda no fim. Os campos
// mantêm data-arr/data-i/data-f/data-add/data-del — wireScreen() salva cada
// mudança sozinho, sem botão Salvar.
function campoTab(arr, i, f, v, rot, op){
  op = op||{};
  // Texto longo (nome, histórico, descrição) quebra a linha e cresce com o texto:
  // num campo de uma linha só se viam uns 30 caracteres do modelo no celular.
  if(op.longo) return `<textarea class="tbl-input tbl-longo" rows="1" data-arr="${arr}" data-i="${i}" data-f="${f}" aria-label="${rot}">${esc(v)}</textarea>`;
  // sem type="text": a regra comum de input[type=text] venceria a .tbl-input
  // e a linha voltaria a ter 42px de campo cinza.
  return `<input class="tbl-input${op.mono?' mono':''}" data-arr="${arr}" data-i="${i}" data-f="${f}" value="${esc(v)}" aria-label="${rot}"` +
    `${op.num?' inputmode="numeric"':''}>`;
}
// A célula leva o nome curto da coluna: no celular (sem cabeçalho) ele vira
// o rótulo de 12px em cima do campo — só o placeholder sumia ao preencher.
function celTab(arr, i, f, v, rot, op){
  return `<td data-rot="${(op&&op.ph)||rot}">${campoTab(arr, i, f, v, rot, op)}</td>`;
}

  const rows = state.planoContas.map((c,i)=>`<tr>
    ${celTab('planoContas',i,'codigo',c.codigo,'Código',{mono:1})}
    ${celTab('planoContas',i,'nome',c.nome,'Nome da conta',{longo:1})}
    ${celTab('planoContas',i,'classificacao',c.classificacao,'Classificação')}
    <td data-rot="Tipo"><select class="tbl-input" data-arr="planoContas" data-i="${i}" data-f="tipo" aria-label="Tipo">
      <option value="A" ${c.tipo==='A'?'selected':''}>Analítica</option>
      <option value="S" ${c.tipo==='S'?'selected':''}>Sintética</option>
    </select></td>
    <td class="c-del">${botaoRemover('planoContas',i)}</td>

    <div class="nilma-topo"><div><h1>Plano de contas</h1></div></div>
    ${caixaCadastro('Plano de contas', state.planoContas.length, '', 'planoContas', 'Nova conta', 'Nova conta',
      tabelaCadastro('plano', '<th class="c-cod">Código</th><th>Nome da conta</th><th class="c-clas">Classificação</th><th class="c-tipo">Tipo</th>',
        rows || linhaVazia(5, 'Nenhuma conta.')))}
  </section>`;
}

/* ============================== TELA: REGRAS DE NCM ============================== */
// A ORDEM das regras importa: vale o primeiro prefixo que casa (classifyNF e
// regraQuePega). Por isso o filtro só esconde linhas — não reordena nem
// remonta a tela — e data-i continua sendo o índice real da lista.
let filtroNcm = '';   // sobrevive ao render(), mas não vai pro backup nem pra nuvem
function screenRegras(){
  const rows = state.ncmRules.map((r,i)=>`<tr>
    ${celTab('ncmRules',i,'prefixo',r.prefixo,'NCM',{mono:1,num:1})}
    ${celTab('ncmRules',i,'conta',r.conta,'Conta',{mono:1})}
    ${celTab('ncmRules',i,'codHist',r.codHist,'Código do histórico',{mono:1,num:1,ph:'Cód. hist.'})}
    ${celTab('ncmRules',i,'historico',r.historico,'Histórico',{longo:1})}
    <td class="c-del">${botaoRemover('ncmRules',i)}</td>
  </tr>`).join('');
  const filtro = `<input type="search" class="input" id="filtroNcm" placeholder="Filtrar NCM ou conta" aria-label="Filtrar regras" value="${esc(filtroNcm)}">`;
  return `<section>
    <div class="nilma-topo"><div><h1>Regras de NCM</h1></div></div>
    ${caixaCadastro('Regras por NCM', state.ncmRules.length, filtro, 'ncmRules', 'Nova regra', 'Nova regra de NCM', VARIAVEIS_HIST +
      tabelaCadastro('ncm', '<th class="c-cod">NCM</th><th class="c-conta">Conta</th><th class="c-hist">Cód. hist.</th><th>Histórico</th>',
        rows ? rows + `<tr class="vazio" id="ncmNenhuma" hidden><td colspan="5">Nenhuma regra.</td></tr>` : linhaVazia(5, 'Nenhuma regra.')))}
  </section>`;
}
function aplicaFiltroNcm(){
  const campo = document.getElementById('filtroNcm');
  if(!campo) return;
  const q = campo.value.trim().toUpperCase();
  const soDigitos = /^\d+$/.test(q);
  const caixa = campo.closest('.caixa');
  const linhas = [...caixa.querySelectorAll('tbody tr:not(.vazio)')];
  let visiveis = 0;
  linhas.forEach(tr=>{
    const valores = [...tr.querySelectorAll('input, textarea')].map(i=>i.value.toUpperCase());
    // NCM completo (8 dígitos) também acha a regra de prefixo que o pega
    const pref = valores[0].trim();
    const ok = !q || valores.some(v=>v.includes(q)) || (soDigitos && pref && q.startsWith(pref));
    tr.hidden = !ok;
    if(ok) visiveis++;
  });
  caixa.querySelector('.contagem').textContent = q ? visiveis + ' de ' + linhas.length : linhas.length;
  const nenhuma = document.getElementById('ncmNenhuma');
  if(nenhuma) nenhuma.hidden = !(q && !visiveis);
}

/* ============================== TELA: TABELAS DE APOIO ============================== */
function tabelaCodigoDescricao(arr, titulo, addTxt, addRot){
  const rows = state[arr].map((r,i)=>`<tr>
    ${celTab(arr,i,'codigo',r.codigo,'Código',{mono:1})}
    ${celTab(arr,i,'descricao',r.descricao,'Descrição',{longo:1})}
    <td class="c-del">${botaoRemover(arr,i)}</td>
  </tr>`).join('');
  return caixaCadastro(titulo, state[arr].length, '', arr, addTxt, addRot,
    tabelaCadastro('2', '<th class="c-cod">Código</th><th>Descrição</th>', rows || linhaVazia(3, 'Nada cadastrado.')));
}
// Imóvel do vínculo por lista (antes era código digitado). Código gravado
// que não existe mais na lista continua como opção marcada: a tela não
// pode fingir outro imóvel.
function opcoesImovelIE(atual){
  const conhecido = state.imoveis.some(m=>m.codigo===atual);
  return (conhecido ? '' : `<option value="${esc(atual)}" selected>${esc(atual||'—')}</option>`) +
    state.imoveis.map(m=>`<option value="${esc(m.codigo)}" ${m.codigo===atual?'selected':''}>${esc(m.codigo)} — ${esc(m.descricao)}</option>`).join('');
}
// Imóveis e vínculos moram na mesma tela: editar um imóvel salva sem
// remontar (remontar tiraria o foco do campo seguinte), então as listas do
// vínculo são refeitas no lugar — senão ofereciam o código antigo.
function atualizaSelectsImovelIE(){
  document.querySelectorAll('select[data-arr="ieDest"][data-f="imovel"]').forEach(sel=>{
    const r = state.ieDest[Number(sel.dataset.i)];
    if(r) sel.innerHTML = opcoesImovelIE(r.imovel);
  });
}
function screenTabelas(){
  const ie = state.ieDest.map((r,i)=>{
    const opts = opcoesImovelIE(r.imovel);
    return `<tr>
      ${celTab('ieDest',i,'ie',r.ie,'IE do destinatário',{mono:1,ph:'IE'})}
      <td data-rot="Imóvel"><select class="tbl-input" data-arr="ieDest" data-i="${i}" data-f="imovel" aria-label="Imóvel">${opts}</select></td>
      <td class="c-del">${botaoRemover('ieDest',i)}</td>
    </tr>`;
  }).join('');
  return `<section>
    <div class="nilma-topo"><div><h1>Tabelas de apoio</h1></div></div>
    <div class="twocol tabelas-apoio">
      <div>
        ${tabelaCodigoDescricao('imoveis', 'Imóveis rurais', 'Novo imóvel', 'Novo imóvel rural')}
        ${caixaCadastro('IE → imóvel', state.ieDest.length, '', 'ieDest', 'Novo vínculo', 'Novo vínculo de IE a imóvel',
          tabelaCadastro('ie', '<th class="c-ie">IE</th><th>Imóvel</th>', ie || linhaVazia(3, 'Nada cadastrado.')))}
      </div>
      <div>
        ${tabelaCodigoDescricao('tipoDoc', 'Tipos de documento', 'Novo tipo', 'Novo tipo de documento')}
        ${tabelaCodigoDescricao('tipoLanc', 'Tipos de lançamento', 'Novo tipo', 'Novo tipo de lançamento')}
      </div>
    </div>
  </section>`;
}

/* ============================== TELA: CONFIG ============================== */
// Importar backup chama render(): sem lembrar, a dobra fechava e o botão
// que acabou de ser usado sumia. Não vai pra nuvem.
let backupAberto = false;
function screenConfig(){
  const c = state.config;
  const opcoes = (lista, atual) => lista.map(t=>`<option value="${esc(t.codigo)}" ${t.codigo===atual?'selected':''}>${esc(t.codigo)} — ${esc(t.descricao)}</option>`).join('');
  const catOptions = state.categorias.map(cat=>`<option value="${esc(cat.nome)}" ${cat.nome===c.categoriaFretesCTe?'selected':''}>${esc(cat.nome)}</option>`).join('');
  // Os ids do backup/limpeza precisam estar sempre na tela: wireScreen() liga
  // os quatro sem checar. Dentro do <details> fechado eles continuam no DOM.
  return `<section class="cfg-tela">
    <div class="nilma-topo"><div><h1>Configuração geral</h1></div></div>

    <div class="card"><h2>Produtor</h2>
    <div class="cfg-campos">
      <div class="field"><label for="cfgCpf">CPF/CNPJ</label><input type="text" id="cfgCpf" class="mono" inputmode="numeric" value="${esc(c.cpfProdutor)}"></div>
    </div>
    </div>

    <div class="card"><h2>Padrões do lançamento</h2>
    <div class="cfg-campos">
      <div class="field"><label for="cfgContaCred">Conta credora</label><input type="text" id="cfgContaCred" class="mono" value="${esc(c.contaCredoraPadrao)}"></div>
      <div class="field"><label for="cfgTipoDoc">Tipo de documento</label><select id="cfgTipoDoc">${opcoes(state.tipoDoc, c.tipoDocPadrao)}</select></div>
      <div class="field largo"><label for="cfgImovel">Imóvel</label><select id="cfgImovel">${opcoes(state.imoveis, c.imovelPadrao)}</select></div>
      <div class="field largo"><label for="cfgTipoLanc">Tipo de lançamento</label><select id="cfgTipoLanc">${opcoes(state.tipoLanc, c.tipoLancPadrao)}</select></div>
      <div class="field"><label for="cfgCatFretes">Categoria do CT-e (frete)</label><select id="cfgCatFretes">${catOptions}</select></div>
    </div>
    </div>

    <details class="card caixa cfg-raro" id="cfgRaro"${backupAberto?' open':''}>
      <summary class="card-head-row"><h2>Backup e limpeza</h2></summary>
      <div class="cfg-raro-acoes">
        <button type="button" class="btn" id="btnBackupExport"><i class="ph ph-download-simple" aria-hidden="true"></i>Exportar backup</button>
        <button type="button" class="btn" id="btnBackupImport"><i class="ph ph-upload-simple" aria-hidden="true"></i>Importar backup</button>
        <input type="file" id="backupFile" accept=".json" hidden>
        <span class="sep"></span>
        <button type="button" class="btn btn-danger" id="btnResetData"><i class="ph ph-trash" aria-hidden="true"></i>Limpar lançamentos importados</button>
      </div>
    </details>
  </section>`;
}

/* ============================== EVENTOS ============================== */
function wireScreen(){
  // Importar
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  if(dz){
    dz.addEventListener('click', ()=>fi.click());
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
    fi.addEventListener('change', ()=>{ if(fi.files.length) handleFiles(fi.files); fi.value=''; });
  }
  const searchBox = document.getElementById('searchBox');
  // Cada tecla remontava a tela inteira, e um remendo empurrava o cursor pro
  // fim — não dava pra corrigir uma letra no meio da palavra. Agora espera a
  // digitação parar e devolve o cursor onde estava.
  if(searchBox) searchBox.addEventListener('input', ()=>{
    state.ui.search = searchBox.value;
    const pos = searchBox.selectionStart;
    clearTimeout(buscaTimer);
    buscaTimer = setTimeout(()=>{
      render();
      const cx = document.getElementById('searchBox');
      if(cx){ cx.focus(); try{ cx.setSelectionRange(pos, pos); }catch(e){} }
    }, 200);
  });
  const toggleRev = document.getElementById('toggleRevisar');
  if(toggleRev) toggleRev.addEventListener('click', ()=>{ state.ui.showOnlyRevisar = !state.ui.showOnlyRevisar; save(); render(); });
  const btnExport = document.getElementById('btnExport');
  if(btnExport) btnExport.addEventListener('click', exportPlanilha);
  document.querySelectorAll('[data-grupo]').forEach(sel=>{
    sel.addEventListener('change', ()=>aplicarNoGrupo(sel.dataset.grupo, sel.value));
  });
  document.querySelectorAll('[data-desfazer]').forEach(b=>{
    b.addEventListener('click', ()=>desfazerImportacao(b.dataset.desfazer));
  });
  const bulkApply = document.getElementById('bulkApply');
  if(bulkApply) bulkApply.addEventListener('click', ()=>{
    const cat = document.getElementById('bulkCategoria').value;
    if(!cat) return;
    // Aplicar à seleção reescreve até 200 linhas de uma vez; o único
    // retrocesso era remover tudo e importar de novo.
    const antes = state.lancamentos.filter(r=>r.selected).map(r=>({id:r.id, dados:Object.assign({}, r)}));
    state.lancamentos.filter(r=>r.selected).forEach(r=>applyCategoriaToRow(r, cat));
    desfazerLote = antes;
    save(); render();
    toastComDesfazer(antes.length + ' lançamento(s) classificados.', ()=>{
      antes.forEach(x=>{ const i = state.lancamentos.findIndex(r=>r.id===x.id); if(i!==-1) state.lancamentos[i] = x.dados; });
      desfazerLote = null; save(); render();
    });
  });
  const selAllRevisar = document.getElementById('selectAllRevisar');
  if(selAllRevisar) selAllRevisar.addEventListener('click', ()=>{
    visibleLancamentos().filter(r=>r.revisar).forEach(r=>r.selected=true);
    save(); render();
  });
  const selAllVisible = document.getElementById('selectAllVisible');
  if(selAllVisible) selAllVisible.addEventListener('change', ()=>{
    visibleLancamentos().forEach(r=>r.selected = selAllVisible.checked);
    save(); render();
  });
  document.querySelectorAll('[data-sel]').forEach(cb=>cb.addEventListener('change', ()=>{
    const row = findLanc(cb.dataset.sel); if(row){ row.selected = cb.checked; save(); }
    const count = state.lancamentos.filter(r=>r.selected).length;
    document.querySelectorAll('.bulkbar span')[0] && (document.querySelectorAll('.bulkbar span')[0].textContent = count+' selecionada(s)');
  }));
  document.querySelectorAll('[data-catsel]').forEach(sel=>sel.addEventListener('change', ()=>{
    const row = findLanc(sel.dataset.catsel);
    if(row){ applyCategoriaToRow(row, sel.value); if(sel.value) talvezVirarRegra(row); save(); render(); }
  }));
  document.querySelectorAll('[data-expand]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = Number(btn.dataset.expand);
    state.ui.expandedId = (state.ui.expandedId===id) ? null : id;
    render();
  }));
  document.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('change', ()=>{
    const row = findLanc(inp.dataset.id);
    if(!row) return;
    let v = inp.value;
    if(inp.dataset.field==='valor'){ v = Number(String(v).replace(/\./g,'').replace(',','.'))||0; }
    row[inp.dataset.field] = v;
    if(inp.dataset.field!=='historico') row.revisar = row.revisar; // keep manual edits, don't auto-clear
    save();
  }));

  // Tabelas genéricas (planoContas, categorias, ncmRules, imoveis, ieDest, tipoDoc, tipoLanc)
  document.querySelectorAll('[data-arr]').forEach(inp=>{
    const evt = inp.tagName==='SELECT' ? 'change' : 'change';
    inp.addEventListener(evt, ()=>{
      const arr = state[inp.dataset.arr]; const i = Number(inp.dataset.i); const f = inp.dataset.f;
      // o histórico vai numa linha só do arquivo do LCDPR: quebra colada vira espaço
      if(inp.tagName==='TEXTAREA' && /\n/.test(inp.value)){ inp.value = inp.value.replace(/\s*\n\s*/g, ' '); ajustaAltura(inp); }
      if(arr && arr[i]){ arr[i][f] = inp.value; save(); }
      if(inp.dataset.arr==='imoveis') atualizaSelectsImovelIE();
    });
  });
  // Campo de texto longo: Enter não quebra linha (o texto é de uma linha só)
  // e, sem field-sizing (Firefox), a altura acompanha o texto por script.
  document.querySelectorAll('textarea.tbl-longo').forEach(ta=>{
    ta.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); ta.blur(); } });
    if(!CAMPO_CRESCE_SOZINHO){ ajustaAltura(ta); ta.addEventListener('input', ()=>ajustaAltura(ta)); }
  });
  // A linha nova ia pro fim de 125 regras, fora da tela e sem foco: agora
  // limpa o filtro (senão ela nasce escondida), rola até ela e foca o 1º campo.
  document.querySelectorAll('[data-add]').forEach(btn=>btn.addEventListener('click', ()=>{
    const arrName = btn.dataset.add;
    const blank = blankRowFor(arrName);
    state[arrName].push(blank);
    if(arrName==='ncmRules') filtroNcm = '';
    save(); render();
    const nova = document.querySelector(`[data-arr="${arrName}"][data-i="${state[arrName].length-1}"]`);
    if(nova){ nova.scrollIntoView({block:'center'}); nova.focus({preventScroll:true}); }
  }));
  // Remover era sem volta; o item volta pro mesmo lugar (a ordem das regras
  // de NCM decide qual vale). Exclusões seguidas somam no mesmo aviso e o
  // Desfazer devolve todas — antes o 2º aviso apagava a volta do 1º.
  document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', ()=>{
    const arrName = btn.dataset.del; const i = Number(btn.dataset.i);
    const [item] = state[arrName].splice(i,1);
    // o vizinho de baixo ancora a volta: se a nuvem trocar a lista enquanto
    // o aviso está aberto, o índice guardado já não aponta pro mesmo lugar
    removidosPendentes.push({arrName, i, item, depois: state[arrName][i]});
    save(); render();
    const n = removidosPendentes.length;
    toastComDesfazer(n===1 ? 'Removido.' : n + ' itens removidos.', desfazRemocoes, esqueceRemocoes);
  }));
  const campoFiltroNcm = document.getElementById('filtroNcm');
  if(campoFiltroNcm){
    campoFiltroNcm.addEventListener('input', ()=>{ filtroNcm = campoFiltroNcm.value; aplicaFiltroNcm(); });
    aplicaFiltroNcm();
  }

  // Config
  const cfgCpf = document.getElementById('cfgCpf');
  if(cfgCpf){
    const bind = (id, key, transform)=>{
      const el = document.getElementById(id);
      el.addEventListener('change', ()=>{ state.config[key] = transform? transform(el.value): el.value; save(); });
    };
    bind('cfgCpf','cpfProdutor', onlyDigits);
    bind('cfgContaCred','contaCredoraPadrao');
    bind('cfgImovel','imovelPadrao');
    bind('cfgTipoDoc','tipoDocPadrao');
    bind('cfgTipoLanc','tipoLancPadrao');
    bind('cfgCatFretes','categoriaFretesCTe');
    const dobraRaro = document.getElementById('cfgRaro');
    dobraRaro.addEventListener('toggle', ()=>{ backupAberto = dobraRaro.open; });

    document.getElementById('btnBackupExport').addEventListener('click', ()=>{
      const backup = {config:state.config, categorias:state.categorias, planoContas:state.planoContas, ncmRules:state.ncmRules, imoveis:state.imoveis, ieDest:state.ieDest, tipoDoc:state.tipoDoc, tipoLanc:state.tipoLanc};
      const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'backup_importador_lcdpr.json'; a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById('btnBackupImport').addEventListener('click', ()=>document.getElementById('backupFile').click());
    document.getElementById('backupFile').addEventListener('change', async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        const text = await file.text();
        const backup = JSON.parse(text);
        Object.assign(state, backup);
        save(); render();
        toast('Backup importado.');
      }catch(err){ toast('Backup inválido: '+err.message); }
      e.target.value='';
    });
    document.getElementById('btnResetData').addEventListener('click', async ()=>{
      if(await NilmaDialogo.confirmar({titulo:'Remover todos os lançamentos importados?', texto:'As regras e os cadastros continuam.', acao:'Remover tudo', perigo:true})){
        state.lancamentos = []; save(); render();
      }
    });
  }
}
const CAMPO_CRESCE_SOZINHO = typeof CSS!=='undefined' && CSS.supports && CSS.supports('field-sizing', 'content');
function ajustaAltura(ta){
  if(CAMPO_CRESCE_SOZINHO) return;
  ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px';
}
// Exclusões ainda desfazíveis (as do aviso aberto), da mais antiga à mais nova.
let removidosPendentes = [];
function esqueceRemocoes(){ removidosPendentes = []; }
function desfazRemocoes(){
  // da mais nova pra mais antiga: cada índice foi medido depois das anteriores
  removidosPendentes.slice().reverse().forEach(({arrName, i, item, depois})=>{
    const lista = state[arrName];
    let pos = -1;
    if(depois!==undefined){
      pos = lista.indexOf(depois);
      if(pos===-1){ const alvo = JSON.stringify(depois); pos = lista.findIndex(x=>JSON.stringify(x)===alvo); }
    }
    if(pos===-1) pos = depois===undefined ? lista.length : Math.min(i, lista.length);
    lista.splice(pos, 0, item);
  });
  removidosPendentes = [];
  save(); render();
}
function blankRowFor(arrName){
  switch(arrName){
    case 'planoContas': return {codigo:'', nome:'', classificacao:'', tipo:'A'};
    case 'categorias': return {nome:'', conta:'', codHist:'', historico:''};
    case 'ncmRules': return {prefixo:'', conta:'', codHist:'', historico:''};
    case 'imoveis': return {codigo:'', descricao:''};
    case 'ieDest': return {ie:'', imovel:''};
    case 'tipoDoc': return {codigo:'', descricao:''};
    case 'tipoLanc': return {codigo:'', descricao:''};
    default: return {};
  }
}

/* ============================== INIT ============================== */
startAccessCheck();
