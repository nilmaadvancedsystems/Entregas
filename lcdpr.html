<!DOCTYPE html>
<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importador LCDPR — Nilma Contabilidade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Mesmos tokens do app Entregas/Nilma Protocolos (ver DESIGN.md daquele
   repositório) — claro como padrão, uma superfície só, cor da marca contida. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2;
  --border:#E3E3E3; --border-forte:#C9C9C9;
  --ink:#1A1A1A; --ink-soft:#525252; --ink-faint:#6C6C6C;
  --accent:#9A2B24; --accent-ink:#FFFFFF; --accent-soft:#F7E7E5;
  --accent-2:#6B6F75; --accent-2-soft:#EAEAEC;
  --success:#17694A; --success-soft:#E2F2EA;
  --warning:#8A5D12; --warning-soft:#FAF0DC;
  --danger:#A8322F; --danger-soft:#FAE6E4; --danger-ink:#FFFFFF;
  --dose-forte:62%;
  --accent-forte:color-mix(in srgb, var(--accent) var(--dose-forte), var(--ink));
  --success-forte:color-mix(in srgb, var(--success) var(--dose-forte), var(--ink));
  --warning-forte:color-mix(in srgb, var(--warning) var(--dose-forte), var(--ink));
  --danger-forte:color-mix(in srgb, var(--danger) var(--dose-forte), var(--ink));
  --shadow:0 10px 28px -14px rgba(10,10,16,.45), 0 2px 6px -3px rgba(10,10,16,.18);
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px; --r-pill:999px;
  --font-body:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',SFMono-Regular,Consolas,monospace;
  --t-xs:.6875rem; --t-sm:.75rem; --t-base:.8125rem; --t-md:.875rem; --t-lg:1rem; --t-xl:1.25rem;
  --dur:180ms; --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#141414; --surface-2:#1E1E1E;
    --border:#2C2C2C; --border-forte:#404040;
    --ink:#F0F0F0; --ink-soft:#ADADAD; --ink-faint:#8C8C8C;
    --dose-forte:92%;
    --accent:#DE756B; --accent-ink:#26100E; --accent-soft:#38201D;
    --accent-2:#A9ADB2; --accent-2-soft:#2C2E33;
    --success:#4FC188; --success-soft:#14301F;
    --warning:#D9A857; --warning-soft:#322614;
    --danger:#E8827A; --danger-soft:#381C1A; --danger-ink:#2E100E;
    --shadow:0 10px 28px -14px rgba(0,0,0,.7), 0 2px 6px -3px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{box-sizing:border-box}
* { scrollbar-width: thin; scrollbar-color: var(--border-forte) transparent; }
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
h1{font-size:1.7rem} h2{font-size:var(--t-lg)} h3{font-size:var(--t-md)}
a{color:var(--accent-forte)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:var(--t-md);color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.app{display:flex;align-items:stretch;min-height:100vh}
.sidebar{width:250px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.brand .logo{width:38px;height:38px;flex:0 0 auto;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;border-radius:var(--r-md)}
.brand .t1{font-weight:700;font-size:13px;letter-spacing:-.01em}
.brand .t2{font-size:var(--t-xs);color:var(--ink-faint);margin-top:2px}
nav.navlist{padding:14px 0;flex:1;overflow-y:auto}
.navgroup{font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:16px 18px 6px}
.navbtn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink-soft);font-size:var(--t-md);padding:9px 18px;border-left:2px solid transparent;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.active{color:var(--accent-forte);background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.sidebar-foot{padding:12px 18px;border-top:1px solid var(--border);font-size:var(--t-xs);color:var(--ink-faint)}
main{flex:1;min-width:0;padding:34px 40px 80px}
.screen{max-width:1400px}
.hdr{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.kicker{font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-forte);margin-bottom:6px}
.desc{color:var(--ink-soft);max-width:76ch;margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:var(--t-base);padding:8px 14px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--ink);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:color-mix(in srgb, var(--accent) 88%, black)}
.btn-secondary{border-color:var(--border);background:var(--surface)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{color:var(--accent-forte);padding:4px 8px}
.btn-ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dropzone{border:2px dashed var(--border);border-radius:var(--r-lg);padding:34px 20px;text-align:center;color:var(--ink-faint);cursor:pointer;margin-bottom:20px;transition:border-color var(--dur) var(--ease)}
.dropzone:hover{border-color:var(--accent)}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .big{font-size:var(--t-md);color:var(--ink);font-weight:600;margin-bottom:4px}
.stats{display:flex;flex-wrap:wrap;margin-bottom:18px;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.stat{padding:12px 20px;min-width:130px;border-left:1px solid var(--border)}
.stat:first-child{border-left:none}
.stat b{display:block;font-size:1.35rem;font-weight:700;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:var(--t-xs);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{min-width:260px}
.bulkbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:9px 12px;background:var(--surface-2);border-radius:var(--r-sm);font-size:var(--t-base);color:var(--ink-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md)}
table.t{width:100%;border-collapse:collapse;font-size:var(--t-base)}
table.t th{text-align:left;font-size:var(--t-xs);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.t td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t tbody tr:hover{background:var(--surface-2)}
table.t tbody tr.revisar{background:var(--warning-soft)}
.tag{display:inline-flex;align-items:center;font-size:var(--t-xs);padding:2px 8px;border-radius:var(--r-pill);font-weight:600}
.tag-nf{background:var(--accent-soft);color:var(--accent-forte)}
.tag-cte{background:var(--accent-2-soft);color:var(--accent-2)}
.tag-warn{background:var(--warning-soft);color:var(--warning-forte)}
.tag-ncm{background:var(--success-soft);color:var(--success-forte)}
.tag-palavra{background:var(--accent-soft);color:var(--accent-forte)}
.tag-manual{background:var(--accent-2-soft);color:var(--accent-2)}
.tag-neutro{background:var(--surface-2);color:var(--ink-faint)}
.small{font-size:var(--t-sm);color:var(--ink-faint)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hint{color:var(--ink-soft);font-size:var(--t-base);max-width:74ch;margin:0 0 12px}
.card{border-top:1px solid var(--border);padding-top:16px;margin-bottom:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field label{display:block;font-size:var(--t-sm);color:var(--ink-soft);margin-bottom:5px}
.field input,.field select{width:100%}
.section-sep{height:1px;background:var(--border);margin:26px 0}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width: 900px){.twocol,.grid2{grid-template-columns:1fr}}
.icon-btn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);background:none;border:none;color:var(--ink-faint)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent-forte)}
.tbl-input{width:100%;min-width:70px;background:transparent;border:1px solid transparent;padding:4px 6px;border-radius:var(--r-xs)}
.tbl-input:hover{border-color:var(--border)}
.tbl-input:focus{background:var(--surface-2);border-color:var(--accent);box-shadow:none}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--ink);padding:11px 16px;border-radius:var(--r-sm);font-size:var(--t-base);box-shadow:var(--shadow);z-index:999;max-width:360px}
.badge-count{background:var(--accent);color:var(--accent-ink);font-size:var(--t-xs);border-radius:var(--r-pill);padding:1px 6px;margin-left:6px}
.truncate{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.chev{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);background:none;border:none;color:var(--ink-faint);transition:transform var(--dur) var(--ease)}
.chev:hover{background:var(--surface-2);color:var(--ink)}
.chev.open{transform:rotate(90deg)}
tr.row-detail td{background:var(--surface-2);padding:16px 18px;border-bottom:1px solid var(--border)}
tr.row-detail-hidden{display:none}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:12px}
.detail-field label{display:block;font-size:var(--t-xs);color:var(--ink-faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.detail-field input,.detail-field textarea{width:100%}
textarea.tbl-input{resize:vertical;min-height:38px;font-family:inherit}
.status-cell{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.gate[hidden],#app[hidden]{display:none}
.gate-box{max-width:360px;text-align:center}
.gate-box h1{font-size:var(--t-lg)}
.gate-box p{color:var(--ink-soft);font-size:var(--t-base)}
.back-link{display:flex;align-items:center;gap:6px;color:var(--ink-faint);font-size:var(--t-sm);text-decoration:none;padding:10px 18px;border-top:1px solid var(--border)}
.back-link:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <div class="brand" style="justify-content:center;margin-bottom:16px"><div class="logo">N</div></div>

</div>
<div class="app" id="app" hidden>
  <aside class="sidebar">

      <div class="logo">N</div>

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    // shallow-merge top level, keep saved arrays/objects if present
    const merged = Object.assign(d, parsed);
    merged.lancamentos = []; // lançamentos nunca ficam salvos — ver save()
    return merged;
  }catch(e){ console.warn('Falha ao carregar estado salvo, usando padrão.', e); return defaultState(); }
}
function save(){
  // Lançamentos importados NÃO ficam salvos (nem local, nem na nuvem) — são
  // dados de trabalho, recriados a qualquer momento reimportando os relatórios
  // do SIEG. Só regras/cadastros (que dão trabalho pra recriar) persistem.
  const { lancamentos, ...toPersist } = state;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toPersist));
  scheduleCloudSync();
}

function startAccessCheck(){
  if(!auth || !db){
    // Firebase indisponível (CDN falhou etc.) — não dá pra checar login;
    // libera acesso direto em vez de travar o app.
    showAppAndStart();
    return;
  }
  auth.onAuthStateChanged(async function(user){
    if(!user){
      showGate('Faça login', 'Entre pelo Entregas pra acessar o Importador LCDPR.',
        '<a class="back-link" style="border:none;display:inline-flex;justify-content:center" href="entregas.html">Ir para o login →</a>');
      return;
    }
    try{
      const snap = await db.collection('usuarios').doc(user.uid).get();
      const roles = snap.exists ? (snap.data().roles || []) : [];
      if(roles.includes('admin') || roles.includes('fiscal')){
        showAppAndStart();
      }else{
        showGate('Sem permissão', 'Sua conta não tem acesso ao Importador LCDPR. Peça pra um admin liberar o cargo Fiscal.',
          '<a class="back-link" style="border:none;display:inline-flex;justify-content:center" href="entregas.html">Voltar ao Entregas →</a>');

    }catch(e){

    }
  });
}

const SETTINGS_FIELDS = ['config','categorias','planoContas','ncmRules','imoveis','ieDest','tipoDoc','tipoLanc'];

async function bootstrapCloud(){
  if(!db){ cloudStatus='error'; renderSidebarFoot(); return; }
  try{
    const settingsSnap = await db.collection('lcdpr').doc('config').get();
    if(settingsSnap.exists){
      const d = settingsSnap.data();
      for(const k of SETTINGS_FIELDS) if(d[k]!==undefined) state[k] = d[k];
    }
    cloudReady = true; cloudStatus = 'ok';
    const { lancamentos, ...toPersist } = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toPersist)); // atualiza o cache local, sem reagendar sync
    render();
    renderSidebarFoot();
  }catch(e){
    console.warn('Não foi possível conectar à nuvem — usando dados salvos neste navegador.', e);
    cloudStatus = 'error';
    renderSidebarFoot();
  }
}
function scheduleCloudSync(){
  if(!db) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(syncSettingsToCloud, 700);
}
async function syncSettingsToCloud(){
  if(!db) return;
  try{
    const payload = {};
    for(const k of SETTINGS_FIELDS) payload[k] = state[k];
    await db.collection('lcdpr').doc('config').set(payload);
    if(cloudStatus!=='ok'){ cloudStatus='ok'; renderSidebarFoot(); }
  }catch(e){ console.warn('Falha ao sincronizar configurações com a nuvem.', e); cloudStatus='error'; renderSidebarFoot(); }
}
function renderSidebarFoot(){
  const el = document.getElementById('sidebarFoot');
  if(!el) return;
  el.textContent = cloudStatus==='ok' ? 'Sincronizado com a nuvem'
    : cloudStatus==='connecting' ? 'Conectando à nuvem…'
    : 'Sem conexão com a nuvem — salvo só neste navegador';
}

/* ============================== HELPERS ============================== */
function onlyDigits(s){ return String(s==null?'':s).replace(/\D/g,''); }
function fmtCnpjCpf(digits){
  digits = onlyDigits(digits);
  if(digits.length===11) return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  if(digits.length===14) return digits.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
  return digits;
}
function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDateBR(d){
  if(!d) return '';
  if(d instanceof Date) return d.toLocaleDateString('pt-BR');
  return String(d);
}
function excelDateToJS(v){
  if(v instanceof Date) return v;
  if(typeof v === 'number'){
    const parsed = XLSX.SSF.parse_date_code(v);
    if(parsed) return new Date(Date.UTC(parsed.y, parsed.m-1, parsed.d));
  }
  if(typeof v === 'string'){
    const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
    const d = new Date(v);
    if(!isNaN(d)) return d;
  }
  return null;
}
function normSerie(s){
  if(s===undefined||s===null||s==='') return '';
  const n = parseFloat(s);
  if(isNaN(n)) return String(s).trim();
  return String(n);
}
function buildDocumento(numero, serie){
  const num = String(numero||'').trim();
  const ser = normSerie(serie);
  if(!ser || ser==='1') return num;
  return num + '/' + ser;
}
function applyTemplate(tmpl, ctx){
  const cnpjFmt = fmtCnpjCpf(ctx.cnpj);
  return String(tmpl||'')
    .replaceAll('{{doc}}', ctx.documento||'')
    .replaceAll('{{fornecedor}}', ctx.fornecedor||'')
    .replaceAll('{{cnpj}}', cnpjFmt);
}
function findCategoriaLabel(conta, codHist){
  const c = state.categorias.find(c=>String(c.conta)===String(conta) && String(c.codHist||'')===String(codHist||''));
  return c ? c.nome : '';
}

/* ============================== CLASSIFICAÇÃO ============================== */
function classifyNF(doc){
  // NCM: um documento pode misturar itens de categorias diferentes (ex: nota de
  // combustível com um filtro de brinde). Em vez de decidir pela primeira linha
  // que bater uma regra, somamos o valor das linhas por regra e escolhemos a
  // regra cujo total responde pela maior parte do valor da nota — assim o item
  // principal manda, não o primeiro da lista.
  const totals = new Map(); // key: índice da regra -> {rule, total}
  for(const line of doc.linhas){
    let ncmStr = String(line.ncm||'').trim();
    // O Excel guarda NCM como número quando a célula não está formatada como texto,
    // o que apaga o(s) zero(s) à esquerda (ex: NCM real 01022190 vira "1022190").
    // Sem isso, nenhuma regra de capítulo 00-09 (carnes, frutas, café, gado...) bate.
    if(/^\d+$/.test(ncmStr)) ncmStr = ncmStr.padStart(8,'0');
    if(!ncmStr) continue;
    for(let i=0;i<state.ncmRules.length;i++){
      const rule = state.ncmRules[i];
      const pref = String(rule.prefixo||'').trim();
      if(pref && ncmStr.startsWith(pref)){
        const acc = totals.get(i) || {rule, total:0};
        acc.total += Number(line.valor)||0;
        totals.set(i, acc);
        break; // essa linha já achou sua regra, não avalia as demais pra ela
      }
    }
  }
  if(totals.size){
    let best = null;
    for(const acc of totals.values()){ if(!best || acc.total>best.total) best = acc; }
    return {conta:best.rule.conta, codHist:best.rule.codHist, historico:best.rule.historico, origemRegra:'NCM'};
  }
  // Sem NCM correspondente, vai pra REVISAR — classificação é só por NCM.
  return null;
}
function classifyCTe(doc){
  // CT-e não carrega NCM/produto confiável — mas ao contrário de uma nota de compra,
  // o serviço prestado é sempre frete, então a categoria padrão configurada é segura
  // independente da transportadora.
  const cat = state.categorias.find(c=>c.nome===state.config.categoriaFretesCTe);
  if(cat) return {conta:cat.conta, codHist:cat.codHist, historico:cat.historico, origemRegra:'Padrão CT-e'};
  return null;
}
function buildLancamentoFromDoc(doc, origem){
  const match = origem==='NF' ? classifyNF(doc) : classifyCTe(doc);
  const ctx = {documento:doc.documento, fornecedor:doc.fornecedor, cnpj:doc.cnpj};
  // IE às vezes vem com zero(s) à esquerda diferentes entre notas (ex: "0011288860080"
  // vs "11288860080") — normaliza removendo antes de comparar.
  const normIe = s => onlyDigits(s).replace(/^0+/, '');
  const ieEntry = doc.ieDestRaw ? state.ieDest.find(x=>normIe(x.ie) && normIe(x.ie)===normIe(doc.ieDestRaw)) : null;
  const imovel = ieEntry ? ieEntry.imovel : state.config.imovelPadrao;
  const row = {
    id: uid++,
    selected:false,
    origem,
    data: doc.dataISO,
    documento: doc.documento,
    cnpj: onlyDigits(doc.cnpj),
    fornecedor: doc.fornecedor,
    categoria: '',
    contaDeved: match ? match.conta : '',
    contaCred: state.config.contaCredoraPadrao,
    codHist: match ? (match.codHist||'') : '',
    historico: match ? applyTemplate(match.historico, ctx) : '⚠ Sem regra correspondente — classificar manualmente',
    valor: doc.valor,
    imovel,
    tipoDoc: state.config.tipoDocPadrao,
    tipoLanc: state.config.tipoLancPadrao,
    produto: doc.produtoJoined || '',
    ncm: doc.ncmJoined || '', // guardado no HTML (atributo data-ncm da linha), não mostrado na UI
    revisar: !match,
    origemRegra: match ? match.origemRegra : 'Nenhuma'
  };
  if(match) row.categoria = findCategoriaLabel(match.conta, match.codHist);
  return row;
}

/* ============================== IMPORTAÇÃO DE ARQUIVOS ============================== */
async function handleFiles(fileList){
  const files = Array.from(fileList);
  let added = 0, skippedFiles = 0;
  for(const file of files){
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length){ skippedFiles++; continue; }
      const headers = Object.keys(rows[0]);
      if(headers.includes('Valor_Transporte') || headers.includes('Prod_Predominante')){
        added += importCTe(rows);
      } else if(headers.includes('Produto') && headers.includes('Valor_Unitario')){
        added += importDetalhamento(rows);
      } else {
        skippedFiles++;
        toast('Arquivo "'+file.name+'" não reconhecido (não é Detalhamento de Produtos nem CT-e).');
      }
    }catch(err){
      console.error(err);
      toast('Erro ao ler "'+file.name+'": '+err.message);
    }
  }
  save();
  render();
  if(added>0) toast(added+' lançamento(s) importado(s).');
  else if(skippedFiles>0 && added===0) toast('Nenhum lançamento novo importado.');
}

function importDetalhamento(rows){
  const cpfProdutor = onlyDigits(state.config.cpfProdutor);
  const groups = {};
  for(const r of rows){
    const numero = r.Numero, serie = r.Serie;
    if(!numero) continue;
    const status = String(r.Status||'');
    if(!status.startsWith('Autorizado')) continue;
    const tpnf = String(r.Tp_NF||'');
    if(tpnf !== 'Saída' && tpnf !== 'Saida') continue; // só compras (despesa); notas de Entrada = venda, fora do escopo
    const key = numero+'|'+serie;
    if(!groups[key]) groups[key] = {
      documento: buildDocumento(numero, serie),
      fornecedor: String(r.Rz_Emit||'').trim(),
      cnpj: onlyDigits(r.CNPJ_CPF_Emit),
      valor: Number(r.Valor_Total_Nota)||0,
      dataISO: excelDateToJS(r.Dt_Emissao),
      ieDestRaw: r.IE_Dest,
      produtos: [],
      linhas: []
    };
    const g = groups[key];
    const prod = String(r.Produto||'').trim();
    if(prod) g.produtos.push(prod);
    g.linhas.push({ncm:r.NCM, valor:Number(r.Valor_Produto)||0});
  }
  let count=0;
  for(const key in groups){
    const g = groups[key];
    g.produtoJoined = g.produtos.join(' | ');
    g.ncmJoined = [...new Set(g.linhas.map(l=>{
      let n = String(l.ncm||'').trim();
      if(/^\d+$/.test(n)) n = n.padStart(8,'0');
      return n;
    }).filter(Boolean))].join(', ');
    const row = buildLancamentoFromDoc(g, 'NF');
    state.lancamentos.push(row);
    count++;
  }
  return count;
}

function importCTe(rows){
  const cpfProdutor = onlyDigits(state.config.cpfProdutor);
  let count=0;
  for(const r of rows){
    const numero = r.Numero;
    if(!numero) continue;
    const status = String(r.Status||'');
    if(!status.startsWith('Autorizado')) continue;
    const destCnpj = onlyDigits(r.CNPJ_CPF_Dest);
    if(cpfProdutor && destCnpj !== cpfProdutor) continue; // frete não é do produtor (ex: pago pela trading)
    const doc = {
      documento: buildDocumento(numero, r.Serie),
      fornecedor: String(r.Rz_Emit||'').trim(),
      cnpj: onlyDigits(r.CNPJ_CPF_Emitente),
      valor: Number(r.Valor_Transporte)||0,
      dataISO: excelDateToJS(r.Dt_Emissao),
      ieDestRaw: null,
      produtoJoined: String(r.Prod_Predominante||'').trim(),
      linhas: []
    };
    const row = buildLancamentoFromDoc(doc, 'CTe');
    state.lancamentos.push(row);
    count++;
  }
  return count;
}

/* ============================== EXPORTAÇÃO ============================== */
function exportPlanilha(){
  const header = ['Lancamento Automatico','Data','Conta Devedora','Conta Credora','Codigo Historico','Historico','Valor','Documento','Imovel','Tipo de Documento','Tipo de Lancamento','CPF/CNPJ','Produto'];
  const rows = [header];
  const list = state.lancamentos.slice().sort((a,b)=> (a.data? new Date(a.data):0) - (b.data? new Date(b.data):0));
  for(const r of list){
    rows.push(['', fmtDateBR(r.data), r.contaDeved, r.contaCred, r.codHist, r.historico, Number(r.valor)||0, r.documento, r.imovel, r.tipoDoc, r.tipoLanc, r.cnpj, r.produto]);
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Lancamentos LCDPR');
  XLSX.writeFile(wb, 'Lancamentos_LCDPR.xls', {bookType:'biff8'});
}

      <tbody>${ruleRows('ncmRules',[{k:'prefixo',w:'150px'},{k:'conta',w:'90px'},{k:'codHist',w:'90px'},{k:'historico'}])}</tbody>
    </table></div>
  </section>`;
}

    <div class="hdr">

/* ============================== TELA: CONFIG ============================== */
function screenConfig(){
  const c = state.config;
  const imovelOptions = state.imoveis.map(i=>`<option value="${esc(i.codigo)}" ${i.codigo===c.imovelPadrao?'selected':''}>${esc(i.codigo)} — ${esc(i.descricao)}</option>`).join('');
  const tipoDocOptions = state.tipoDoc.map(t=>`<option value="${esc(t.codigo)}" ${t.codigo===c.tipoDocPadrao?'selected':''}>${esc(t.codigo)} — ${esc(t.descricao)}</option>`).join('');
  const tipoLancOptions = state.tipoLanc.map(t=>`<option value="${esc(t.codigo)}" ${t.codigo===c.tipoLancPadrao?'selected':''}>${esc(t.codigo)} — ${esc(t.descricao)}</option>`).join('');
  const catOptions = state.categorias.map(cat=>`<option value="${esc(cat.nome)}" ${cat.nome===c.categoriaFretesCTe?'selected':''}>${esc(cat.nome)}</option>`).join('');
  return `<section>
    <div class="hdr">
      <div class="kicker">Sistema</div>
      <h1>Configuração geral</h1>
      <p class="desc">Padrões usados em toda linha gerada, e backup das suas configurações.</p>
    </div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>CPF/CNPJ do produtor (só números)</label><input id="cfgCpf" value="${esc(c.cpfProdutor)}"></div>
        <div class="field"><label>Conta credora padrão</label><input id="cfgContaCred" value="${esc(c.contaCredoraPadrao)}"></div>
      </div>
      <div class="grid2" style="margin-top:18px">
        <div class="field"><label>Imóvel padrão</label><select id="cfgImovel">${imovelOptions}</select></div>
        <div class="field"><label>Tipo de documento padrão</label><select id="cfgTipoDoc">${tipoDocOptions}</select></div>
      </div>
      <div class="grid2" style="margin-top:18px">
        <div class="field"><label>Tipo de lançamento padrão</label><select id="cfgTipoLanc">${tipoLancOptions}</select></div>
        <div class="field"><label>Categoria padrão p/ CT-e (frete)</label><select id="cfgCatFretes">${catOptions}</select></div>
      </div>
    </div>

    <h2>Backup</h2>
    <p class="hint">Exporte suas configurações e regras (sem os lançamentos importados) para restaurar depois ou levar pra outro computador.</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-secondary" id="btnBackupExport">Exportar backup (.json)</button>
      <button class="btn btn-secondary" id="btnBackupImport">Importar backup (.json)</button>
      <input type="file" id="backupFile" accept=".json" style="display:none">
      <button class="btn btn-ghost" id="btnResetData" style="margin-left:auto;color:var(--danger)">Limpar todos os lançamentos</button>
    </div>
  </section>`;
}

/* ============================== EVENTOS ============================== */
function wireScreen(){
  // Importar
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  if(dz){
    dz.addEventListener('click', ()=>fi.click());
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
    fi.addEventListener('change', ()=>{ if(fi.files.length) handleFiles(fi.files); fi.value=''; });
  }
  const searchBox = document.getElementById('searchBox');
  if(searchBox) searchBox.addEventListener('input', ()=>{ state.ui.search = searchBox.value; render(); document.getElementById('searchBox').focus(); document.getElementById('searchBox').selectionStart = document.getElementById('searchBox').value.length; });
  const toggleRev = document.getElementById('toggleRevisar');
  if(toggleRev) toggleRev.addEventListener('click', ()=>{ state.ui.showOnlyRevisar = !state.ui.showOnlyRevisar; save(); render(); });
  const btnExport = document.getElementById('btnExport');
  if(btnExport) btnExport.addEventListener('click', exportPlanilha);
  const bulkApply = document.getElementById('bulkApply');
  if(bulkApply) bulkApply.addEventListener('click', ()=>{
    const cat = document.getElementById('bulkCategoria').value;
    if(!cat) return;
    state.lancamentos.filter(r=>r.selected).forEach(r=>applyCategoriaToRow(r, cat));
    save(); render();
  });
  const selAllRevisar = document.getElementById('selectAllRevisar');
  if(selAllRevisar) selAllRevisar.addEventListener('click', ()=>{
    visibleLancamentos().filter(r=>r.revisar).forEach(r=>r.selected=true);
    save(); render();
  });
  const selAllVisible = document.getElementById('selectAllVisible');
  if(selAllVisible) selAllVisible.addEventListener('change', ()=>{
    visibleLancamentos().forEach(r=>r.selected = selAllVisible.checked);
    save(); render();
  });
  document.querySelectorAll('[data-sel]').forEach(cb=>cb.addEventListener('change', ()=>{
    const row = findLanc(cb.dataset.sel); if(row){ row.selected = cb.checked; save(); }
    const count = state.lancamentos.filter(r=>r.selected).length;
    document.querySelectorAll('.bulkbar span')[0] && (document.querySelectorAll('.bulkbar span')[0].textContent = count+' selecionada(s)');
  }));
  document.querySelectorAll('[data-catsel]').forEach(sel=>sel.addEventListener('change', ()=>{
    const row = findLanc(sel.dataset.catsel);
    if(row){ applyCategoriaToRow(row, sel.value); save(); render(); }
  }));
  document.querySelectorAll('[data-expand]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = Number(btn.dataset.expand);
    state.ui.expandedId = (state.ui.expandedId===id) ? null : id;
    render();
  }));
  document.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('change', ()=>{
    const row = findLanc(inp.dataset.id);
    if(!row) return;
    let v = inp.value;
    if(inp.dataset.field==='valor'){ v = Number(String(v).replace(/\./g,'').replace(',','.'))||0; }
    row[inp.dataset.field] = v;
    if(inp.dataset.field!=='historico') row.revisar = row.revisar; // keep manual edits, don't auto-clear
    save();
  }));

  // Tabelas genéricas (planoContas, categorias, ncmRules, imoveis, ieDest, tipoDoc, tipoLanc)
  document.querySelectorAll('[data-arr]').forEach(inp=>{
    const evt = inp.tagName==='SELECT' ? 'change' : 'change';
    inp.addEventListener(evt, ()=>{
      const arr = state[inp.dataset.arr]; const i = Number(inp.dataset.i); const f = inp.dataset.f;
      if(arr && arr[i]){ arr[i][f] = inp.value; save(); }
    });
  });
  document.querySelectorAll('[data-add]').forEach(btn=>btn.addEventListener('click', ()=>{
    const arrName = btn.dataset.add;
    const blank = blankRowFor(arrName);
    state[arrName].push(blank);
    save(); render();
  }));
  document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', ()=>{
    const arrName = btn.dataset.del; const i = Number(btn.dataset.i);
    state[arrName].splice(i,1);
    save(); render();
  }));

  // Config
  const cfgCpf = document.getElementById('cfgCpf');
  if(cfgCpf){
    const bind = (id, key, transform)=>{
      const el = document.getElementById(id);
      el.addEventListener('change', ()=>{ state.config[key] = transform? transform(el.value): el.value; save(); });
    };
    bind('cfgCpf','cpfProdutor', onlyDigits);
    bind('cfgContaCred','contaCredoraPadrao');
    bind('cfgImovel','imovelPadrao');
    bind('cfgTipoDoc','tipoDocPadrao');
    bind('cfgTipoLanc','tipoLancPadrao');
    bind('cfgCatFretes','categoriaFretesCTe');

    document.getElementById('btnBackupExport').addEventListener('click', ()=>{
      const backup = {config:state.config, categorias:state.categorias, planoContas:state.planoContas, ncmRules:state.ncmRules, imoveis:state.imoveis, ieDest:state.ieDest, tipoDoc:state.tipoDoc, tipoLanc:state.tipoLanc};
      const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'backup_importador_lcdpr.json'; a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById('btnBackupImport').addEventListener('click', ()=>document.getElementById('backupFile').click());
    document.getElementById('backupFile').addEventListener('change', async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        const text = await file.text();
        const backup = JSON.parse(text);
        Object.assign(state, backup);
        save(); render();
        toast('Backup importado.');
      }catch(err){ toast('Backup inválido: '+err.message); }
      e.target.value='';
    });
    document.getElementById('btnResetData').addEventListener('click', ()=>{
      if(confirm('Remover todos os lançamentos importados? As regras/cadastros não são afetadas.')){
        state.lancamentos = []; save(); render();
      }
    });
  }
}
function blankRowFor(arrName){
  switch(arrName){
    case 'planoContas': return {codigo:'', nome:'', classificacao:'', tipo:'A'};
    case 'categorias': return {nome:'', conta:'', codHist:'', historico:''};
    case 'ncmRules': return {prefixo:'', conta:'', codHist:'', historico:''};
    case 'imoveis': return {codigo:'', descricao:''};
    case 'ieDest': return {ie:'', imovel:''};
    case 'tipoDoc': return {codigo:'', descricao:''};
    case 'tipoLanc': return {codigo:'', descricao:''};
    default: return {};
  }
}

/* ============================== INIT ============================== */
startAccessCheck();
</script>
