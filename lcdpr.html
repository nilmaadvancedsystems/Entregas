<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importador LCDPR — Nilma Contabilidade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<!-- Aparência (tema, cor, texto, espaçamento, animação) igual à do Entregas:
     o script vem ANTES da folha e sem defer, senão a tela pisca no tema errado. -->
<script src="nilma-ui.js"></script>
<link rel="stylesheet" href="nilma-ui.css">
<style>
/* Tokens, base e componentes (botão, cartão, campo, chip, selo, aviso) vêm de
   nilma-ui.css, gerado do entregas.html. Aqui fica só o que é do LCDPR:
   a tabela de lançamentos, a área de arrastar arquivo e as etiquetas.
   Fonte é a do sistema (vem da folha): nada de letter-spacing nem peso 500
   — Segoe UI não tem 500, a hierarquia é só 400 e 600. */
h2 { font-size: var(--t-lg); line-height: var(--lh); margin: 0 0 var(--esp-2); }
h3 { font-size: var(--t-md); margin: 0 0 var(--esp-2); }
a { color: var(--accent-forte); }

.registro-import { margin-bottom: var(--esp-4); }
.registro-tab td { padding: 6px 8px; }
.badge-erro { color: var(--danger); font-weight: 600; }
.dropzone.lendo { opacity: .7; pointer-events: none; }

/* No celular, 8 colunas não cabem: a linha vira cartão e o rótulo da coluna
   vem junto do dado. Os alvos sobem pra 44px — é dedo, não mouse. */
@media (max-width: 800px) {
  .tablewrap { overflow-x: visible; }
  table.t thead { display: none; }
  table.t tr { display: block; padding: var(--esp-3) 0; border-bottom: 1px solid var(--border); }
  table.t td { display: flex; gap: var(--esp-2); align-items: center; padding: 3px 0; border: none; text-align: left !important; }
  table.t td[data-rot]::before { content: attr(data-rot); flex: none; min-width: 96px; font-size: var(--t-xs); color: var(--ink-faint); }
  table.t td select, table.t td .tbl-input { width: 100%; min-height: 44px; }
  .icon-btn, .chev { min-width: 44px; min-height: 44px; }
  .bulkbar select { min-width: 0; width: 100%; min-height: 44px; }
  .row-detail td { display: block; }
}

/* pendências agrupadas: uma decisão para as notas que são a mesma coisa */
.grupos-revisar { margin-bottom: var(--esp-4); }
.grupo-revisar {
  display: flex; gap: var(--esp-3); align-items: center; flex-wrap: wrap;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); margin-bottom: var(--esp-2);
}
.grupo-topo { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.grupo-topo .small { color: var(--ink-faint); }
.grupo-revisar select { flex: 0 1 260px; }

/* progresso da revisão: a pergunta é "dá pra exportar?", não "quantos são?" */
.progresso-lcdpr { margin: var(--esp-4) 0; }
.progresso-topo { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 var(--esp-3); font-size: var(--t-md); font-weight: 600; margin-bottom: 6px; }
.progresso-valor { color: var(--ink-soft); font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; } /* "R$" não se separa do valor no celular */
.progresso-lcdpr .barra { height: 8px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.progresso-lcdpr .barra span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width var(--dur) var(--ease); }
.progresso-pe { margin: 6px 0 0; color: var(--ink-soft); }

/* área de arrastar os relatórios do SIEG */
.dropzone {
  border: 1px dashed var(--border-forte); border-radius: var(--r-md); background: var(--surface);
  padding: var(--esp-6) var(--esp-4); text-align: center; color: var(--ink-faint); cursor: pointer;
  margin-bottom: var(--esp-4); transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--ink-soft); }
.dropzone .big { font-size: var(--t-md); color: var(--ink); font-weight: 600; margin-bottom: 4px; }

/* números do topo: sem caixa dentro de caixa, só uma régua de 1px entre eles */
.stats { display: flex; flex-wrap: wrap; gap: var(--esp-5); padding: 0 0 var(--esp-4); margin-bottom: var(--esp-4); border-bottom: 1px solid var(--border); }
/* número de contagem é sans com dígitos de mesma largura; mono fica pra CNPJ */
.stat b { display: block; font-size: var(--t-2xl); font-weight: 600; font-variant-numeric: tabular-nums; line-height: var(--lh-tight); }
.stat span { font-size: var(--t-sm); color: var(--ink-faint); }

.toolbar { display: flex; gap: var(--esp-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--esp-3); }
.toolbar input[type=search] { min-width: 260px; flex: 1 1 260px; }
.bulkbar {
  display: flex; gap: var(--esp-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--esp-3);
  padding: 8px 12px; background: var(--surface-2); border-radius: var(--r-md); font-size: var(--t-base); color: var(--ink-soft);
}
.bulkbar select { min-height: 34px; padding: 4px 8px; width: auto; min-width: 220px; max-width: 100%; }

/* tabela de lançamentos */
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); }
table.t { width: 100%; border-collapse: collapse; font-size: var(--t-base); }
table.t th {
  text-align: left; font-size: var(--t-sm); font-weight: 600; line-height: var(--lh-pill); color: var(--ink-soft); padding: 9px 10px;
  border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1;
}
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover { background: var(--surface-2); }
table.t tbody tr.revisar { background: var(--warning-soft); }
.tbl-input { width: 100%; min-width: 70px; background: transparent; border: 1px solid transparent; padding: 4px 6px; border-radius: var(--r-xs); min-height: 32px; }
.tbl-input:hover { border-color: var(--border); }
.tbl-input:focus { background: var(--surface); border-color: var(--accent); box-shadow: none; }
textarea.tbl-input { resize: vertical; min-height: 38px; font-family: inherit; }
tr.row-detail td { background: var(--surface-2); padding: var(--esp-4); }
tr.row-detail-hidden { display: none; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--esp-3); margin-bottom: var(--esp-3); }
.detail-field label { display: block; font-size: var(--t-sm); font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
.detail-field input, .detail-field textarea { width: 100%; }
.status-cell { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }

/* etiquetas: o mesmo formato do selo de situação do Entregas */
.tag { display: inline-flex; align-items: center; font-size: var(--t-xs); line-height: var(--lh-pill); padding: 1px 8px; border-radius: var(--r-pill); font-weight: 600; }
.tag-nf { background: var(--accent-soft); color: var(--accent-forte); }
.tag-cte { background: var(--accent-2-soft); color: var(--accent-2-forte, var(--accent-2)); }
.tag-warn { background: var(--warning-soft); color: var(--warning-forte); }
.tag-ncm { background: var(--success-soft); color: var(--success-forte); }
.tag-palavra { background: var(--accent-soft); color: var(--accent-forte); }
.tag-manual { background: var(--accent-2-soft); color: var(--accent-2-forte, var(--accent-2)); }
.tag-neutro { background: var(--surface-2); color: var(--ink-faint); }

.small { font-size: var(--t-sm); color: var(--ink-faint); }
/* mono só pro que se lê dígito a dígito: CPF/CNPJ e códigos. Data e valor usam .num */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hint { color: var(--ink-soft); font-size: var(--t-base); max-width: 74ch; margin: 0 0 var(--esp-3); }
.desc { color: var(--ink-soft); max-width: 76ch; margin: 0; }
.card { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); padding: var(--esp-4); margin-bottom: var(--esp-4); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--esp-4); }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: var(--esp-5); }
@media (max-width: 900px) { .twocol, .grid2 { grid-template-columns: 1fr; } }
/* rótulo de campo: 14/600 na cor do texto, igual ao do Entregas */
.field label { display: block; font-size: var(--t-base); font-weight: 600; color: var(--ink); margin-bottom: 5px; }
.field input, .field select { width: 100%; }
.section-sep { height: 1px; background: var(--border); margin: var(--esp-5) 0; }
.icon-btn, .chev {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--r-sm); background: none; border: 1px solid transparent; color: var(--ink-faint); cursor: pointer;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-forte); }
.chev:hover { background: var(--surface-2); color: var(--ink); }
.chev.open { transform: rotate(90deg); }
.badge-count { background: var(--accent); color: var(--accent-ink); font-size: var(--t-xs); font-weight: 600; line-height: var(--lh-pill); font-variant-numeric: tabular-nums; border-radius: var(--r-pill); padding: 0 6px; margin-left: 6px; }
.truncate { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.toast { right: 20px; left: auto; bottom: 20px; transform: none; max-width: 360px; }
.toast.show { transform: none; }

/* porta de entrada (sem login ainda) */
.gate { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
.gate[hidden], #app[hidden] { display: none; }
.gate-box { max-width: 380px; text-align: center; }
.gate-box h1 { font-size: var(--t-xl); margin-bottom: 6px; }
.gate-box p { color: var(--ink-soft); font-size: var(--t-base); margin: 0 0 var(--esp-2); }
/* Moldura comum (nilma-shell.js): barra de cima + abas. As abas do LCDPR têm
   rótulos de grupo e, no pé, o estado da nuvem (só no PC). */
.tabs-grupo { font-size: var(--t-sm); font-weight: 600; line-height: var(--lh-pill); color: var(--ink-soft); padding: var(--esp-4) 12px 4px; }
.tabs-grupo:first-child { padding-top: var(--esp-2); }
.tabs-pe { margin-top: auto; padding: var(--esp-3) 12px; font-size: var(--t-xs); color: var(--ink-faint); border-top: 1px solid var(--border); }
@media (max-width: 899px) { .tabs-grupo, .tabs-pe { display: none; } }
/* com submenu, o título é o do menu; o de cada categoria some */
.screen.com-submenu > section > .nilma-topo { display: none; }
.lcdpr-conteudo { max-width: 1180px; margin: 0 auto; padding: var(--esp-5) var(--esp-4) var(--esp-6); }
@media (min-width: 900px) { .lcdpr-conteudo { padding: var(--esp-5) var(--esp-6) var(--esp-6); } }
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <div class="nilma-marca" style="justify-content:center;padding:0 0 var(--esp-4)"><div class="nilma-marca-sigla">N</div></div>
    <h1 id="gateTitle">Conectando…</h1>
    <p id="gateMsg">Só um instante.</p>
    <p id="gateAction"></p>
  </div>
</div>

     As telas do LCDPR são as abas (fixas à esquerda no PC, sublinhadas no

<script src="nilma-shell.js"></script>
<script src="nilma-extras.js"></script>
<script>
  NilmaShell.montar({ modulo: 'Fiscal', moduloId: 'fiscal', buscaRotulo: 'Perguntar à IA', buscaIcone: 'ph-chats-circle', notas: false, buscaGlobal: false });
  // o LCDPR é um submódulo do Fiscal: "Nilma / Fiscal / Importador LCDPR"
  NilmaShell.definirSubmodulo('fiscal/lcdpr', 'Importador LCDPR');
  document.getElementById('topo').hidden = true;
</script>
<nav class="tabs" id="tabsNav" aria-label="Telas do LCDPR" hidden>
  <div id="navlist" style="display:contents"></div>
  <div class="tabs-pe" id="sidebarFoot">Conectando à nuvem…</div>
</nav>
<div id="app" hidden>
  <main class="lcdpr-conteudo"><div class="screen" id="screen"></div></main>
</div>

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const d = defaultState();
    // shallow-merge top level, keep saved arrays/objects if present
    const merged = Object.assign(d, parsed);
    merged.lancamentos = []; // lançamentos nunca ficam salvos — ver save()
    merged.importacoes = [];
    return merged;
  }catch(e){ console.warn('Falha ao carregar estado salvo, usando padrão.', e); return defaultState(); }
}
function save(){
  // Lançamentos importados NÃO ficam salvos (nem local, nem na nuvem) — são
  // dados de trabalho, recriados a qualquer momento reimportando os relatórios
  // do SIEG. Só regras/cadastros (que dão trabalho pra recriar) persistem.
  const { lancamentos, importacoes, ...toPersist } = state;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toPersist));
  scheduleCloudSync();
}

function showGate(title, msg, actionHtml){

  document.getElementById('gateMsg').textContent = msg;
  document.getElementById('gateAction').innerHTML = actionHtml || '';
  document.getElementById('gate').hidden = false;
  document.getElementById('app').hidden = true;

function startAccessCheck(){
  if(!auth || !db){
    // Firebase indisponível (CDN falhou etc.) — não dá pra checar login;
    // libera acesso direto em vez de travar o app.
    showAppAndStart();
    return;
  }
  auth.onAuthStateChanged(async function(user){
    if(!user){
      showGate('Faça login', 'Entre pelo Entregas pra acessar o Importador LCDPR.',
        '<a class="btn btn-secondary" href="entregas.html">Ir para o login →</a>');
      return;
    }
    try{
      const snap = await db.collection('usuarios').doc(user.uid).get();
      const roles = snap.exists ? (snap.data().roles || []) : [];
      const nome = (snap.exists && snap.data().nome) || user.displayName || user.email || '';
      const partes = String(nome).trim().split(/[\s.@]+/).filter(Boolean);
      const iniciais = partes.length ? (partes[0][0] + (partes.length > 1 ? partes[partes.length - 1][0] : '')).toUpperCase() : '';
      contaAtual = { nome: nome, foto: (snap.exists && snap.data().fotoPerfil) || '', iniciais: iniciais };
      NilmaShell.definirUsuario({
        nome: nome,
        iniciais: iniciais,
        foto: (snap.exists && snap.data().fotoPerfil) || '',
        podeVer: function (id, papel) { return !papel || roles.indexOf('admin') !== -1 || roles.indexOf(papel) !== -1; }
      });
      // tema, cor, texto, espaçamento e animação: os mesmos do Entregas
      if (snap.exists && window.NilmaUI) {
        window.NilmaUI.daConta(snap.data());
        window.NilmaUI.aoSalvar = function (campo, valor) {
          const dados = {}; dados[campo] = valor;
          db.collection('usuarios').doc(user.uid).update(dados).catch(function(){});
        };
      }
      if(roles.includes('admin') || roles.includes('fiscal')){
        showAppAndStart();
      }else{
        showGate('Sem permissão', 'Sua conta não tem acesso ao Importador LCDPR. Peça pra um admin liberar o cargo Fiscal.',
          '<a class="btn btn-secondary" href="entregas.html">Voltar ao Entregas →</a>');
      }
    }catch(e){
      console.warn('Falha ao checar permissão', e);
      showGate('Erro ao checar permissão', 'Tente recarregar a página.', '');
    }
  });
}

const SETTINGS_FIELDS = ['config','categorias','planoContas','ncmRules','imoveis','ieDest','tipoDoc','tipoLanc'];

async function bootstrapCloud(){
  if(!db){ cloudStatus='error'; renderSidebarFoot(); return; }
  try{
    const settingsSnap = await db.collection('lcdpr').doc('config').get();
    if(settingsSnap.exists){
      const d = settingsSnap.data();
      for(const k of SETTINGS_FIELDS) if(d[k]!==undefined) state[k] = d[k];
    }
    cloudReady = true; cloudStatus = 'ok';
    const { lancamentos, importacoes, ...toPersist } = state;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toPersist)); // atualiza o cache local, sem reagendar sync
    render();
    renderSidebarFoot();
  }catch(e){
    console.warn('Não foi possível conectar à nuvem — usando dados salvos neste navegador.', e);
    cloudStatus = 'error';
    renderSidebarFoot();
  }
}
function scheduleCloudSync(){
  if(!db) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(syncSettingsToCloud, 700);
}
async function syncSettingsToCloud(){
  if(!db) return;
  try{
    const payload = {};
    for(const k of SETTINGS_FIELDS) payload[k] = state[k];
    await db.collection('lcdpr').doc('config').set(payload);
    if(cloudStatus!=='ok'){ cloudStatus='ok'; renderSidebarFoot(); }
  }catch(e){ console.warn('Falha ao sincronizar configurações com a nuvem.', e); cloudStatus='error'; renderSidebarFoot(); }
}
function renderSidebarFoot(){
  const el = document.getElementById('sidebarFoot');
  if(!el) return;
  el.textContent = cloudStatus==='ok' ? 'Sincronizado com a nuvem'
    : cloudStatus==='connecting' ? 'Conectando à nuvem…'
    : 'Sem conexão com a nuvem — salvo só neste navegador';
}

/* ============================== HELPERS ============================== */
function onlyDigits(s){ return String(s==null?'':s).replace(/\D/g,''); }
function fmtCnpjCpf(digits){
  digits = onlyDigits(digits);
  if(digits.length===11) return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  if(digits.length===14) return digits.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
  return digits;
}
function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDateBR(d){
  if(!d) return '';
  if(d instanceof Date) return d.toLocaleDateString('pt-BR');
  return String(d);
}
function excelDateToJS(v){
  if(v instanceof Date) return v;
  if(typeof v === 'number'){
    const parsed = XLSX.SSF.parse_date_code(v);
    if(parsed) return new Date(Date.UTC(parsed.y, parsed.m-1, parsed.d));
  }
  if(typeof v === 'string'){
    const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
    const d = new Date(v);
    if(!isNaN(d)) return d;
  }
  return null;
}
function normSerie(s){
  if(s===undefined||s===null||s==='') return '';
  const n = parseFloat(s);
  if(isNaN(n)) return String(s).trim();
  return String(n);
}
function buildDocumento(numero, serie){
  const num = String(numero||'').trim();
  const ser = normSerie(serie);
  if(!ser || ser==='1') return num;
  return num + '/' + ser;
}
function applyTemplate(tmpl, ctx){
  const cnpjFmt = fmtCnpjCpf(ctx.cnpj);
  return String(tmpl||'')
    .replaceAll('{{doc}}', ctx.documento||'')
    .replaceAll('{{fornecedor}}', ctx.fornecedor||'')
    .replaceAll('{{cnpj}}', cnpjFmt);
}
function findCategoriaLabel(conta, codHist){
  const c = state.categorias.find(c=>String(c.conta)===String(conta) && String(c.codHist||'')===String(codHist||''));

}

let uid = 1;

/* ============================== CLASSIFICAÇÃO ============================== */
function classifyNF(doc){
  // NCM: um documento pode misturar itens de categorias diferentes (ex: nota de
  // combustível com um filtro de brinde). Em vez de decidir pela primeira linha
  // que bater uma regra, somamos o valor das linhas por regra e escolhemos a
  // regra cujo total responde pela maior parte do valor da nota — assim o item
  // principal manda, não o primeiro da lista.
  const totals = new Map(); // key: índice da regra -> {rule, total}
  for(const line of doc.linhas){
    let ncmStr = String(line.ncm||'').trim();
    // O Excel guarda NCM como número quando a célula não está formatada como texto,
    // o que apaga o(s) zero(s) à esquerda (ex: NCM real 01022190 vira "1022190").
    // Sem isso, nenhuma regra de capítulo 00-09 (carnes, frutas, café, gado...) bate.
    if(/^\d+$/.test(ncmStr)) ncmStr = ncmStr.padStart(8,'0');
    if(!ncmStr) continue;
    for(let i=0;i<state.ncmRules.length;i++){
      const rule = state.ncmRules[i];
      const pref = String(rule.prefixo||'').trim();
      if(pref && ncmStr.startsWith(pref)){
        const acc = totals.get(i) || {rule, total:0};
        acc.total += Number(line.valor)||0;
        totals.set(i, acc);
        break; // essa linha já achou sua regra, não avalia as demais pra ela
      }
    }
  }
  if(totals.size){
    let best = null;
    for(const acc of totals.values()){ if(!best || acc.total>best.total) best = acc; }
    return {conta:best.rule.conta, codHist:best.rule.codHist, historico:best.rule.historico, origemRegra:'NCM'};
  }
  // Sem NCM correspondente, vai pra REVISAR — classificação é só por NCM.
  return null;
}
function classifyCTe(doc){
  // CT-e não carrega NCM/produto confiável — mas ao contrário de uma nota de compra,
  // o serviço prestado é sempre frete, então a categoria padrão configurada é segura
  // independente da transportadora.
  const cat = state.categorias.find(c=>c.nome===state.config.categoriaFretesCTe);
  if(cat) return {conta:cat.conta, codHist:cat.codHist, historico:cat.historico, origemRegra:'Padrão CT-e'};
  return null;
}
function buildLancamentoFromDoc(doc, origem){
  const match = origem==='NF' ? classifyNF(doc) : classifyCTe(doc);
  const ctx = {documento:doc.documento, fornecedor:doc.fornecedor, cnpj:doc.cnpj};
  // IE às vezes vem com zero(s) à esquerda diferentes entre notas (ex: "0011288860080"
  // vs "11288860080") — normaliza removendo antes de comparar.
  const normIe = s => onlyDigits(s).replace(/^0+/, '');
  const ieEntry = doc.ieDestRaw ? state.ieDest.find(x=>normIe(x.ie) && normIe(x.ie)===normIe(doc.ieDestRaw)) : null;
  const imovel = ieEntry ? ieEntry.imovel : state.config.imovelPadrao;
  const row = {
    id: uid++,
    selected:false,
    origem,
    data: doc.dataISO,
    documento: doc.documento,
    cnpj: onlyDigits(doc.cnpj),
    fornecedor: doc.fornecedor,
    categoria: '',
    contaDeved: match ? match.conta : '',
    contaCred: state.config.contaCredoraPadrao,
    codHist: match ? (match.codHist||'') : '',
    historico: match ? applyTemplate(match.historico, ctx) : '⚠ Sem regra correspondente — classificar manualmente',
    valor: doc.valor,
    imovel,
    tipoDoc: state.config.tipoDocPadrao,
    tipoLanc: state.config.tipoLancPadrao,
    produto: doc.produtoJoined || '',
    ncm: doc.ncmJoined || '', // guardado no HTML (atributo data-ncm da linha), não mostrado na UI
    revisar: !match,
    origemRegra: match ? match.origemRegra : 'Nenhuma'
  };
  if(match) row.categoria = findCategoriaLabel(match.conta, match.codHist);
  return row;
}

/* ============================== IMPORTAÇÃO DE ARQUIVOS ============================== */
async function handleFiles(fileList){
  const files = Array.from(fileList);
  let added = 0, skippedFiles = 0;
  const zona = document.getElementById('dropzone');
  for(let k=0;k<files.length;k++){
    const file = files[k];
    // Arquivo grande congelava a aba sem dizer nada: agora pelo menos diz
    // em qual está e desabilita a zona enquanto lê.
    if(zona){ zona.classList.add('lendo'); zona.querySelector('.big').textContent = 'Lendo ' + (k+1) + ' de ' + files.length + ': ' + file.name + '…'; }
    await new Promise(r=>setTimeout(r,0));
    const antes = state.lancamentos.length;
    let erro = '';
    try{
      // Mesmo arquivo de novo empilhava tudo em dobro, sem aviso nenhum.
      const jaVeio = (state.importacoes||[]).find(i=>i.arquivo===file.name && i.bytes===file.size);
      if(jaVeio && !confirm('O arquivo "'+file.name+'" já foi importado em '+new Date(jaVeio.em).toLocaleString('pt-BR')+'.\n\nImportar de novo vai duplicar os lançamentos. Continuar?')){ skippedFiles++; continue; }
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length){ skippedFiles++; erro = 'planilha vazia'; registrarImportacao(file, 0, erro); continue; }
      const headers = Object.keys(rows[0]);
      let doArquivo = 0;
      if(headers.includes('Valor_Transporte') || headers.includes('Prod_Predominante')){
        doArquivo = importCTe(rows);
      } else if(headers.includes('Produto') && headers.includes('Valor_Unitario')){
        doArquivo = importDetalhamento(rows);
      } else {
        skippedFiles++;
        erro = 'não é Detalhamento de Produtos nem CT-e';
        toast('Arquivo "'+file.name+'" não reconhecido (não é Detalhamento de Produtos nem CT-e).');
      }
      added += doArquivo;
      registrarImportacao(file, doArquivo, erro, state.lancamentos.slice(antes).map(r=>r.id));
    }catch(err){
      console.error(err);
      registrarImportacao(file, 0, err.message);
      toast('Erro ao ler "'+file.name+'": '+err.message);
    }
  }
  if(zona){ zona.classList.remove('lendo'); zona.querySelector('.big').textContent = 'Clique para escolher os arquivos, ou arraste aqui'; }
  save();
  render();
  if(added>0) toast(added+' lançamento(s) importado(s).');
  else if(skippedFiles>0 && added===0) toast('Nenhum lançamento novo importado.');
}

// Uma linha por arquivo lido: nome, data, quantos entraram, o que deu errado
// e quais lançamentos vieram dali — que é o que permite desfazer.
function registrarImportacao(file, quantos, erro, ids){
  if(!state.importacoes) state.importacoes = [];
  state.importacoes.unshift({
    id: Date.now() + Math.random(),
    arquivo: file.name, bytes: file.size, em: new Date().toISOString(),
    quantos: quantos || 0, erro: erro || '', ids: ids || []
  });
  state.importacoes = state.importacoes.slice(0, 40);
}

function desfazerImportacao(id){
  const imp = (state.importacoes||[]).find(i=>String(i.id)===String(id));
  if(!imp || !imp.ids.length) return;
  if(!confirm('Remover os '+imp.ids.length+' lançamento(s) que vieram de "'+imp.arquivo+'"?')) return;
  const fora = new Set(imp.ids);
  state.lancamentos = state.lancamentos.filter(r=>!fora.has(r.id));
  imp.desfeita = new Date().toISOString();
  imp.ids = [];
  save(); render();
  toast('Importação desfeita.');
}

function importDetalhamento(rows){
  const cpfProdutor = onlyDigits(state.config.cpfProdutor);
  const groups = {};
  for(const r of rows){
    const numero = r.Numero, serie = r.Serie;
    if(!numero) continue;
    const status = String(r.Status||'');
    if(!status.startsWith('Autorizado')) continue;
    const tpnf = String(r.Tp_NF||'');
    if(tpnf !== 'Saída' && tpnf !== 'Saida') continue; // só compras (despesa); notas de Entrada = venda, fora do escopo
    const key = numero+'|'+serie;
    if(!groups[key]) groups[key] = {
      documento: buildDocumento(numero, serie),
      fornecedor: String(r.Rz_Emit||'').trim(),
      cnpj: onlyDigits(r.CNPJ_CPF_Emit),
      valor: Number(r.Valor_Total_Nota)||0,
      dataISO: excelDateToJS(r.Dt_Emissao),
      ieDestRaw: r.IE_Dest,
      produtos: [],
      linhas: []
    };
    const g = groups[key];
    const prod = String(r.Produto||'').trim();
    if(prod) g.produtos.push(prod);
    g.linhas.push({ncm:r.NCM, valor:Number(r.Valor_Produto)||0});
  }
  let count=0;
  for(const key in groups){
    const g = groups[key];
    g.produtoJoined = g.produtos.join(' | ');
    g.ncmJoined = [...new Set(g.linhas.map(l=>{
      let n = String(l.ncm||'').trim();
      if(/^\d+$/.test(n)) n = n.padStart(8,'0');
      return n;
    }).filter(Boolean))].join(', ');
    const row = buildLancamentoFromDoc(g, 'NF');
    state.lancamentos.push(row);
    count++;
  }
  return count;
}

function importCTe(rows){
  const cpfProdutor = onlyDigits(state.config.cpfProdutor);
  let count=0;
  for(const r of rows){
    const numero = r.Numero;
    if(!numero) continue;
    const status = String(r.Status||'');
    if(!status.startsWith('Autorizado')) continue;
    const destCnpj = onlyDigits(r.CNPJ_CPF_Dest);
    if(cpfProdutor && destCnpj !== cpfProdutor) continue; // frete não é do produtor (ex: pago pela trading)
    const doc = {
      documento: buildDocumento(numero, r.Serie),
      fornecedor: String(r.Rz_Emit||'').trim(),
      cnpj: onlyDigits(r.CNPJ_CPF_Emitente),
      valor: Number(r.Valor_Transporte)||0,
      dataISO: excelDateToJS(r.Dt_Emissao),
      ieDestRaw: null,
      produtoJoined: String(r.Prod_Predominante||'').trim(),
      linhas: []
    };
    const row = buildLancamentoFromDoc(doc, 'CTe');
    state.lancamentos.push(row);
    count++;
  }
  return count;
}

/* ============================== EXPORTAÇÃO ============================== */
// Sem conta devedora e com "⚠ Sem regra correspondente" no histórico, a
// linha ia pro arquivo entregue ao cliente do mesmo jeito. Agora é preciso
// dizer de novo que quer, sabendo quantas linhas vão assim.
function exportPlanilha(){
  const pendentes = state.lancamentos.filter(r=>r.revisar);
  if(pendentes.length){
    const soma = pendentes.reduce((s,r)=>s+(Number(r.valor)||0),0);
    const ok = confirm(pendentes.length + ' lançamento(s), somando R$ ' + fmtMoney(soma) + ', ainda não foram classificados.\n\nEles vão para a planilha sem conta e com o aviso de classificar manualmente no histórico.\n\nBaixar assim mesmo?');
    if(!ok) return;
  }
  const header = ['Lancamento Automatico','Data','Conta Devedora','Conta Credora','Codigo Historico','Historico','Valor','Documento','Imovel','Tipo de Documento','Tipo de Lancamento','CPF/CNPJ','Produto'];
  const rows = [header];
  const list = state.lancamentos.slice().sort((a,b)=> (a.data? new Date(a.data):0) - (b.data? new Date(b.data):0));
  for(const r of list){
    rows.push(['', fmtDateBR(r.data), r.contaDeved, r.contaCred, r.codHist, r.historico, Number(r.valor)||0, r.documento, r.imovel, r.tipoDoc, r.tipoLanc, r.cnpj, r.produto]);
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Lancamentos LCDPR');
  XLSX.writeFile(wb, 'Lancamentos_LCDPR.xls', {bookType:'biff8'});
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Agrupa o que falta classificar pelo que ele tem em comum: mesmo NCM e
// mesmo fornecedor quase sempre é a mesma conta.
function gruposDeRevisar(){
  const mapa = new Map();
  state.lancamentos.filter(r=>r.revisar).forEach(r=>{
    const ncm = ncmDaLinha(r).slice(0,4);
    const chave = ncm + '|' + (r.fornecedor||'').toUpperCase();
    if(!mapa.has(chave)) mapa.set(chave, {chave, ncm, fornecedor:r.fornecedor||'(sem fornecedor)', linhas:[], valor:0});
    const g = mapa.get(chave);
    g.linhas.push(r);
    g.valor += Number(r.valor)||0;
  });
  return Array.from(mapa.values()).sort((a,b)=>b.linhas.length-a.linhas.length || b.valor-a.valor);
}

function aplicarNoGrupo(chave, catNome){
  const g = gruposDeRevisar().find(x=>x.chave===chave);
  if(!g || !catNome) return;
  const antes = g.linhas.map(r=>({id:r.id, dados:Object.assign({}, r)}));
  g.linhas.forEach(r=>applyCategoriaToRow(r, catNome));
  if(g.linhas[0]) talvezVirarRegra(g.linhas[0]);
  save(); render();
  toastComDesfazer(g.linhas.length + ' lançamento(s) classificados.', ()=>{
    antes.forEach(x=>{ const i = state.lancamentos.findIndex(r=>r.id===x.id); if(i!==-1) state.lancamentos[i] = x.dados; });
    save(); render();
  });
}

function applyCategoriaToRow(row, catNome){
  const cat = state.categorias.find(c=>c.nome===catNome);
  row.categoria = catNome||'';
  if(cat){
    row.contaDeved = cat.conta;
    row.codHist = cat.codHist||'';
    row.historico = applyTemplate(cat.historico, {documento:row.documento, fornecedor:row.fornecedor, cnpj:row.cnpj});
    row.revisar = false;
    row.origemRegra = 'Manual';
  }
}

// O NCM da linha, com os zeros à esquerda que o Excel come.
function ncmDaLinha(row){
  const bruto = String(row.ncm||'').split(/[^0-9]+/).filter(Boolean)[0];
  if(!bruto) return '';
  return /^\d+$/.test(bruto) ? bruto.padStart(8,'0') : '';
}
// Já existe regra que pega esse NCM?
function regraQuePega(ncm){
  return state.ncmRules.find(r=>{ const p=String(r.prefixo||'').trim(); return p && ncm.startsWith(p); });
}
// Depois de classificar uma linha à mão, oferece transformar aquilo em regra.
// O prefixo sugerido é o capítulo de 4 dígitos: pega a família do produto
// sem casar com o país inteiro.
function talvezVirarRegra(row){
  const ncm = ncmDaLinha(row);
  if(!ncm || !row.contaDeved) return;
  if(regraQuePega(ncm)) return;
  const prefixo = ncm.slice(0,4);
  const quantas = state.lancamentos.filter(r=>ncmDaLinha(r).startsWith(prefixo)).length;
  const ok = confirm('Classificar sempre o NCM ' + prefixo + '… na conta ' + row.contaDeved + '?\n\n' +
    'Vale para ' + quantas + ' lançamento(s) desta importação e para as próximas, sem passar por REVISAR.\n' +
    'Dá para mudar depois em NCM & categorias.');
  if(!ok) return;
  state.ncmRules.push({prefixo:prefixo, conta:row.contaDeved, codHist:row.codHist||'', historico:row.historico||''});
  toast('Regra criada para o NCM ' + prefixo + '.');
}

/* ============================== EVENTOS ============================== */
function wireScreen(){
  // Importar
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  if(dz){
    dz.addEventListener('click', ()=>fi.click());
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
    dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
    fi.addEventListener('change', ()=>{ if(fi.files.length) handleFiles(fi.files); fi.value=''; });
  }
  const searchBox = document.getElementById('searchBox');
  // Cada tecla remontava a tela inteira, e um remendo empurrava o cursor pro
  // fim — não dava pra corrigir uma letra no meio da palavra. Agora espera a
  // digitação parar e devolve o cursor onde estava.
  if(searchBox) searchBox.addEventListener('input', ()=>{
    state.ui.search = searchBox.value;
    const pos = searchBox.selectionStart;
    clearTimeout(buscaTimer);
    buscaTimer = setTimeout(()=>{
      render();
      const cx = document.getElementById('searchBox');
      if(cx){ cx.focus(); try{ cx.setSelectionRange(pos, pos); }catch(e){} }
    }, 200);
  });
  const toggleRev = document.getElementById('toggleRevisar');
  if(toggleRev) toggleRev.addEventListener('click', ()=>{ state.ui.showOnlyRevisar = !state.ui.showOnlyRevisar; save(); render(); });
  const btnExport = document.getElementById('btnExport');
  if(btnExport) btnExport.addEventListener('click', exportPlanilha);
  document.querySelectorAll('[data-grupo]').forEach(sel=>{
    sel.addEventListener('change', ()=>aplicarNoGrupo(sel.dataset.grupo, sel.value));
  });
  document.querySelectorAll('[data-desfazer]').forEach(b=>{
    b.addEventListener('click', ()=>desfazerImportacao(b.dataset.desfazer));
  });
  const bulkApply = document.getElementById('bulkApply');
  if(bulkApply) bulkApply.addEventListener('click', ()=>{
    const cat = document.getElementById('bulkCategoria').value;
    if(!cat) return;
    // Aplicar à seleção reescreve até 200 linhas de uma vez; o único
    // retrocesso era remover tudo e importar de novo.
    const antes = state.lancamentos.filter(r=>r.selected).map(r=>({id:r.id, dados:Object.assign({}, r)}));
    state.lancamentos.filter(r=>r.selected).forEach(r=>applyCategoriaToRow(r, cat));
    desfazerLote = antes;
    save(); render();
    toastComDesfazer(antes.length + ' lançamento(s) classificados.', ()=>{
      antes.forEach(x=>{ const i = state.lancamentos.findIndex(r=>r.id===x.id); if(i!==-1) state.lancamentos[i] = x.dados; });
      desfazerLote = null; save(); render();
    });
  });
  const selAllRevisar = document.getElementById('selectAllRevisar');
  if(selAllRevisar) selAllRevisar.addEventListener('click', ()=>{
    visibleLancamentos().filter(r=>r.revisar).forEach(r=>r.selected=true);
    save(); render();
  });
  const selAllVisible = document.getElementById('selectAllVisible');
  if(selAllVisible) selAllVisible.addEventListener('change', ()=>{
    visibleLancamentos().forEach(r=>r.selected = selAllVisible.checked);
    save(); render();
  });
  document.querySelectorAll('[data-sel]').forEach(cb=>cb.addEventListener('change', ()=>{
    const row = findLanc(cb.dataset.sel); if(row){ row.selected = cb.checked; save(); }
    const count = state.lancamentos.filter(r=>r.selected).length;
    document.querySelectorAll('.bulkbar span')[0] && (document.querySelectorAll('.bulkbar span')[0].textContent = count+' selecionada(s)');
  }));
  document.querySelectorAll('[data-catsel]').forEach(sel=>sel.addEventListener('change', ()=>{
    const row = findLanc(sel.dataset.catsel);
    if(row){ applyCategoriaToRow(row, sel.value); if(sel.value) talvezVirarRegra(row); save(); render(); }
  }));
  document.querySelectorAll('[data-expand]').forEach(btn=>btn.addEventListener('click', ()=>{
    const id = Number(btn.dataset.expand);
    state.ui.expandedId = (state.ui.expandedId===id) ? null : id;
    render();
  }));
  document.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('change', ()=>{
    const row = findLanc(inp.dataset.id);
    if(!row) return;
    let v = inp.value;
    if(inp.dataset.field==='valor'){ v = Number(String(v).replace(/\./g,'').replace(',','.'))||0; }
    row[inp.dataset.field] = v;
    if(inp.dataset.field!=='historico') row.revisar = row.revisar; // keep manual edits, don't auto-clear
    save();
  }));

  // Tabelas genéricas (planoContas, categorias, ncmRules, imoveis, ieDest, tipoDoc, tipoLanc)
  document.querySelectorAll('[data-arr]').forEach(inp=>{
    const evt = inp.tagName==='SELECT' ? 'change' : 'change';
    inp.addEventListener(evt, ()=>{
      const arr = state[inp.dataset.arr]; const i = Number(inp.dataset.i); const f = inp.dataset.f;
      if(arr && arr[i]){ arr[i][f] = inp.value; save(); }
    });
  });
  document.querySelectorAll('[data-add]').forEach(btn=>btn.addEventListener('click', ()=>{
    const arrName = btn.dataset.add;
    const blank = blankRowFor(arrName);
    state[arrName].push(blank);
    save(); render();
  }));
  document.querySelectorAll('[data-del]').forEach(btn=>btn.addEventListener('click', ()=>{
    const arrName = btn.dataset.del; const i = Number(btn.dataset.i);
    state[arrName].splice(i,1);
    save(); render();
  }));

  // Config
  const cfgCpf = document.getElementById('cfgCpf');
  if(cfgCpf){
    const bind = (id, key, transform)=>{
      const el = document.getElementById(id);
      el.addEventListener('change', ()=>{ state.config[key] = transform? transform(el.value): el.value; save(); });
    };
    bind('cfgCpf','cpfProdutor', onlyDigits);
    bind('cfgContaCred','contaCredoraPadrao');
    bind('cfgImovel','imovelPadrao');
    bind('cfgTipoDoc','tipoDocPadrao');
    bind('cfgTipoLanc','tipoLancPadrao');
    bind('cfgCatFretes','categoriaFretesCTe');

    document.getElementById('btnBackupExport').addEventListener('click', ()=>{
      const backup = {config:state.config, categorias:state.categorias, planoContas:state.planoContas, ncmRules:state.ncmRules, imoveis:state.imoveis, ieDest:state.ieDest, tipoDoc:state.tipoDoc, tipoLanc:state.tipoLanc};
      const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'backup_importador_lcdpr.json'; a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById('btnBackupImport').addEventListener('click', ()=>document.getElementById('backupFile').click());
    document.getElementById('backupFile').addEventListener('change', async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        const text = await file.text();
        const backup = JSON.parse(text);
        Object.assign(state, backup);
        save(); render();
        toast('Backup importado.');
      }catch(err){ toast('Backup inválido: '+err.message); }
      e.target.value='';
    });
    document.getElementById('btnResetData').addEventListener('click', ()=>{
      if(confirm('Remover todos os lançamentos importados? As regras/cadastros não são afetadas.')){
        state.lancamentos = []; save(); render();
      }
    });
  }
}
function blankRowFor(arrName){
  switch(arrName){
    case 'planoContas': return {codigo:'', nome:'', classificacao:'', tipo:'A'};
    case 'categorias': return {nome:'', conta:'', codHist:'', historico:''};
    case 'ncmRules': return {prefixo:'', conta:'', codHist:'', historico:''};
    case 'imoveis': return {codigo:'', descricao:''};
    case 'ieDest': return {ie:'', imovel:''};
    case 'tipoDoc': return {codigo:'', descricao:''};
    case 'tipoLanc': return {codigo:'', descricao:''};
    default: return {};
  }
}

startAccessCheck();
