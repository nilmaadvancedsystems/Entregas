<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17191A">
<meta name="description" content="Tarefas e requisições por empresa, com responsável, prazo e status.">
<title>Tarefas — Nilma</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('nilma_tema');
    if (t === 'claro') document.documentElement.dataset.theme = 'light';
    else if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
    var p = localStorage.getItem('nilma_paleta');
    if (p && p !== 'padrao') document.documentElement.dataset.paleta = p;
    [['nilma_texto', 'texto', 'normal'], ['nilma_densidade', 'densidade', 'confortavel'], ['nilma_animacao', 'animacao', 'completa']].forEach(function (item) {
      var v = localStorage.getItem(item[0]);
      if (v && v !== item[2]) document.documentElement.dataset[item[1]] = v;
    });
  } catch (e) {}
})();
</script>

<style>
  /* ==========================================================================
     Tarefas — o "Notion" do escritório: tarefas e requisições por empresa,
     com responsável, prazo, prioridade e status. Lista (agrupada) e quadro
     (colunas por status); cada item abre num painel lateral com as
     propriedades, a descrição, o checklist e os comentários.
     ========================================================================== */
  main.conteudo { display: block; min-width: 0; padding: 0 32px 64px; }
  main.conteudo > div { max-width: 1216px; margin: 0 auto; }
  @media (max-width: 767px) { main.conteudo { padding: 0 16px 64px; } }

  .pagina-topo { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin: 24px 0 16px; }
  .pagina-topo h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.25; }
  .pagina-sub { margin: 4px 0 0; font-size: 14px; color: var(--ink-muted); }
  .pagina-sub:empty { display: none; }
  .topo-acoes { display: flex; gap: 8px; flex-wrap: wrap; }

  /* barra de filtros */
  .tf-barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tf-busca { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .tf-busca:focus-within { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tf-busca .ph { color: var(--ink-muted); }
  .tf-busca input { flex: 1; min-width: 0; height: auto; min-height: 0; margin: 0; padding: 0; border: 0; outline: 0; box-shadow: none; background: none; color: var(--ink); font: inherit; font-size: 14px; }
  .tf-barra .select { height: 32px; min-width: 0; max-width: 220px; font-size: 13px; }
  .tf-barra .select.ativo { border-color: var(--accent); }
  @media (max-width: 600px) { .tf-busca { flex-basis: 100%; } .tf-barra .select { flex: 1 1 40%; max-width: none; } }

  /* lista (tabela do Notion), agrupada */
  .tf-grupo { margin-bottom: 20px; }
  .tf-grupo-cab { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 13px; font-weight: 600; color: var(--ink-muted); }
  .tf-grupo-cab .n { font-weight: 400; }
  .tf-grupo-cab button.dobra { border: 0; background: none; color: inherit; padding: 2px; cursor: pointer; display: inline-flex; }
  .tf-grupo.dobrado .tf-tabela { display: none; }
  .tf-grupo.dobrado .dobra .ph { transform: rotate(-90deg); }
  .tf-tabela { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); overflow: hidden; }
  .tf-linha { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 220px) 150px 96px 92px; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px 4px 8px; cursor: pointer; }
  .tf-linha + .tf-linha { border-top: 1px solid var(--border-muted, var(--border)); }
  .tf-linha:hover { background: var(--surface-2); }
  .tf-linha.aberta-agora { background: var(--hover-bg); }
  .tf-linha .tit { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; }
  .tf-linha .tit .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tf-linha.feita .tit .txt { text-decoration: line-through; color: var(--ink-muted); }
  .tf-linha .tit .ph { flex: none; font-size: 14px; color: var(--ink-muted); }
  .tf-linha .emp, .tf-linha .resp, .tf-linha .prazo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--ink-muted); }
  .tf-linha .emp { color: var(--ink); }
  .tf-nova-linha { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--border-muted, var(--border)); color: var(--ink-muted); font-size: 13px; }
  .tf-nova-linha input { flex: 1; min-width: 0; height: 28px; min-height: 0; padding: 2px 6px; border: 0; background: none; box-shadow: none; color: var(--ink); font: inherit; font-size: 14px; outline: 0; }
  .tf-nova-linha:focus-within { background: var(--surface-2); }
  @media (max-width: 900px) {
    .tf-linha { grid-template-columns: 28px minmax(0, 1fr) auto; grid-template-areas: 'c t p' 'c e e'; row-gap: 2px; padding: 8px 12px 8px 8px; }
    .tf-linha .ck { grid-area: c; align-self: start; } .tf-linha .tit { grid-area: t; } .tf-linha .prio { grid-area: p; }
    .tf-linha .emp { grid-area: e; font-size: 12px; color: var(--ink-muted); }
    .tf-linha .emp::after { content: attr(data-extra); }
    .tf-linha .resp, .tf-linha .prazo { display: none; }
  }

  /* marcar feito */
  .tf-check { width: 18px; height: 18px; margin: 0; padding: 0; border: 1.5px solid var(--border-strong); border-radius: 50%; background: none; cursor: pointer; display: inline-grid; place-items: center; color: transparent; }
  .tf-check:hover { border-color: var(--success); color: var(--success); }
  .tf-check .ph { font-size: 11px; }
  .tf-check.feito { background: var(--success); border-color: var(--success); color: #FFFFFF; }

  /* selos de status e prioridade */
  .tf-status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 2em; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-3); color: var(--ink); }
  .tf-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .8; }
  .tf-status.afazer { color: var(--ink-muted); }
  .tf-status.andamento { color: #1F6FEB; background: color-mix(in srgb, #1F6FEB 14%, transparent); }
  .tf-status.aguardando { color: var(--warn); background: var(--warn-soft); }
  .tf-status.feito { color: var(--success-ink, var(--success)); background: var(--success-soft); }
  .tf-prio { display: inline-block; padding: 1px 8px; border-radius: 2em; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); color: var(--ink-muted); }
  .tf-prio.alta { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
  .tf-prio.urgente { color: #FFFFFF; background: var(--accent); border-color: var(--accent); }
  .tf-prio.baixa { opacity: .75; }
  .prazo.atrasado { color: var(--destructive) !important; font-weight: 600; }
  .prazo.hoje { color: var(--warn) !important; font-weight: 600; }
  .tf-req { flex: none; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); }
  .tf-pessoa { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .tf-avatar { flex: none; width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 600; background: var(--surface-3); color: var(--ink); border: 1px solid var(--border); }

  /* quadro */
  .tf-quadro { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 8px; }
  .tf-coluna { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px; min-height: 120px; }
  .tf-coluna.alvo { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tf-coluna-cab { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; font-size: 13px; color: var(--ink-muted); }
  .tf-cartao { display: block; width: 100%; margin: 0 0 8px; padding: 10px 12px; text-align: left; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; box-shadow: var(--shadow-xs); }
  .tf-cartao:hover { border-color: var(--border-strong); }
  .tf-cartao.arrastando { opacity: .5; }
  .tf-cartao .tit { font-size: 14px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
  .tf-cartao .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; font-size: 12px; color: var(--ink-muted); }
  .tf-coluna .tf-add { width: 100%; justify-content: flex-start; color: var(--ink-muted); }
  @media (max-width: 767px) { .tf-quadro { grid-template-columns: repeat(4, 82vw); scroll-snap-type: x mandatory; } .tf-coluna { scroll-snap-align: start; } }

  /* empresas */
  .tf-emp-linha { display: grid; grid-template-columns: minmax(0, 1fr) 220px 90px 110px 110px; align-items: center; gap: 12px; min-height: 44px; padding: 6px 12px; cursor: pointer; }
  .tf-emp-linha + .tf-emp-linha { border-top: 1px solid var(--border-muted, var(--border)); }
  .tf-emp-linha:hover { background: var(--surface-2); }
  .tf-emp-linha.cab { cursor: default; min-height: 36px; font-size: 12px; font-weight: 600; color: var(--ink-muted); background: var(--surface-2); }
  .tf-emp-linha .nome { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
  .tf-emp-linha .num { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
  .tf-emp-linha .select { height: 30px; min-height: 30px; font-size: 13px; width: 100%; }
  @media (max-width: 900px) { .tf-emp-linha { grid-template-columns: minmax(0, 1fr) auto; } .tf-emp-linha > :nth-child(n+3) { display: none; } .tf-emp-linha.cab { display: none; } }

  .tf-emp-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .tf-props-emp { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 8px 0 20px; font-size: 13px; color: var(--ink-muted); }
  .tf-props-emp b { color: var(--ink); font-weight: 500; }
  .tf-props-emp .select { height: 28px; min-height: 28px; font-size: 13px; }
  .tf-secao-tit { display: flex; align-items: center; gap: 8px; margin: 20px 0 8px; font-size: 15px; font-weight: 600; }
  .tf-vazio { padding: 24px 16px; text-align: center; font-size: 14px; color: var(--ink-muted); }
  .tf-voltar { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; border: 0; background: none; color: var(--ink-muted); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
  .tf-voltar:hover { color: var(--ink); }

  /* painel lateral (o "peek" do Notion) */
  .tf-peek-fundo { position: fixed; inset: 0; z-index: 60; background: #1F232833; }
  .tf-peek { position: fixed; top: 0; right: 0; bottom: 0; z-index: 61; width: min(560px, 100vw); display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); animation: tfEntra .18s cubic-bezier(.2, .8, .2, 1); }
  @keyframes tfEntra { from { transform: translateX(24px); opacity: 0; } }
  .tf-peek-topo { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .tf-peek-topo .esp { flex: 1; }
  .tf-peek-corpo { flex: 1; overflow-y: auto; padding: 20px 24px 32px; }
  .tf-titulo { width: 100%; margin: 0 0 16px; padding: 0; border: 0; outline: 0; background: none; box-shadow: none; resize: none; color: var(--ink); font: inherit; font-size: 22px; font-weight: 700; line-height: 1.3; min-height: 0; height: auto; overflow: hidden; }
  .tf-titulo::placeholder { color: var(--ink-muted); opacity: .6; }
  .tf-props { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 4px 12px; align-items: center; margin-bottom: 20px; }
  .tf-props > .rot { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 13px; color: var(--ink-muted); }
  .tf-props > .rot .ph { font-size: 15px; }
  .tf-props .select, .tf-props .input { width: 100%; height: 32px; min-height: 32px; font-size: 13px; border-color: transparent; background: none; box-shadow: none; }
  .tf-props .select:hover, .tf-props .input:hover { background: var(--hover-bg); }
  .tf-props .select:focus, .tf-props .input:focus { border-color: var(--accent); background: var(--surface); }
  .tf-bloco-tit { margin: 20px 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-muted); }
  .tf-descricao { width: 100%; min-height: 120px; resize: vertical; font: inherit; font-size: 14px; line-height: 1.55; }
  .tf-salvo { font-size: 12px; color: var(--ink-muted); min-height: 16px; }
  .tf-check-item { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 14px; }
  .tf-check-item input[type=checkbox] { margin: 0; flex: none; }
  .tf-check-item.ok span { text-decoration: line-through; color: var(--ink-muted); }
  .tf-check-item .tirar { margin-left: auto; opacity: 0; }
  .tf-check-item:hover .tirar { opacity: 1; }
  .tf-check-novo { width: 100%; height: 32px; min-height: 32px; font-size: 14px; }
  .tf-coment { padding: 10px 0; border-top: 1px solid var(--border-muted, var(--border)); font-size: 14px; }
  .tf-coment .quem { font-size: 12px; color: var(--ink-muted); margin-bottom: 2px; }
  .tf-coment .quem b { color: var(--ink); font-weight: 600; }
  .tf-coment-novo { display: flex; gap: 8px; margin-top: 8px; }
  .tf-coment-novo textarea { flex: 1; min-height: 38px; height: 38px; resize: vertical; font: inherit; font-size: 14px; }
  .tf-rodape { margin-top: 24px; font-size: 12px; color: var(--ink-muted); }
  .tf-peek-acoes { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--border); background: var(--surface-2); }
  @media (max-width: 600px) { .tf-props { grid-template-columns: 110px minmax(0, 1fr); } .tf-peek-corpo { padding: 16px; } }

  /* empresa com busca (no painel) */
  .tf-emp-escolha { position: relative; }
  .tf-emp-lista { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; max-height: 260px; overflow-y: auto; padding: 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow-lg); }
  .tf-emp-lista button { display: block; width: 100%; padding: 6px 10px; border: 0; border-radius: 4px; background: none; color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .tf-emp-lista button:hover, .tf-emp-lista button.marcado { background: var(--hover-bg); }

  /* faixa de resumo (clicável: filtra) */
  .tf-resumo { display: flex; gap: 8px; flex-wrap: wrap; margin: -4px 0 16px; }
  .tf-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
  .tf-chip b { font-variant-numeric: tabular-nums; }
  .tf-chip:hover { background: var(--surface-2); }
  .tf-chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tf-chip.vermelho b { color: var(--destructive); } .tf-chip.amarelo b { color: var(--warn); }
  .tf-chip:disabled { opacity: .55; cursor: default; }
  /* selo de status que troca na hora (menu) */
  button.tf-status { border: 0; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .tf-menu { position: fixed; z-index: 80; min-width: 180px; padding: 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow-lg); }
  .tf-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 4px; background: none; color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .tf-menu button:hover, .tf-menu button:focus-visible { background: var(--hover-bg); outline: 0; }
  @media (min-width: 901px) {
    .tf-tabela.sem-empresa .tf-linha { grid-template-columns: 28px minmax(0, 1fr) 150px 96px 92px; }
    .tf-tabela.sem-empresa .tf-linha .emp { display: none; }
  }
  /* no celular, sem a empresa (já é a página dela): responsável e prazo na 2ª linha */
  @media (max-width: 900px) { .tf-tabela.sem-empresa .tf-linha .emp { font-size: 0; } .tf-tabela.sem-empresa .tf-linha .emp::after { font-size: 12px; content: attr(data-extra); } }
  .tf-ausente { display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; padding: 0 6px; border-radius: 2em; font-size: 11px; color: var(--warn); background: var(--warn-soft); }

  /* página da empresa: o caderno */
  .tf-emp-topo { display: flex; align-items: flex-start; gap: 16px; margin: 20px 0 16px; flex-wrap: wrap; }
  .tf-emp-avatar { flex: none; width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; font-weight: 700; color: #FFFFFF; }
  .tf-emp-nome { flex: 1; min-width: 240px; }
  .tf-emp-nome h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25; }
  .tf-emp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; font-size: 13px; color: var(--ink-muted); }
  .tf-selo { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 2em; border: 1px solid var(--border); font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
  .tf-selo.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 45%, transparent); }
  .tf-selo.ruim { color: var(--destructive); border-color: color-mix(in srgb, var(--destructive) 45%, transparent); }
  .tf-aviso { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 16px; padding: 10px 14px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); font-size: 14px; }
  .tf-aviso .ph { flex: none; font-size: 18px; color: var(--warn); margin-top: 1px; }
  .tf-emp-grade { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .tf-emp-lado { display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(var(--topo-total, 64px) + var(--abas2, 0px) + 12px); }
  .tf-emp-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (max-width: 1000px) { .tf-emp-grade { grid-template-columns: minmax(0, 1fr); } .tf-emp-lado { position: static; } }
  .tf-caixa { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); overflow: hidden; }
  .tf-caixa-cab { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); font-size: 13px; font-weight: 600; }
  .tf-caixa-cab .ph { font-size: 15px; color: var(--ink-muted); }
  .tf-caixa-cab .dir { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--ink-muted); }
  .tf-caixa-corpo { padding: 12px 14px; font-size: 13px; }
  .tf-caixa.destaque { border-left: 3px solid var(--accent); }
  .tf-nota { width: 100%; min-height: 110px; resize: vertical; border: 0; padding: 12px 14px; background: none; box-shadow: none; outline: 0; color: var(--ink); font: inherit; font-size: 14px; line-height: 1.6; display: block; }
  .tf-nota:focus { background: var(--surface-2); }
  .tf-nota-pe { padding: 6px 14px 10px; font-size: 12px; color: var(--ink-muted); }
  .tf-kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 10px; align-items: center; }
  .tf-kv > .k { color: var(--ink-muted); }
  .tf-kv > .v { min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
  .tf-kv .select { width: 100%; height: 30px; min-height: 30px; font-size: 13px; }
  .tf-banco { padding: 8px 0; }
  .tf-banco + .tf-banco { border-top: 1px solid var(--border-muted, var(--border)); }
  .tf-banco-lin { display: flex; align-items: center; gap: 8px; }
  .tf-banco-sigla { flex: none; min-width: 28px; height: 22px; padding: 0 5px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; overflow: hidden; }
  .tf-banco-nome { flex: 1; min-width: 0; font-weight: 500; }
  .tf-docs { display: inline-flex; gap: 4px; }

<script>
(function () {
  'use strict';
  // ------------------------------------------------------------ base
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyD6xg7XhX8dKTKmaYup4hRX5k9XFHEkb98",
    authDomain: "entregas-2e5e2.firebaseapp.com",

  // o mesmo cache do Entregas e da Pendências: clientes e equipe saem daqui sem reler o banco
  db.enablePersistence({ synchronizeTabs: true }).catch(function () {});
  var FV = firebase.firestore.FieldValue;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, texto) { var e = document.createElement(tag); if (cls) e.className = cls; if (texto != null) e.textContent = texto; return e; }
  function ico(nome) { var i = el('i', 'ph ' + nome); i.setAttribute('aria-hidden', 'true'); return i; }
  function semAcento(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function toast(msg, tipo) {
    var t = el('div', 'tf-toast' + (tipo === 'erro' ? ' erro' : ''), msg);
    t.setAttribute('role', 'status');
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }
  function erroDe(err) { return err && err.code === 'permission-denied' ? 'sem permissão (as regras novas do banco já foram publicadas?)' : (err && (err.message || err.code)) || 'erro'; }
  function agoraIso() { return new Date().toISOString(); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function hojeIso() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function mesDe(iso) { return String(iso || '').slice(0, 7); }
  function iniciais(nome) { var p = String(nome || '').trim().split(/[\s.@]+/).filter(Boolean); return p.length ? (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase() : '?'; }

  var STATUS = [
    { id: 'afazer', rotulo: 'A fazer' },
    { id: 'andamento', rotulo: 'Em andamento' },
    { id: 'aguardando', rotulo: 'Aguardando cliente' },
    { id: 'feito', rotulo: 'Feito' }
  ];
  var PRIORIDADES = [
    { id: 'urgente', rotulo: 'Urgente' }, { id: 'alta', rotulo: 'Alta' }, { id: 'normal', rotulo: 'Normal' }, { id: 'baixa', rotulo: 'Baixa' }
  ];
  var CANAIS = [['', '—'], ['whatsapp', 'WhatsApp'], ['email', 'E-mail'], ['telefone', 'Telefone'], ['presencial', 'Presencial'], ['portal', 'Página do cliente']];
  function rotuloStatus(id) { return (STATUS.filter(function (s) { return s.id === id; })[0] || STATUS[0]).rotulo; }
  function rotuloPrio(id) { return (PRIORIDADES.filter(function (s) { return s.id === id; })[0] || PRIORIDADES[2]).rotulo; }
  function pesoPrio(id) { return { urgente: 0, alta: 1, normal: 2, baixa: 3 }[id] != null ? { urgente: 0, alta: 1, normal: 2, baixa: 3 }[id] : 2; }

  // ------------------------------------------------------------ estado
  var eu = { uid: '', nome: '', roles: [] };
  var equipe = [];                       // [{ uid, nome }]
  var clientes = [];                     // ativos
  var clientesPorId = new Map();
  var tarefas = new Map();               // abertas (ouvidas)
  var feitasCache = {};                  // 'mes' -> [tarefas feitas no mês]
  var carregou = false;
  var pagina = 'minhas';                 // minhas | todas | requisicoes | empresas | empresa
  var empresaAberta = null;
  var visao = lerLocal('nilma_tarefas_visao', 'lista');   // lista | quadro | feitas
  var agrupar = lerLocal('nilma_tarefas_agrupar', 'status');
  var filtros = { busca: '', resp: '', prio: '', emp: '', rapido: '' };
  var ausencias = new Map();             // uid -> { de, ate, tipo, cobreUid, cobreNome, nome }
  var dobrados = {};
  var aberta = null;                     // tarefa no painel (ou rascunho)
  function lerLocal(k, p) { try { return localStorage.getItem(k) || p; } catch (e) { return p; } }
  function gravarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function souAdmin() { return eu.roles.indexOf('admin') !== -1; }
  function nomeDoCliente(c) { return c ? ((c.codigoOrigem ? c.codigoOrigem + ' - ' : '') + (c.nome || c.nomeFantasia || '')) : ''; }
  function nomeDaPessoa(uid) { var p = equipe.filter(function (x) { return x.uid === uid; })[0]; return p ? p.nome : ''; }
  // férias/folga valendo hoje
  function ausenteHoje(uid) {
    var a = uid && ausencias.get(uid), h = hojeIso();
    return a && a.de <= h && h <= a.ate ? a : null;
  }
  function quemEuCubro() {
    var r = [];
    ausencias.forEach(function (a, uid) { if (uid !== eu.uid && a.cobreUid === eu.uid && ausenteHoje(uid)) r.push(Object.assign({ uid: uid }, a)); });
    return r;
  }
  var TIPOS_AUSENCIA = [['ferias', 'Férias'], ['folga', 'Folga'], ['licenca', 'Licença'], ['outro', 'Fora do escritório']];
  function rotuloAusencia(a) { return (TIPOS_AUSENCIA.filter(function (t) { return t[0] === a.tipo; })[0] || TIPOS_AUSENCIA[0])[1]; }
  function dataCurta(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : ''; }

  // ------------------------------------------------------------ datas
  function prazoTexto(iso) {
    if (!iso) return '';
    var hoje = hojeIso();
    var d = new Date(iso + 'T12:00:00'), h = new Date(hoje + 'T12:00:00');
    var dias = Math.round((d - h) / 864e5);
    if (dias === 0) return 'Hoje';
    if (dias === 1) return 'Amanhã';
    if (dias === -1) return 'Ontem';
    var dm = pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1);
    return d.getFullYear() !== h.getFullYear() ? dm + '/' + d.getFullYear() : dm;
  }
  function classePrazo(t) {
    if (!t.prazo || t.status === 'feito') return '';
    var hoje = hojeIso();
    return t.prazo < hoje ? 'atrasado' : t.prazo === hoje ? 'hoje' : '';
  }
  // mesmo dia no mês seguinte (31/01 -> 28/02)
  function proximoMes(iso) {
    var p = String(iso || hojeIso()).split('-').map(Number);
    var fim = new Date(p[0], p[1] + 1, 0).getDate();
    var d = new Date(p[0], p[1], Math.min(p[2], fim));
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  // ------------------------------------------------------------ dados
  function ouvirTarefas() {
    db.collection('tarefas').where('aberta', '==', true).onSnapshot(function (snap) {
      tarefas = new Map();
      snap.forEach(function (d) { tarefas.set(d.id, Object.assign({ id: d.id }, d.data())); });
      carregou = true;
      // o painel aberto acompanha o que outra pessoa mudou
      if (aberta && aberta.id && tarefas.has(aberta.id) && !painelEditando()) aberta = tarefas.get(aberta.id);
      desenhar();
      pintarContadores();
    }, function (err) { $('pagina').innerHTML = ''; $('pagina').appendChild(el('div', 'tf-vazio', 'Não foi possível carregar as tarefas: ' + erroDe(err))); });
  }
  function ouvirAusencias() {
    db.collection('ausencias').onSnapshot(function (snap) {
      ausencias = new Map();
      snap.forEach(function (d) { ausencias.set(d.id, d.data()); });
      pintarContadores();
      if (carregou) desenhar();
    }, function () {});
  }
  function carregarEquipe() {
    return db.collection('usuarios').get().then(function (snap) {
      equipe = snap.docs.map(function (d) {
        var x = d.data() || {};
        var roles = Array.isArray(x.roles) ? x.roles : (x.role ? [x.role] : []);
        return { uid: d.id, nome: x.nome || String(x.email || '').split('@')[0] || 'sem nome', roles: roles, ativo: x.ativo !== false };
      }).filter(function (p) { return p.roles.length && p.ativo; })
        .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
    }).catch(function () { equipe = [{ uid: eu.uid, nome: eu.nome }]; });
  }
  // Clientes: do cache do aparelho (o Entregas e a Pendências já leram); do
  // banco só se o cache estiver vazio ou com mais de 12 horas.
  function carregarClientes() {
    var CHAVE = 'nilma_tarefas_clientes_em';
    var velho = Date.now() - Number(lerLocal(CHAVE, '0')) > 12 * 36e5;
    function usar(snap) {
      clientes = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .filter(function (c) { return c.ativo !== false; })
        .sort(function (a, b) { return nomeDoCliente(a).localeCompare(nomeDoCliente(b), 'pt-BR'); });
      clientesPorId = new Map(clientes.map(function (c) { return [c.id, c]; }));
      return clientes;
    }
    function doBanco() { return db.collection('clientes').get().then(function (s) { gravarLocal(CHAVE, String(Date.now())); return usar(s); }); }
    if (velho) return doBanco();
    return db.collection('clientes').get({ source: 'cache' }).then(function (s) { return s.empty ? doBanco() : usar(s); }).catch(doBanco);
  }
  function carregarFeitas(mes) {
    if (feitasCache[mes]) return Promise.resolve(feitasCache[mes]);
    return db.collection('tarefas').where('feitaMes', '==', mes).get().then(function (snap) {
      feitasCache[mes] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); })
        .sort(function (a, b) { return String(b.feitaEm || '').localeCompare(String(a.feitaEm || '')); });
      return feitasCache[mes];
    });
  }

  function salvar(t, campos) {
    if (!t || !t.id) return Promise.resolve();
    var dados = Object.assign({}, campos, { atualizadoEm: agoraIso(), atualizadoPor: eu.nome });
    Object.assign(t, campos);
    return db.collection('tarefas').doc(t.id).update(dados).catch(function (err) { toast('Não salvou: ' + erroDe(err), 'erro'); });
  }
  function mudarStatus(t, status) {
    var campos = { status: status, aberta: status !== 'feito' };
    if (status === 'feito') { campos.feitaEm = agoraIso(); campos.feitaPor = eu.nome; campos.feitaMes = mesDe(hojeIso()); }
    else { campos.feitaEm = FV.delete(); campos.feitaPor = FV.delete(); campos.feitaMes = FV.delete(); }
    var eraFeita = t.status === 'feito';
    var p = salvar(t, campos);
    if (status === 'feito') { delete feitasCache[mesDe(hojeIso())]; }
    // tarefa de todo mês: feita, nasce a do mês seguinte
    if (status === 'feito' && !eraFeita && t.repete === 'mensal' && !t.proximaCriada) {
      var nova = {
        titulo: t.titulo, tipo: t.tipo || 'tarefa', status: 'afazer', aberta: true, prioridade: t.prioridade || 'normal',
        clienteId: t.clienteId || null, clienteNome: t.clienteNome || '', responsavelUid: t.responsavelUid || '', responsavelNome: t.responsavelNome || '',
        prazo: proximoMes(t.prazo), repete: 'mensal', descricao: t.descricao || '',
        checklist: (t.checklist || []).map(function (c) { return { texto: c.texto, feito: false }; }),
        origemId: t.id, criadoEm: agoraIso(), criadoPor: eu.nome, criadoPorUid: eu.uid
      };
      db.collection('tarefas').add(nova).then(function () {
        salvar(t, { proximaCriada: true });
        toast('Feito. A de ' + prazoTexto(nova.prazo) + ' já está na lista.');
      }).catch(function (err) { toast('A do próximo mês não foi criada: ' + erroDe(err), 'erro'); });
    }
    return p;
  }

  // ------------------------------------------------------------ o que aparece
  function itensDaPagina() {
    var lista = Array.from(tarefas.values());
    if (pagina === 'minhas') lista = lista.filter(function (t) { return t.responsavelUid === eu.uid; });
    if (pagina === 'requisicoes') lista = lista.filter(function (t) { return t.tipo === 'requisicao'; });
    if (pagina === 'empresa') lista = lista.filter(function (t) { return t.clienteId === empresaAberta; });
    return lista.filter(passaFiltros);
  }
  function passaRapido(t, qual) {
    var hoje = hojeIso();
    if (qual === 'atrasadas') return !!t.prazo && t.prazo < hoje && t.status !== 'feito';
    if (qual === 'hoje') return t.prazo === hoje;
    if (qual === 'semana') { var d = new Date(); d.setDate(d.getDate() + 7); var lim = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); return !!t.prazo && t.prazo > hoje && t.prazo <= lim; }
    if (qual === 'semresp') return !t.responsavelUid;
    return true;
  }
  function passaFiltros(t) {
    if (filtros.rapido && !passaRapido(t, filtros.rapido)) return false;
    if (filtros.resp === '-') { if (t.responsavelUid) return false; }
    else if (filtros.resp && t.responsavelUid !== filtros.resp) return false;
    if (filtros.prio && (t.prioridade || 'normal') !== filtros.prio) return false;
    if (filtros.emp && t.clienteId !== filtros.emp) return false;
    if (filtros.busca) {
      var txt = semAcento([t.titulo, t.clienteNome, t.responsavelNome, t.descricao, t.solicitante].join(' '));
      if (txt.indexOf(filtros.busca) === -1) return false;
    }
    return true;
  }
  function ordenar(a, b) {
    var pa = a.prazo || '9999', pb = b.prazo || '9999';
    if (pa !== pb) return pa < pb ? -1 : 1;
    var d = pesoPrio(a.prioridade) - pesoPrio(b.prioridade);
    return d || String(a.criadoEm || '').localeCompare(String(b.criadoEm || ''));
  }
  function grupos(lista) {
    var hoje = hojeIso();
    var semana = new Date(); semana.setDate(semana.getDate() + 7);
    var fimSemana = semana.getFullYear() + '-' + pad2(semana.getMonth() + 1) + '-' + pad2(semana.getDate());
    var def;
    if (agrupar === 'prazo') def = [
      { id: 'atrasadas', rotulo: 'Atrasadas', f: function (t) { return t.prazo && t.prazo < hoje; } },
      { id: 'hoje', rotulo: 'Hoje', f: function (t) { return t.prazo === hoje; } },
      { id: 'semana', rotulo: 'Próximos 7 dias', f: function (t) { return t.prazo > hoje && t.prazo <= fimSemana; } },
      { id: 'depois', rotulo: 'Depois', f: function (t) { return t.prazo > fimSemana; } },
      { id: 'sem', rotulo: 'Sem prazo', f: function (t) { return !t.prazo; } }
    ];
    else if (agrupar === 'responsavel') {
      def = equipe.map(function (p) { return { id: p.uid, rotulo: p.nome, f: function (t) { return t.responsavelUid === p.uid; } }; });
      def.push({ id: '-', rotulo: 'Sem responsável', f: function (t) { return !t.responsavelUid || !equipe.some(function (p) { return p.uid === t.responsavelUid; }); } });
    } else if (agrupar === 'empresa') {
      var ids = []; lista.forEach(function (t) { var k = t.clienteId || '-'; if (ids.indexOf(k) === -1) ids.push(k); });
      def = ids.map(function (k) { return { id: k, rotulo: k === '-' ? 'Sem empresa' : (nomeDoCliente(clientesPorId.get(k)) || lista.filter(function (t) { return t.clienteId === k; })[0].clienteNome || 'empresa'), f: function (t) { return (t.clienteId || '-') === k; } }; })
        .sort(function (a, b) { return a.id === '-' ? 1 : b.id === '-' ? -1 : a.rotulo.localeCompare(b.rotulo, 'pt-BR'); });
    } else def = STATUS.filter(function (s) { return s.id !== 'feito'; }).map(function (s) { return { id: s.id, rotulo: s.rotulo, status: s.id, f: function (t) { return (t.status || 'afazer') === s.id; } }; });
    return def.map(function (g) { return Object.assign(g, { itens: lista.filter(g.f).sort(ordenar) }); });
  }

  // ------------------------------------------------------------ desenho
  var TITULOS = {
    minhas: ['Minhas tarefas', 'O que está com você.'],
    todas: ['Todas as tarefas', 'Tudo que está aberto no escritório.'],
    requisicoes: ['Requisições', 'Pedidos que chegaram dos clientes e ainda não foram resolvidos.'],
    empresas: ['Empresas', 'Quem cuida de cada cliente e o que está aberto com ele.'],
    equipe: ['Equipe e férias', 'Quem está com o quê, e quem cobre quem está fora.']
  };
  function desenhar() {

      return;
    }
    if (h.indexOf('empresa/') === 0) { irPara('empresa', h.slice(8)); return; }
    if (['minhas', 'todas', 'requisicoes', 'empresas', 'equipe'].indexOf(h) !== -1) irPara(h);
  }

  // ------------------------------------------------------------ entrada
  function portao(titulo, texto, acaoHtml) {
    $('gateTitulo').textContent = titulo; $('gateTexto').textContent = texto; $('gateAcao').innerHTML = acaoHtml || '';
    $('gate').hidden = false; $('app').hidden = true; $('topo').hidden = true; $('tabsNav').hidden = true; $('abasSecao').hidden = true;
  }
  NilmaShell.ao('aparencia', function () { NilmaConfig.abrir('conta'); });
  NilmaShell.ao('sair', function () { auth.signOut().then(function () { location.href = 'entregas.html'; }); });
  NilmaShell.ao('modulo', function (id) { return id === 'tarefas'; });
  var conta = { nome: '', foto: '', iniciais: '', cargos: [] };
  NilmaExtras.ligar({
    db: db, auth: auth, firebase: firebase, origem: 'tarefas',
    usuario: function () { return conta; },
    aoMudarFoto: function (foto) { conta.foto = foto; NilmaShell.definirUsuario({ nome: conta.nome, iniciais: conta.iniciais, foto: foto }); },
    toast: function (msg, tipo) { toast(msg, tipo === 'error' ? 'erro' : null); },
    cargos: function () { return conta.cargos; },
    aoMudarNome: function (nome) { conta.nome = nome; eu.nome = nome; NilmaShell.definirUsuario({ nome: nome, foto: conta.foto }); },
    clientes: function () { return carregarClientes(); },
    sair: function () { auth.signOut().then(function () { location.href = 'entregas.html'; }); },
    versao: VERSAO_APP
  });
  auth.onAuthStateChanged(function (user) {
    if (!user) { portao('Faça login', 'Entre pelo Entregas pra abrir as Tarefas.', '<a class="btn btn-primary" href="entregas.html">Ir para o login</a>'); return; }
    db.collection('usuarios').doc(user.uid).get().then(function (snap) {
      var d = snap.exists ? snap.data() : {};
      var roles = Array.isArray(d.roles) ? d.roles : (d.role ? [d.role] : []);
      if (!roles.length) { portao('Sem acesso', 'Sua conta ainda não faz parte da equipe.', '<a class="btn btn-secondary" href="entregas.html">Voltar ao Entregas</a>'); return; }
      eu = { uid: user.uid, nome: d.nome || String(user.email || '').split('@')[0], roles: roles };
      conta = { nome: eu.nome, foto: d.fotoPerfil || '', iniciais: iniciais(eu.nome), cargos: roles };
      NilmaShell.definirUsuario({ nome: eu.nome, iniciais: conta.iniciais, foto: conta.foto,
        podeVer: function (id, papel) { return !papel || roles.indexOf('admin') !== -1 || roles.indexOf(papel) !== -1; } });
      if (window.NilmaUI) {
        window.NilmaUI.daConta(d);
        window.NilmaUI.aoSalvar = function (campo, valor) { var x = {}; x[campo] = valor; db.collection('usuarios').doc(user.uid).update(x).catch(function () {}); };
      }
      $('gate').hidden = true; $('app').hidden = false; $('topo').hidden = false; $('tabsNav').hidden = false;
      $('pagina').appendChild(el('div', 'tf-vazio', 'Carregando…'));
      Promise.all([carregarEquipe(), carregarClientes().catch(function () { return []; })]).then(function () {
        ouvirTarefas();
        ouvirAusencias();
        var primeira = true;
        var esperar = setInterval(function () {
          if (!carregou) return;
          clearInterval(esperar);
          if (primeira) { primeira = false; if (location.hash) lerHash(); else desenhar(); }
        }, 50);
      });
    }).catch(function () { portao('Erro ao entrar', 'Tente recarregar a página.', ''); });
  });
  window.addEventListener('hashchange', function () { if (carregou) lerHash(); });
})();
</script>
</body>
</html>
