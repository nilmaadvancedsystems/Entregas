  main.conteudo { display: block; min-width: 0; padding: 0 32px 64px; }

  .tf-linha .tit .ph { flex: none; font-size: 14px; color: var(--ink-muted); }

  .tf-linha .emp { color: var(--ink); }
  .tf-nova-linha { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--border-muted, var(--border)); color: var(--ink-muted); font-size: 13px; }
  .tf-nova-linha input { flex: 1; min-width: 0; height: 28px; min-height: 0; padding: 2px 6px; border: 0; background: none; box-shadow: none; color: var(--ink); font: inherit; font-size: 14px; outline: 0; }

  /* painel lateral (o "peek" do Notion) */

  function salvar(t, campos) {

  // ------------------------------------------------------------ o que aparece

  // ------------------------------------------------------------ desenho

      var canal = selectDe(CANAIS, t.canal || '', 'Canal');
      canal.addEventListener('change', function () { campo({ canal: canal.value }); });
      prop(grade, 'ph-chats-circle', 'Chegou por', canal);
    }
    corpo.appendChild(grade);

    // descrição: salva sozinha 1 s depois de parar de digitar
    corpo.appendChild(el('div', 'tf-bloco-tit', 'Descrição'));
    var desc = el('textarea', 'input tf-descricao'); desc.value = t.descricao || ''; desc.placeholder = 'Detalhes, passo a passo, o que o cliente disse…'; desc.setAttribute('aria-label', 'Descrição');
    var salvo = el('div', 'tf-salvo');
    desc.addEventListener('input', function () {
      if (t.rascunho) { t.descricao = desc.value; return; }
      salvo.textContent = 'Editando…';
      clearTimeout(relogioTexto);
      relogioTexto = setTimeout(function () { salvar(t, { descricao: desc.value }).then(function () { salvo.textContent = 'Salvo'; }); }, 1000);
    });
    corpo.appendChild(desc); corpo.appendChild(salvo);

    // checklist
    var itens = t.checklist || [];
    var feitosCk = itens.filter(function (c) { return c.feito; }).length;
    corpo.appendChild(el('div', 'tf-bloco-tit', 'Checklist' + (itens.length ? ' · ' + feitosCk + '/' + itens.length : '')));
    var gravarCk = function (lista) { if (t.rascunho) { t.checklist = lista; desenharPainel(); } else { salvar(t, { checklist: lista }); desenharPainel(); } };
    itens.forEach(function (c, i) {
      var linha = el('label', 'tf-check-item' + (c.feito ? ' ok' : ''));
      var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!c.feito;
      cb.addEventListener('change', function () { var l = itens.map(function (x, k) { return k === i ? { texto: x.texto, feito: cb.checked } : x; }); gravarCk(l); });
      linha.appendChild(cb); linha.appendChild(el('span', null, c.texto));
      var tira = el('button', 'btn btn-ghost btn-icone btn-sm tirar'); tira.type = 'button'; tira.setAttribute('aria-label', 'Tirar item'); tira.appendChild(ico('ph-x'));
      tira.addEventListener('click', function (ev) { ev.preventDefault(); gravarCk(itens.filter(function (x, k) { return k !== i; })); });
      linha.appendChild(tira);
      corpo.appendChild(linha);
    });
    var novoCk = el('input', 'input tf-check-novo'); novoCk.placeholder = '+ Item do checklist (Enter)'; novoCk.setAttribute('aria-label', 'Novo item do checklist');
    novoCk.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' || !novoCk.value.trim()) return;
      ev.preventDefault();
      gravarCk(itens.concat([{ texto: novoCk.value.trim().slice(0, 200), feito: false }]));
      setTimeout(function () { var n = document.querySelector('.tf-check-novo'); if (n) n.focus(); }, 0);
    });
    corpo.appendChild(novoCk);

    // comentários (só depois de criada)
    if (!t.rascunho) {
      var cms = t.comentarios || [];
      corpo.appendChild(el('div', 'tf-bloco-tit', 'Comentários' + (cms.length ? ' · ' + cms.length : '')));
      cms.forEach(function (c) {
        var d = el('div', 'tf-coment');
        var q = el('div', 'quem'); q.appendChild(el('b', null, c.por || 'alguém')); q.appendChild(document.createTextNode(' · ' + new Date(c.em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })));
        d.appendChild(q); d.appendChild(el('div', null, c.texto));
        corpo.appendChild(d);
      });
      var nc = el('div', 'tf-coment-novo');
      var ta = el('textarea', 'input'); ta.placeholder = 'Escreva um comentário… (Ctrl+Enter envia)'; ta.setAttribute('aria-label', 'Novo comentário');
      var env = el('button', 'btn btn-secondary'); env.type = 'button'; env.textContent = 'Comentar';
      var enviar = function () {
        var txt = ta.value.trim(); if (!txt) return;
        env.disabled = true;
        var c = { texto: txt.slice(0, 2000), por: eu.nome, porUid: eu.uid, em: agoraIso() };
        db.collection('tarefas').doc(t.id).update({ comentarios: FV.arrayUnion(c), atualizadoEm: agoraIso(), atualizadoPor: eu.nome })
          .then(function () { t.comentarios = (t.comentarios || []).concat([c]); desenharPainel(); })
          .catch(function (err) { env.disabled = false; toast('Não comentou: ' + erroDe(err), 'erro'); });
      };
      env.addEventListener('click', enviar);
      ta.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); enviar(); } });
      nc.appendChild(ta); nc.appendChild(env);
      corpo.appendChild(nc);
      var rod = el('div', 'tf-rodape', 'Criada por ' + (t.criadoPor || 'alguém') + (t.criadoEm ? ' em ' + new Date(t.criadoEm).toLocaleDateString('pt-BR') : '') +
        (t.atualizadoPor ? ' · última mudança: ' + t.atualizadoPor : '') + (t.feitaPor ? ' · feita por ' + t.feitaPor : ''));
      corpo.appendChild(rod);
    }
    p.appendChild(corpo);

    var acoes = el('div', 'tf-peek-acoes');
    if (t.rascunho) {
      acoes.appendChild(botao('Cancelar', null, 'btn-secondary', fecharPainel));
      acoes.appendChild(botao(t.tipo === 'requisicao' ? 'Criar requisição' : 'Criar tarefa', 'ph-check', 'btn-primary', criarDoPainel));
    } else {
      if (souAdmin() || t.criadoPorUid === eu.uid) {
        acoes.appendChild(botao('Excluir', 'ph-trash', 'btn-ghost', async function () {
          if (!(await NilmaDialogo.confirmar({ titulo: 'Excluir "' + (t.titulo || 'sem título') + '"?', texto: 'Some pra todo mundo. Não dá pra desfazer.', acao: 'Excluir', perigo: true }))) return;
          db.collection('tarefas').doc(t.id).delete().then(function () { toast('Excluída.'); fecharPainel(); }).catch(function (err) { toast('Não excluiu: ' + erroDe(err), 'erro'); });
        }));
      }
      acoes.appendChild(el('span', 'esp'));
      acoes.lastChild.style.flex = '1';
      acoes.appendChild(botao(t.status === 'feito' ? 'Reabrir' : 'Marcar como feito', t.status === 'feito' ? 'ph-arrow-counter-clockwise' : 'ph-check', t.status === 'feito' ? 'btn-secondary' : 'btn-primary',
        function () { mudarStatus(t, t.status === 'feito' ? 'afazer' : 'feito'); desenharPainel(); }));
    }
    p.appendChild(acoes);
    document.body.appendChild(p);
    p.querySelector('.tf-peek-corpo').scrollTop = rolagem;
    if (focarTitulo && t.rascunho) setTimeout(function () { titulo.focus(); }, 30);
  }
  function criarDoPainel() {
    var t = aberta;
    if (!t || !t.rascunho) return;
    var tit = document.querySelector('.tf-titulo');
    t.titulo = (tit ? tit.value : t.titulo || '').trim();
    if (!t.titulo) { toast('Dê um nome.', 'erro'); if (tit) tit.focus(); return; }
    var dados = Object.assign({}, t); delete dados.rascunho;
    criar(dados).then(function (nova) { toast((nova.tipo === 'requisicao' ? 'Requisição' : 'Tarefa') + ' criada.'); aberta = nova; history.replaceState(null, '', '#tarefa/' + nova.id); desenharPainel(); }).catch(function () {});
  }

  // ------------------------------------------------------------ navegação
  function irPara(p, empresaId) {
    pagina = p;
    empresaAberta = p === 'empresa' ? empresaId : null;
    history.replaceState(null, '', '#' + (p === 'empresa' ? 'empresa/' + empresaId : p));
    if ($('tfPeek')) { $('tfPeek').remove(); $('tfPeekFundo').remove(); aberta = null; }
    desenhar();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('#tabsNav .menu-item').forEach(function (b) {
    b.addEventListener('click', function () { filtros = { busca: '', resp: '', prio: '', emp: '' }; irPara(b.dataset.pagina); });
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && $('tfPeek') && !document.querySelector('dialog[open]')) { ev.preventDefault(); fecharPainel(); }
  });
  function lerHash() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (h.indexOf('tarefa/') === 0) {
      var id = h.slice(7);
      var abrir = function (t) { if (t) abrirPainel(t); else toast('Tarefa não encontrada (já foi feita?).', 'erro'); };
      if (tarefas.has(id)) abrir(tarefas.get(id));
      else db.collection('tarefas').doc(id).get().then(function (d) { abrir(d.exists ? Object.assign({ id: d.id }, d.data()) : null); }).catch(function () {});
      return;
    }
    if (h.indexOf('empresa/') === 0) { irPara('empresa', h.slice(8)); return; }
    if (['minhas', 'todas', 'requisicoes', 'empresas'].indexOf(h) !== -1) irPara(h);
  }

  // ------------------------------------------------------------ entrada
  function portao(titulo, texto, acaoHtml) {
    $('gateTitulo').textContent = titulo; $('gateTexto').textContent = texto; $('gateAcao').innerHTML = acaoHtml || '';
    $('gate').hidden = false; $('app').hidden = true; $('topo').hidden = true; $('tabsNav').hidden = true; $('abasSecao').hidden = true;
  }
  NilmaShell.ao('aparencia', function () { NilmaConfig.abrir('conta'); });
  NilmaShell.ao('sair', function () { auth.signOut().then(function () { location.href = 'entregas.html'; }); });
  NilmaShell.ao('modulo', function (id) { return id === 'tarefas'; });
  var conta = { nome: '', foto: '', iniciais: '', cargos: [] };
  NilmaExtras.ligar({
    db: db, auth: auth, firebase: firebase, origem: 'tarefas',
    usuario: function () { return conta; },
    aoMudarFoto: function (foto) { conta.foto = foto; NilmaShell.definirUsuario({ nome: conta.nome, iniciais: conta.iniciais, foto: foto }); },
    toast: function (msg, tipo) { toast(msg, tipo === 'error' ? 'erro' : null); },
    cargos: function () { return conta.cargos; },
    aoMudarNome: function (nome) { conta.nome = nome; eu.nome = nome; NilmaShell.definirUsuario({ nome: nome, foto: conta.foto }); },
    clientes: function () { return carregarClientes(); },
    sair: function () { auth.signOut().then(function () { location.href = 'entregas.html'; }); },
    versao: VERSAO_APP
  });
  auth.onAuthStateChanged(function (user) {
    if (!user) { portao('Faça login', 'Entre pelo Entregas pra abrir as Tarefas.', '<a class="btn btn-primary" href="entregas.html">Ir para o login</a>'); return; }
    db.collection('usuarios').doc(user.uid).get().then(function (snap) {
      var d = snap.exists ? snap.data() : {};
      var roles = Array.isArray(d.roles) ? d.roles : (d.role ? [d.role] : []);
      if (!roles.length) { portao('Sem acesso', 'Sua conta ainda não faz parte da equipe.', '<a class="btn btn-secondary" href="entregas.html">Voltar ao Entregas</a>'); return; }
      eu = { uid: user.uid, nome: d.nome || String(user.email || '').split('@')[0], roles: roles };
      conta = { nome: eu.nome, foto: d.fotoPerfil || '', iniciais: iniciais(eu.nome), cargos: roles };
      NilmaShell.definirUsuario({ nome: eu.nome, iniciais: conta.iniciais, foto: conta.foto,
        podeVer: function (id, papel) { return !papel || roles.indexOf('admin') !== -1 || roles.indexOf(papel) !== -1; } });
      if (window.NilmaUI) {
        window.NilmaUI.daConta(d);
        window.NilmaUI.aoSalvar = function (campo, valor) { var x = {}; x[campo] = valor; db.collection('usuarios').doc(user.uid).update(x).catch(function () {}); };
      }
      $('gate').hidden = true; $('app').hidden = false; $('topo').hidden = false; $('tabsNav').hidden = false;
      $('pagina').appendChild(el('div', 'tf-vazio', 'Carregando…'));
      Promise.all([carregarEquipe(), carregarClientes().catch(function () { return []; })]).then(function () {
        ouvirTarefas();
        var primeira = true;
        var esperar = setInterval(function () {
          if (!carregou) return;
          clearInterval(esperar);
          if (primeira) { primeira = false; if (location.hash) lerHash(); else desenhar(); }
        }, 50);
      });
    }).catch(function () { portao('Erro ao entrar', 'Tente recarregar a página.', ''); });
  });
  window.addEventListener('hashchange', function () { if (carregou) lerHash(); });
})();
</script>
</body>
</html>
