<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9A2B24">
<meta name="description" content="Painel de cobrança de documentos por e-mail (extrato, comprovante, aplicação).">
<title>Pendências e envio automático via Gmail — Nilma</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('nilma_tema');
    if (t === 'claro') document.documentElement.dataset.theme = 'light';
    else if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  /* ==========================================================================
     Tokens — copiados do entregas.html (mesma paleta, mesma escala de forma
     e espaço) pra esta tela ler como parte do mesmo aplicativo, não um app à
     parte carregado dentro de um iframe.
     ========================================================================== */
  :root {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F2F2;
    --border: #E3E3E3; --border-forte: #C9C9C9;
    --ink: #1A1A1A; --ink-soft: #525252; --ink-faint: #6C6C6C;
    --accent: #9A2B24; --accent-ink: #FFFFFF; --accent-soft: #F7E7E5;
    --accent-forte: color-mix(in srgb, var(--accent) 62%, var(--ink));
    --success: #17694A; --success-soft: #E2F2EA; --success-forte: color-mix(in srgb, var(--success) 62%, var(--ink));
    --warning: #8A5D12; --warning-soft: #FAF0DC; --warning-forte: color-mix(in srgb, var(--warning) 62%, var(--ink));
    --danger: #A8322F; --danger-soft: #FAE6E4; --danger-forte: color-mix(in srgb, var(--danger) 62%, var(--ink));
    --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 10px;
    --esp-1: 4px; --esp-2: 8px; --esp-3: 12px; --esp-4: 16px;
    --t-xs: 11px; --t-sm: 12px; --t-base: 13px; --t-md: 15px;
    --linha: 52px;
    --shadow: 0 10px 28px -14px rgba(10,10,16,.45), 0 2px 6px -3px rgba(10,10,16,.18);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #17191A; --surface: #17191A; --surface-2: #232526;
    --border: #33363A; --border-forte: #45484D;
    --ink: #F2F2F2; --ink-soft: #C7C9CC; --ink-faint: #9A9DA2;
    --accent-soft: #3A2422; --accent-forte: color-mix(in srgb, var(--accent) 92%, var(--ink));
    --success-soft: #123526; --success-forte: color-mix(in srgb, var(--success) 92%, var(--ink));
    --warning-soft: #3A2E0F; --warning-forte: color-mix(in srgb, var(--warning) 92%, var(--ink));
    --danger-soft: #3A1F1D; --danger-forte: color-mix(in srgb, var(--danger) 92%, var(--ink));
    color-scheme: dark;
  }
  @media (min-width: 900px) { :root { --linha: 40px; --t-md: 14px; } }

  /* Qualquer elemento com o atributo hidden fica escondido de verdade, mesmo
     que outra regra defina display nele (ex: .lista usa display:flex). */
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: var(--t-md)/1.5 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: auto;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 64px; }
  body.embutido .wrap { padding-top: 8px; }
  body.embutido .topo { display: none; }

  header.topo {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: var(--esp-4); margin-bottom: var(--esp-4); border-bottom: 1px solid var(--border);
  }
  header.topo h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  header.topo .sub { color: var(--ink-faint); font-size: var(--t-sm); margin-top: 2px; }

  /* ---------- botões (mesma forma do entregas.html: --r-sm, sem pílula) ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 14px; border-radius: var(--r-sm);
    font: 600 var(--t-md)/1 inherit; cursor: pointer; border: 1px solid transparent;
    white-space: nowrap; transition: background-color .12s ease, border-color .12s ease;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .btn-secondary:hover { background: var(--surface-2); border-color: var(--border-forte); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .campo { margin-bottom: var(--esp-4); }
  .campo label { display: block; font-size: var(--t-sm); color: var(--ink-soft); margin-bottom: 4px; font-weight: 500; }
  .input {
    width: 100%; height: 42px; padding: 0 var(--esp-3); border-radius: var(--r-sm);
    border: 1px solid var(--border-forte); background: var(--surface-2); color: var(--ink);
    font: var(--t-md) inherit;
  }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .vazio { color: var(--ink-faint); font-size: var(--t-base); padding: 32px 0; text-align: center; }

  /* ---------- faixa de indicadores (dash-strip, igual ao entregas.html) ---------- */
  .dash-strip { display: flex; margin-bottom: var(--esp-4); }
  .dash-item {
    flex: 1; min-width: 0; background: none; border: none; border-left: 1px solid var(--border);
    padding: var(--esp-3) var(--esp-2); text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px; color: inherit;
  }
  .dash-item:first-child { border-left: none; padding-left: 0; }
  .dash-item.pend { --dash-cor: var(--warning-forte); }
  .dash-item.ok { --dash-cor: var(--success-forte); }
  .dash-item.neutro { --dash-cor: var(--ink-soft); }
  .dash-ico { font-size: .85rem; line-height: 1; color: var(--ink-faint); }
  .dash-num { font-size: 1.5rem; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; color: var(--dash-cor); }
  .dash-label { font-size: var(--t-xs); color: var(--ink-soft); font-weight: 500; line-height: 1.25; }
  @media (max-width: 640px) {
    .dash-item {
      flex-direction: row; align-items: baseline; justify-content: flex-start; gap: var(--esp-2);
      padding: var(--esp-3) var(--esp-4); text-align: left; border-left: none; border-top: 1px solid var(--border);
    }
    .dash-item:first-child { border-top: none; padding-left: var(--esp-4); }
  }

  /* ---------- barra de mês + busca ---------- */
  .barra { display: flex; align-items: center; gap: var(--esp-3); flex-wrap: wrap; margin-bottom: var(--esp-2); }
  .mes-nav {
    display: flex; align-items: center; gap: 2px; background: var(--surface-2);
    border: 1px solid var(--border-forte); border-radius: var(--r-md); padding: 3px;
  }
  .mes-nav button {
    width: 30px; height: 30px; border-radius: var(--r-sm); border: none; background: none;
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .mes-nav button:hover { background: var(--surface); }
  .mes-label { font-weight: 700; font-size: var(--t-base); min-width: 108px; text-align: center; text-transform: capitalize; }
  .busca { flex: 1; min-width: 160px; }

  /* ==========================================================================
     Lista de clientes — o coração da tela, no mesmo espírito das linhas de
     entregas.html: 1px de fio separando, ponto de status antes do nome,
     52px no celular / 40px no PC (token --linha), sem cartão, sem sombra.
     ========================================================================== */
  .lista { border-top: 1px solid var(--border); }
  .linha-cliente {
    display: flex; align-items: center; gap: var(--esp-3);
    min-height: var(--linha); padding: var(--esp-1) 0 var(--esp-1) 16px;
    border-bottom: 1px solid var(--border); position: relative;
  }
  .linha-cliente::before {
    content: ""; position: absolute; left: 2px; top: 50%; margin-top: -3px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--linha-cor, var(--border-forte));
  }
  .linha-cliente.lc-pendente { --linha-cor: var(--warning); }
  .linha-cliente.lc-completo { --linha-cor: var(--success); }

  .lc-info { flex: 1 1 auto; min-width: 0; cursor: pointer; background: none; border: none; text-align: left; padding: 0; color: inherit; font: inherit; }
  .lc-nome { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc-info:hover .lc-nome { color: var(--accent-forte); text-decoration: underline; }
  .lc-doc { font-size: var(--t-xs); color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; }

  .lc-resumo { flex: none; font-size: var(--t-sm); font-weight: 600; color: var(--ink-faint); white-space: nowrap; }
  .lc-resumo.completo { color: var(--success-forte); }
  .lc-email-txt { flex: none; width: 190px; font-size: var(--t-sm); color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc-email-txt.vazio { color: var(--warning-forte); }

  @media (max-width: 640px) {
    .linha-cliente { flex-wrap: wrap; padding-top: var(--esp-2); padding-bottom: var(--esp-2); }
    .lc-info { flex-basis: 100%; }
    .lc-email-txt { width: auto; flex: 1; }
  }

  /* ---------- comprimidos de documento (chip/chip-grid, igual ao entregas.html) ---------- */
  .chip-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .chip span {
    display: inline-flex; align-items: center; position: relative; min-height: 34px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: var(--r-sm);
    background: var(--surface); font-size: var(--t-base); font-weight: 500; cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease, color .12s ease;
  }
  .chip span:hover { border-color: var(--border-forte); }
  .chip input:checked + span {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; padding-left: 28px;
  }
  .chip input:checked + span::before {
    content: "✓"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: .78rem; font-weight: 700;
  }

  /* ---------- tela de detalhe do cliente ---------- */
  #viewDetalhe { display: flex; flex-direction: column; gap: var(--esp-4); }
  .detalhe-topo { display: flex; align-items: center; gap: var(--esp-3); }
  .detalhe-cabecalho {
    display: flex; align-items: flex-start; justify-content: space-between; gap: var(--esp-4); flex-wrap: wrap;
    padding-bottom: var(--esp-3); border-bottom: 1px solid var(--border);
  }
  .detalhe-nome { font-size: 18px; font-weight: 700; }
  .detalhe-doc { color: var(--ink-faint); font-size: var(--t-sm); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .detalhe-campo { min-width: 220px; }
  .detalhe-campo label { display: block; font-size: var(--t-sm); color: var(--ink-soft); margin-bottom: 4px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--r-md);
    font-size: var(--t-base); box-shadow: var(--shadow); z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .toast.show { opacity: 1; }
  #authGate {
    position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
    justify-content: center; z-index: 50; padding: 20px;
  }
  #authGate[hidden] { display: none; }
  #authGate form { width: 100%; max-width: 340px; }
  #authGate h1 { font-size: 18px; text-align: center; margin-bottom: 20px; }
  .auth-erro { color: var(--danger-forte); font-size: var(--t-base); margin: 8px 0; }
  #negado { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
</style>
</head>
<body>

<div id="authGate">
  <form id="loginForm">
    <h1>Cobrança de Documentos</h1>
    <div class="campo">
      <label for="loginEmail">Usuário</label>
      <input class="input" id="loginEmail" type="text" autocomplete="username" placeholder="ex: teste" required>
    </div>
    <div class="campo">
      <label for="loginSenha">Senha</label>
      <input class="input" id="loginSenha" type="password" autocomplete="current-password" required>
    </div>
    <p class="auth-erro" id="loginError" hidden></p>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <header class="topo">
      <div>
        <h1>Cobrança de Documentos</h1>
        <div class="sub">Extrato · Comprovante · Aplicação — marque o que já foi recebido por cliente/mês</div>
      </div>
      <button class="btn btn-secondary" id="logoutBtn"><i class="ph ph-sign-out"></i> Sair</button>
    </header>

    <div class="dash-strip">
      <div class="dash-item pend">
        <span class="dash-ico"><i class="ph ph-warning"></i></span>
        <span class="dash-num" id="dashPendentes">–</span>
        <span class="dash-label">com pendência</span>
      </div>
      <div class="dash-item ok">
        <span class="dash-ico"><i class="ph ph-check"></i></span>
        <span class="dash-num" id="dashCompletos">–</span>
        <span class="dash-label">completos</span>
      </div>
      <div class="dash-item neutro">
        <span class="dash-ico"><i class="ph ph-users"></i></span>
        <span class="dash-num" id="dashClientes">–</span>
        <span class="dash-label">clientes ativos</span>
      </div>
    </div>

    <div id="viewLista">
      <div class="barra">
        <div class="mes-nav">
          <button type="button" id="mesAnterior" aria-label="Mês anterior"><i class="ph ph-caret-left"></i></button>
          <span class="mes-label" id="mesLabel"></span>
          <button type="button" id="mesProximo" aria-label="Próximo mês"><i class="ph ph-caret-right"></i></button>
        </div>
        <input class="input busca" id="busca" type="text" placeholder="Buscar cliente ou CNPJ...">
      </div>

      <div id="lista" class="lista"></div>
      <div id="vazioAviso" class="vazio" hidden>Nenhum cliente encontrado.</div>
    </div>

    <div id="viewDetalhe" hidden>
      <div class="detalhe-topo">
        <button type="button" class="btn btn-secondary" id="voltarBtn"><i class="ph ph-arrow-left"></i> Voltar</button>
        <span class="mes-label" id="detMesLabel" style="text-transform:capitalize;"></span>
      </div>
      <div class="detalhe-cabecalho">
        <div>
          <div class="detalhe-nome" id="detNome"></div>
          <div class="detalhe-doc" id="detDoc"></div>
        </div>
        <div class="detalhe-campo">
          <label for="detEmailInput">E-mail de cobrança</label>
          <input class="input" id="detEmailInput" type="email" placeholder="cliente@exemplo.com">
        </div>
      </div>
      <div class="detalhe-campo">
        <label>Documentos recebidos este mês</label>
        <div class="chip-grid" id="detChips"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyD6xg7XhX8dKTKmaYup4hRX5k9XFHEkb98",
    authDomain: "entregas-2e5e2.firebaseapp.com",
    projectId: "entregas-2e5e2",
    storageBucket: "entregas-2e5e2.firebasestorage.app",
    messagingSenderId: "1009094556836",
    appId: "1:1009094556836:web:d3b6a9283e934db064fa31"
  };
  firebase.initializeApp(firebaseConfig);
</script>
<script>
(function () {
  // Dentro do hub (entregas.html), esta página carrega num <iframe> que já
  // fica embaixo do cabeçalho "Pendências / <data>" e da barra lateral do
  // app principal — o cabeçalho e o botão Sair daqui em cima ficariam
  // duplicados, então somem quando não é acesso direto ao arquivo.
  try {
    if (window.self !== window.top) document.body.classList.add('embutido');
  } catch (e) {
    document.body.classList.add('embutido'); // acesso a window.top bloqueado = com certeza embutido
  }

  var auth = firebase.auth();
  var db = firebase.firestore();
  var $ = function (id) { return document.getElementById(id); };

  var TIPOS = [
    { chave: 'extrato', label: 'Extrato Bancário' },
    { chave: 'comprovante', label: 'Comprovante' },
    { chave: 'aplicacao', label: 'Aplicação' }
  ];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  var competenciaAtual = new Date();
  competenciaAtual.setDate(1);
  var clientesCache = [];
  var statusCache = new Map(); // clienteId -> {extrato, comprovante, aplicacao}
  var unsubClientes = null;
  var unsubStatus = null;
  var termoBusca = '';
  var podeUsar = false;
  var clienteSelecionadoId = null; // null = mostrando a lista

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function competenciaStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function competenciaLabel(d) {
    return MESES[d.getMonth()] + ' de ' + d.getFullYear();
  }

  var DIACRITICS_RE = /[̀-ͯ]/g;
  function emailFromNome(nome) {
    var slug = nome.trim().toLowerCase()
      .normalize('NFD').replace(DIACRITICS_RE, '')
      .replace(/[^a-z0-9]+/g, '.')
      .replace(/^\.+|\.+$/g, '');
    return slug + '@nilma.local';
  }
  function resolveLoginEmail(input) {
    input = input.trim();
    return input.indexOf('@') !== -1 ? input : emailFromNome(input);
  }

  function normalizarBusca(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(DIACRITICS_RE, '');
  }

  // ---------- navegação de mês ----------
  function atualizarMesLabel() {
    $('mesLabel').textContent = competenciaLabel(competenciaAtual);
  }
  $('mesAnterior').addEventListener('click', function () {
    competenciaAtual.setMonth(competenciaAtual.getMonth() - 1);
    atualizarMesLabel();
    subscribeStatus();
  });
  $('mesProximo').addEventListener('click', function () {
    competenciaAtual.setMonth(competenciaAtual.getMonth() + 1);
    atualizarMesLabel();
    subscribeStatus();
  });
  $('busca').addEventListener('input', function () {
    termoBusca = normalizarBusca($('busca').value);
    render();
  });

  // ---------- dados ----------
  function subscribeClientes() {
    unsubClientes = db.collection('clientes').where('ativo', '==', true)
      .onSnapshot(function (snap) {
        clientesCache = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        clientesCache.sort(function (a, b) { return (a.nome || '').localeCompare(b.nome || '', 'pt-BR'); });
        render();
      }, function (err) {
        $('lista').innerHTML = '';
        $('vazioAviso').hidden = false;
        $('vazioAviso').textContent = 'Erro ao carregar clientes: ' + err.message;
      });
  }

  function subscribeStatus() {
    if (unsubStatus) { unsubStatus(); unsubStatus = null; }
    var comp = competenciaStr(competenciaAtual);
    unsubStatus = db.collection('documentosMensal').where('competencia', '==', comp)
      .onSnapshot(function (snap) {
        statusCache = new Map();
        snap.docs.forEach(function (d) { statusCache.set(d.data().clienteId, d.data()); });
        render();
      }, function (err) { toast('Erro ao carregar situação do mês: ' + err.message); });
  }

  // ---------- ações ----------
  function alternarDoc(cliente, tipoChave, marcarComo) {
    var comp = competenciaStr(competenciaAtual);
    var id = cliente.id + '_' + comp;
    var patch = { clienteId: cliente.id, clienteNome: cliente.nome, competencia: comp, atualizadoEm: new Date().toISOString() };
    patch[tipoChave] = marcarComo;
    db.collection('documentosMensal').doc(id).set(patch, { merge: true })
      .catch(function (err) { toast('Erro ao salvar: ' + err.message); });
  }

  function salvarEmail(cliente, novoEmail, inputEl) {
    novoEmail = novoEmail.trim();
    if (novoEmail === (cliente.email || '')) return;
    if (novoEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(novoEmail)) {
      toast('E-mail inválido para ' + cliente.nome);
      inputEl.value = cliente.email || '';
      return;
    }
    db.collection('clientes').doc(cliente.id).update({ email: novoEmail })
      .then(function () { toast('E-mail salvo.'); })
      .catch(function (err) {
        toast('Erro ao salvar e-mail: ' + err.message);
        inputEl.value = cliente.email || '';
      });
  }

  // ---------- renderização ----------
  function listaFiltrada() {
    var lista = clientesCache;
    if (termoBusca) {
      lista = lista.filter(function (c) {
        return normalizarBusca(c.nome).indexOf(termoBusca) !== -1 ||
          normalizarBusca(c.nomeFantasia).indexOf(termoBusca) !== -1 ||
          normalizarBusca(c.documento).indexOf(termoBusca) !== -1;
      });
    }
    return lista;
  }

  function statusDoCliente(clienteId) {
    return statusCache.get(clienteId) || {};
  }

  function render() {
    if (clienteSelecionadoId) {
      $('viewLista').hidden = true;
      $('viewDetalhe').hidden = false;
      renderDetalhe();
    } else {
      $('viewLista').hidden = false;
      $('viewDetalhe').hidden = true;
      renderLista();
    }
  }

  function abrirDetalhe(clienteId) {
    clienteSelecionadoId = clienteId;
    render();
  }

  $('voltarBtn').addEventListener('click', function () {
    clienteSelecionadoId = null;
    render();
  });

  function renderLista() {
    var container = $('lista');
    container.innerHTML = '';
    var lista = listaFiltrada();
    $('vazioAviso').hidden = lista.length > 0;
    var pendentesCount = 0;

    lista.forEach(function (cliente) {
      var status = statusDoCliente(cliente.id);
      var okCount = TIPOS.filter(function (t) { return status[t.chave]; }).length;
      var completo = okCount === TIPOS.length;
      if (!completo) pendentesCount++;

      var row = document.createElement('div');
      row.className = 'linha-cliente ' + (completo ? 'lc-completo' : 'lc-pendente');

      var info = document.createElement('button');
      info.type = 'button';
      info.className = 'lc-info';
      info.innerHTML = '<div class="lc-nome"></div><div class="lc-doc"></div>';
      info.querySelector('.lc-nome').textContent = cliente.nome || '(sem nome)';
      info.querySelector('.lc-doc').textContent = cliente.documento || '';
      info.addEventListener('click', function () { abrirDetalhe(cliente.id); });
      row.appendChild(info);

      var resumo = document.createElement('span');
      resumo.className = 'lc-resumo' + (completo ? ' completo' : '');
      resumo.textContent = okCount + '/' + TIPOS.length;
      row.appendChild(resumo);

      var emailTxt = document.createElement('span');
      emailTxt.className = 'lc-email-txt' + (cliente.email ? '' : ' vazio');
      emailTxt.textContent = cliente.email || 'sem e-mail cadastrado';
      row.appendChild(emailTxt);

      container.appendChild(row);
    });

    $('dashPendentes').textContent = pendentesCount;
    $('dashCompletos').textContent = lista.length - pendentesCount;
    $('dashClientes').textContent = clientesCache.length;
  }

  function renderDetalhe() {
    var cliente = clientesCache.filter(function (c) { return c.id === clienteSelecionadoId; })[0];
    if (!cliente) { clienteSelecionadoId = null; render(); return; }

    $('detNome').textContent = cliente.nome || '(sem nome)';
    $('detDoc').textContent = cliente.documento || '';
    $('detMesLabel').textContent = competenciaLabel(competenciaAtual);

    var emailInput = $('detEmailInput');
    emailInput.value = cliente.email || '';
    emailInput.onchange = function () { salvarEmail(cliente, emailInput.value, emailInput); };

    var status = statusDoCliente(cliente.id);
    var grid = $('detChips');
    grid.innerHTML = '';
    TIPOS.forEach(function (tipo) {
      var marcado = !!status[tipo.chave];
      var label = document.createElement('label');
      label.className = 'chip';
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = marcado;
      input.addEventListener('change', function () { alternarDoc(cliente, tipo.chave, input.checked); });
      var span = document.createElement('span');
      span.textContent = tipo.label;
      label.appendChild(input);
      label.appendChild(span);
      grid.appendChild(label);
    });
  }

  // ---------- autenticação ----------
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('loginError').hidden = true;
    auth.signInWithEmailAndPassword(resolveLoginEmail($('loginEmail').value), $('loginSenha').value)
      .catch(function (err) {
        $('loginError').textContent = 'Não foi possível entrar: ' + (err.message || err.code);
        $('loginError').hidden = false;
      });
  });

  $('logoutBtn').addEventListener('click', function () { auth.signOut(); });

  auth.onAuthStateChanged(function (user) {
    if (unsubClientes) { unsubClientes(); unsubClientes = null; }
    if (unsubStatus) { unsubStatus(); unsubStatus = null; }
    if (!user) {
      $('authGate').hidden = false;
      $('app').hidden = true;
      return;
    }
    db.collection('usuarios').doc(user.uid).get().then(function (doc) {
      var roles = (doc.exists && doc.data().roles) || [];
      podeUsar = roles.indexOf('admin') !== -1 || roles.indexOf('contabil') !== -1;
      $('authGate').hidden = true;
      $('app').hidden = false;
      if (!podeUsar) {
        document.querySelector('.wrap').innerHTML = '<div id="negado"><i class="ph ph-lock" style="font-size:32px;"></i>' +
          '<p>Sua conta não tem acesso a este painel (precisa do papel admin ou contábil).</p></div>';
        return;
      }
      atualizarMesLabel();
      subscribeClientes();
      subscribeStatus();
    });
  });
})();
</script>
</body>
</html>
