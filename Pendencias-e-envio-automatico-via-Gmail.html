<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9A2B24">
<meta name="description" content="Painel de cobrança de documentos por e-mail (extrato, comprovante, aplicação).">
<title>Pendências e envio automático via Gmail — Nilma</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('nilma_tema');
    if (t === 'claro') document.documentElement.dataset.theme = 'light';
    else if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F2F2;
    --border: #E3E3E3; --border-forte: #C9C9C9;
    --ink: #1A1A1A; --ink-soft: #525252; --ink-faint: #6C6C6C;
    --accent: #9A2B24; --accent-ink: #FFFFFF; --accent-soft: #F7E7E5;
    --accent-forte: color-mix(in srgb, var(--accent) 62%, var(--ink));
    --success: #17694A; --success-soft: #E2F2EA; --success-forte: color-mix(in srgb, var(--success) 62%, var(--ink));
    --warning: #8A5D12; --warning-soft: #FAF0DC; --warning-forte: color-mix(in srgb, var(--warning) 62%, var(--ink));
    --danger: #A8322F; --danger-soft: #FAE6E4; --danger-forte: color-mix(in srgb, var(--danger) 62%, var(--ink));
    --mister-azul: #2F6FED;
    --r-sm: 6px; --r-md: 8px; --r-lg: 10px; --r-pill: 999px;
    --shadow: 0 10px 28px -14px rgba(10,10,16,.45), 0 2px 6px -3px rgba(10,10,16,.18);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #17191A; --surface: #17191A; --surface-2: #232526;
    --border: #33363A; --border-forte: #45484D;
    --ink: #F2F2F2; --ink-soft: #C7C9CC; --ink-faint: #9A9DA2;
    --accent-soft: #3A2422; --accent-forte: color-mix(in srgb, var(--accent) 92%, var(--ink));
    --success-soft: #123526; --success-forte: color-mix(in srgb, var(--success) 92%, var(--ink));
    --warning-soft: #3A2E0F; --warning-forte: color-mix(in srgb, var(--warning) 92%, var(--ink));
    --danger-soft: #3A1F1D; --danger-forte: color-mix(in srgb, var(--danger) 92%, var(--ink));
    color-scheme: dark;
  }
  /* Qualquer elemento com o atributo hidden fica escondido de verdade,
     mesmo que outra regra abaixo defina display nele (ex: .cards-grid
     usa display:grid — sem isso, [hidden] normal do navegador perde
     pra qualquer regra de autor com a mesma especificidade). */
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: auto;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header.topo {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  header.topo h1 { font-size: 20px; font-weight: 700; margin: 0; }
  header.topo .sub { color: var(--ink-faint); font-size: 12px; margin-top: 2px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 14px; border-radius: var(--r-md);
    font: 600 14px/1 Inter, sans-serif; cursor: pointer; border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(0.95); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border-forte); }
  .btn-secondary:hover { background: var(--surface-2); }
  .btn-chip { height: 30px; padding: 0 10px; font-size: 13px; border-radius: var(--r-pill); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  section.card { padding: 20px 0; border-bottom: 1px solid var(--border); }
  section.card h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 500; }
  .input, select.input {
    width: 100%; height: 42px; padding: 0 12px; border-radius: var(--r-sm);
    border: 1px solid var(--border-forte); background: var(--surface-2); color: var(--ink);
    font: 14px Inter, sans-serif;
  }
  .input:focus, select.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-doc {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: var(--r-pill); border: 1px solid var(--border-forte);
    background: var(--surface); cursor: pointer; font-size: 13px; user-select: none;
  }
  .chip-doc input { accent-color: var(--accent); }
  .chip-doc.marcado { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-forte); font-weight: 600; }
  .vazio { color: var(--ink-faint); font-size: 13px; padding: 24px 0; text-align: center; }

  /* ---------- barra de mês + busca ---------- */
  .barra {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .mes-nav {
    display: flex; align-items: center; gap: 4px; background: var(--surface-2);
    border: 1px solid var(--border-forte); border-radius: var(--r-pill); padding: 4px;
  }
  .mes-nav button {
    width: 30px; height: 30px; border-radius: var(--r-pill); border: none; background: none;
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .mes-nav button:hover { background: var(--surface); }
  .mes-label { font-weight: 700; font-size: 14px; min-width: 110px; text-align: center; text-transform: capitalize; }
  .busca { flex: 1; min-width: 180px; }
  .contagem { color: var(--ink-faint); font-size: 12px; white-space: nowrap; }

  /* ---------- estilo "Mister": cards com barras mensais ---------- */
  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px;
  }
  .card-cliente {
    border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface);
    padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
  }
  .card-cliente:hover { border-color: var(--border-forte); }
  .card-cliente.tem-pendencia { border-left: 3px solid var(--warning); }
  .card-cliente.completo { border-left: 3px solid var(--success); }
  .cc-nome { font-weight: 700; font-size: 13px; line-height: 1.3; }
  .cc-doc { color: var(--ink-faint); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .cc-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-faint); }
  .cc-num { color: var(--ink); font-weight: 700; font-size: 13px; }
  .cc-legenda { display: flex; align-items: center; gap: 8px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; }
  .dot-pend { background: var(--warning); }
  .dot-ok { background: var(--mister-azul); }
  .cc-barras { display: flex; align-items: flex-end; gap: 6px; height: 64px; }
  .barra-grupo { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
  .barra-col {
    width: 100%; max-width: 22px; height: 46px; border-radius: 3px 3px 0 0; overflow: hidden;
    display: flex; flex-direction: column-reverse; background: var(--surface-2);
  }
  .barra-ok-seg { background: var(--mister-azul); width: 100%; }
  .barra-pend-seg { background: var(--warning); width: 100%; }
  .barra-semdado .barra-col { background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 3px, var(--border) 3px, var(--border) 6px); }
  .barra-pct { font-size: 9px; color: var(--ink-faint); font-weight: 700; }
  .barra-mes { font-size: 9px; color: var(--ink-faint); }
  .cc-ver {
    margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--accent-forte);
    display: flex; align-items: center; gap: 4px; justify-content: flex-end;
  }

  /* ---------- tela de detalhe ---------- */
  #viewDetalhe { display: flex; flex-direction: column; gap: 18px; }
  .detalhe-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  .detalhe-nome { font-size: 18px; font-weight: 700; }
  .detalhe-doc { color: var(--ink-faint); font-size: 12px; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .detalhe-email { min-width: 240px; }
  .detalhe-email label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .detalhe-tipos { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .tipo-card { border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; }
  .tipo-card-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .tipo-card-titulo { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .tipo-card-num { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
  .tipo-card-legenda { display: flex; gap: 10px; font-size: 11px; color: var(--ink-faint); margin-bottom: 10px; }
  .tipo-card .cc-barras { height: 90px; }
  .tipo-card .barra-col { height: 68px; }
  .toggle-mes-atual {
    margin-top: 12px; width: 100%; justify-content: center; border-radius: var(--r-md);
  }
  .toggle-mes-atual.marcado { background: var(--success-soft); color: var(--success-forte); border-color: var(--success); }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--r-md);
    font-size: 13px; box-shadow: var(--shadow); z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .toast.show { opacity: 1; }
  #authGate {
    position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
    justify-content: center; z-index: 50; padding: 20px;
  }
  #authGate[hidden] { display: none; }
  #authGate form { width: 100%; max-width: 340px; }
  #authGate h1 { font-size: 18px; text-align: center; margin-bottom: 20px; }
  .auth-erro { color: var(--danger-forte); font-size: 13px; margin: 8px 0; }
  #negado { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
</style>
</head>
<body>

<div id="authGate">
  <form id="loginForm">
    <h1>Cobrança de Documentos</h1>
    <div class="campo">
      <label for="loginEmail">Usuário</label>
      <input class="input" id="loginEmail" type="text" autocomplete="username" placeholder="ex: teste" required>
    </div>
    <div class="campo">
      <label for="loginSenha">Senha</label>
      <input class="input" id="loginSenha" type="password" autocomplete="current-password" required>
    </div>
    <p class="auth-erro" id="loginError" hidden></p>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <header class="topo">
      <div>
        <h1>Cobrança de Documentos</h1>
        <div class="sub">Extrato · Comprovante · Aplicação — marque o que já foi recebido por cliente/mês</div>
      </div>
      <button class="btn btn-secondary" id="logoutBtn"><i class="ph ph-sign-out"></i> Sair</button>
    </header>

    <section class="card">
      <div class="barra">
        <div class="mes-nav">
          <button type="button" id="mesAnterior" aria-label="Mês anterior"><i class="ph ph-caret-left"></i></button>
          <span class="mes-label" id="mesLabel"></span>
          <button type="button" id="mesProximo" aria-label="Próximo mês"><i class="ph ph-caret-right"></i></button>
        </div>
        <input class="input busca" id="busca" type="text" placeholder="Buscar cliente ou CNPJ...">
        <span class="contagem" id="contagem"></span>
      </div>
      <div id="viewCards" class="cards-grid"></div>

      <div id="viewDetalhe" hidden>
        <button type="button" class="btn btn-secondary" id="voltarBtn" style="margin-bottom:14px;">
          <i class="ph ph-arrow-left"></i> Voltar
        </button>
        <div class="detalhe-header">
          <div>
            <div class="detalhe-nome" id="detNome"></div>
            <div class="detalhe-doc" id="detDoc"></div>
          </div>
          <div class="detalhe-email">
            <label for="detEmailInput">E-mail de cobrança</label>
            <input class="input" id="detEmailInput" type="email" placeholder="cliente@exemplo.com">
          </div>
        </div>
        <div class="detalhe-tipos" id="detTipos"></div>
      </div>

      <div id="vazioAviso" class="vazio" hidden>Nenhum cliente encontrado.</div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var auth = firebase.auth();
  var db = firebase.firestore();
  var $ = function (id) { return document.getElementById(id); };

  var TIPOS = ['extrato', 'comprovante', 'aplicacao'];
  var TIPO_LABEL = { extrato: 'Extrato Bancário', comprovante: 'Comprovante', aplicacao: 'Aplicação' };
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var JANELA_MESES = 6; // quantos meses de histórico as barras mostram, terminando no mês selecionado

  var competenciaAtual = new Date();
  competenciaAtual.setDate(1);
  var clientesCache = [];
  var docsMensalCache = new Map(); // clienteId -> Map(competencia -> {extrato, comprovante, aplicacao})
  var unsubClientes = null;
  var unsubDocsMensal = null;
  var termoBusca = '';
  var podeUsar = false;
  var clienteSelecionadoId = null; // null = mostrando grade de cards

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function competenciaStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function competenciaLabel(d) {
    return MESES[d.getMonth()] + ' de ' + d.getFullYear();
  }

  function competenciaCurta(compStr) {
    var partes = compStr.split('-');
    return parseInt(partes[1], 10) + '/' + partes[0];
  }

  // Lista de competências "AAAA-MM", das mais antigas às mais novas, terminando em `fim`.
  function janelaCompetencias(fim, n) {
    var arr = [];
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date(fim.getFullYear(), fim.getMonth() - i, 1);
      arr.push(competenciaStr(d));
    }
    return arr;
  }

  var DIACRITICS_RE = /[̀-ͯ]/g;
  function emailFromNome(nome) {
    var slug = nome.trim().toLowerCase()
      .normalize('NFD').replace(DIACRITICS_RE, '')
      .replace(/[^a-z0-9]+/g, '.')
      .replace(/^\.+|\.+$/g, '');
    return slug + '@nilma.local';
  }
  function resolveLoginEmail(input) {
    input = input.trim();
    return input.indexOf('@') !== -1 ? input : emailFromNome(input);
  }

  function normalizarBusca(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(DIACRITICS_RE, '');
  }

  // ---------- navegação de mês ----------
  function atualizarMesLabel() {
    $('mesLabel').textContent = competenciaLabel(competenciaAtual);
  }

  $('mesAnterior').addEventListener('click', function () {
    competenciaAtual.setMonth(competenciaAtual.getMonth() - 1);
    atualizarMesLabel();
    subscribeDocsMensal();
  });
  $('mesProximo').addEventListener('click', function () {
    competenciaAtual.setMonth(competenciaAtual.getMonth() + 1);
    atualizarMesLabel();
    subscribeDocsMensal();
  });
  $('busca').addEventListener('input', function () {
    termoBusca = normalizarBusca($('busca').value);
    renderView();
  });
  $('voltarBtn').addEventListener('click', function () {
    clienteSelecionadoId = null;
    renderView();
  });

  // ---------- dados: clientes (uma vez, com onSnapshot pra refletir edições) ----------
  function subscribeClientes() {
    unsubClientes = db.collection('clientes').where('ativo', '==', true)
      .onSnapshot(function (snap) {
        clientesCache = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        clientesCache.sort(function (a, b) { return (a.nome || '').localeCompare(b.nome || '', 'pt-BR'); });
        renderView();
      }, function (err) {
        $('viewCards').innerHTML = '';
        $('vazioAviso').hidden = false;
        $('vazioAviso').textContent = 'Erro ao carregar clientes: ' + err.message;
      });
  }

  // ---------- dados: documentosMensal da janela de meses exibida ----------
  function subscribeDocsMensal() {
    if (unsubDocsMensal) { unsubDocsMensal(); unsubDocsMensal = null; }
    var janela = janelaCompetencias(competenciaAtual, JANELA_MESES);
    unsubDocsMensal = db.collection('documentosMensal').where('competencia', 'in', janela)
      .onSnapshot(function (snap) {
        docsMensalCache = new Map();
        snap.docs.forEach(function (d) {
          var data = d.data();
          if (!docsMensalCache.has(data.clienteId)) docsMensalCache.set(data.clienteId, new Map());
          docsMensalCache.get(data.clienteId).set(data.competencia, data);
        });
        renderView();
      }, function (err) {
        toast('Erro ao carregar situação dos meses: ' + err.message);
      });
  }

  // ---------- ações ----------
  function alternarDoc(cliente, tipo, marcado) {
    var comp = competenciaStr(competenciaAtual);
    var id = cliente.id + '_' + comp;
    var patch = { clienteId: cliente.id, clienteNome: cliente.nome, competencia: comp, atualizadoEm: new Date().toISOString() };
    patch[tipo] = marcado;
    db.collection('documentosMensal').doc(id).set(patch, { merge: true })
      .catch(function (err) { toast('Erro ao salvar: ' + err.message); });
  }

  function salvarEmail(cliente, novoEmail, inputEl) {
    novoEmail = novoEmail.trim();
    if (novoEmail === (cliente.email || '')) return;
    if (novoEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(novoEmail)) {
      toast('E-mail inválido para ' + cliente.nome);
      inputEl.value = cliente.email || '';
      return;
    }
    db.collection('clientes').doc(cliente.id).update({ email: novoEmail })
      .then(function () { toast('E-mail salvo.'); })
      .catch(function (err) {
        toast('Erro ao salvar e-mail: ' + err.message);
        inputEl.value = cliente.email || '';
      });
  }

  // ---------- renderização ----------
  function statusMes(clienteId, competencia) {
    var porMes = docsMensalCache.get(clienteId);
    return (porMes && porMes.get(competencia)) || null;
  }

  function pctMes(status) {
    if (!status) return null; // sem registro nenhum nesse mês
    var ok = TIPOS.filter(function (t) { return status[t]; }).length;
    return Math.round((ok / TIPOS.length) * 100);
  }

  // Monta o grupo de barrinhas (uma por mês da janela) igual ao estilo Mister.
  function montarBarras(clienteId, competenciaFinal, alturaPx) {
    var janela = janelaCompetencias(competenciaFinal, JANELA_MESES);
    var wrap = document.createElement('div');
    wrap.className = 'cc-barras';
    janela.forEach(function (comp) {
      var status = statusMes(clienteId, comp);
      var pct = pctMes(status);
      var grupo = document.createElement('div');
      grupo.className = 'barra-grupo' + (pct === null ? ' barra-semdado' : '');
      var col = document.createElement('div');
      col.className = 'barra-col';
      if (alturaPx) col.style.height = alturaPx + 'px';
      if (pct !== null) {
        var ok = document.createElement('div');
        ok.className = 'barra-ok-seg';
        ok.style.height = pct + '%';
        var pend = document.createElement('div');
        pend.className = 'barra-pend-seg';
        pend.style.height = (100 - pct) + '%';
        col.appendChild(ok);
        col.appendChild(pend);
      }
      var pctLabel = document.createElement('div');
      pctLabel.className = 'barra-pct';
      pctLabel.textContent = pct === null ? '—' : pct + '%';
      var mesLabel = document.createElement('div');
      mesLabel.className = 'barra-mes';
      mesLabel.textContent = competenciaCurta(comp);
      grupo.appendChild(col);
      grupo.appendChild(pctLabel);
      grupo.appendChild(mesLabel);
      wrap.appendChild(grupo);
    });
    return wrap;
  }

  function listaFiltrada() {
    var lista = clientesCache;
    if (termoBusca) {
      lista = lista.filter(function (c) {
        return normalizarBusca(c.nome).indexOf(termoBusca) !== -1 ||
          normalizarBusca(c.nomeFantasia).indexOf(termoBusca) !== -1 ||
          normalizarBusca(c.documento).indexOf(termoBusca) !== -1;
      });
    }
    return lista;
  }

  function renderView() {
    if (clienteSelecionadoId) {
      $('viewCards').hidden = true;
      $('viewDetalhe').hidden = false;
      renderDetalhe();
    } else {
      $('viewCards').hidden = false;
      $('viewDetalhe').hidden = true;
      renderCards();
    }
  }

  function renderCards() {
    var grid = $('viewCards');
    grid.innerHTML = '';
    var lista = listaFiltrada();
    var compAtualStr = competenciaStr(competenciaAtual);
    var janela = janelaCompetencias(competenciaAtual, JANELA_MESES);
    $('vazioAviso').hidden = lista.length > 0;
    var pendentesCount = 0;

    lista.forEach(function (cliente) {
      var statusAtual = statusMes(cliente.id, compAtualStr) || {};
      var faltando = TIPOS.filter(function (t) { return !statusAtual[t]; });
      if (faltando.length > 0) pendentesCount++;

      var mesesComRegistro = janela.filter(function (c) { return statusMes(cliente.id, c); }).length;

      var card = document.createElement('div');
      card.className = 'card-cliente ' + (faltando.length > 0 ? 'tem-pendencia' : 'completo');
      card.innerHTML =
        '<div><div class="cc-nome"></div><div class="cc-doc"></div></div>' +
        '<div class="cc-meta">' +
          '<span><span class="cc-num"></span> período' + (mesesComRegistro !== 1 ? 's' : '') + ' monitorado' + (mesesComRegistro !== 1 ? 's' : '') + '</span>' +
          '<span class="cc-legenda"><span><i class="dot dot-pend"></i>Pendente</span><span><i class="dot dot-ok"></i>Recebido</span></span>' +
        '</div>';
      card.querySelector('.cc-nome').textContent = cliente.nome || '(sem nome)';
      card.querySelector('.cc-doc').textContent = cliente.documento || '';
      card.querySelector('.cc-num').textContent = mesesComRegistro;
      card.appendChild(montarBarras(cliente.id, competenciaAtual, 46));
      var ver = document.createElement('div');
      ver.className = 'cc-ver';
      ver.innerHTML = 'Visualizar detalhes <i class="ph ph-arrow-right"></i>';
      card.appendChild(ver);
      card.addEventListener('click', function () {
        clienteSelecionadoId = cliente.id;
        renderView();
      });
      grid.appendChild(card);
    });

    $('contagem').textContent = lista.length + ' cliente' + (lista.length !== 1 ? 's' : '') + ' · ' + pendentesCount + ' com pendência';
  }

  function renderDetalhe() {
    var cliente = clientesCache.filter(function (c) { return c.id === clienteSelecionadoId; })[0];
    if (!cliente) { clienteSelecionadoId = null; renderView(); return; }

    $('detNome').textContent = cliente.nome || '(sem nome)';
    $('detDoc').textContent = cliente.documento || '';
    var emailInput = $('detEmailInput');
    emailInput.value = cliente.email || '';
    emailInput.onchange = function () { salvarEmail(cliente, emailInput.value, emailInput); };

    var compAtualStr = competenciaStr(competenciaAtual);
    var statusAtual = statusMes(cliente.id, compAtualStr) || {};

    var cont = $('detTipos');
    cont.innerHTML = '';
    TIPOS.forEach(function (tipo) {
      var janela = janelaCompetencias(competenciaAtual, JANELA_MESES);
      var mesesOk = janela.filter(function (c) { var s = statusMes(cliente.id, c); return s && s[tipo]; }).length;
      var marcadoAgora = !!statusAtual[tipo];

      var card = document.createElement('div');
      card.className = 'tipo-card';
      card.innerHTML =
        '<div class="tipo-card-topo"><span class="tipo-card-titulo"></span></div>' +
        '<div class="tipo-card-num"></div>' +
        '<div class="tipo-card-legenda"><span><i class="dot dot-pend"></i>Pendente</span><span><i class="dot dot-ok"></i>Recebido</span></div>';
      card.querySelector('.tipo-card-titulo').textContent = TIPO_LABEL[tipo];
      card.querySelector('.tipo-card-num').textContent = mesesOk + ' de ' + janela.length + ' meses recebidos';

      var barrasWrap = document.createElement('div');
      janela.forEach(function (comp) {
        var s = statusMes(cliente.id, comp);
        var recebido = s ? !!s[tipo] : null;
        var grupo = document.createElement('div');
        grupo.className = 'barra-grupo' + (recebido === null ? ' barra-semdado' : '');
        var col = document.createElement('div');
        col.className = 'barra-col';
        col.style.height = '68px';
        if (recebido !== null) {
          var seg = document.createElement('div');
          seg.className = recebido ? 'barra-ok-seg' : 'barra-pend-seg';
          seg.style.height = '100%';
          col.appendChild(seg);
        }
        var pctLabel = document.createElement('div');
        pctLabel.className = 'barra-pct';
        pctLabel.textContent = recebido === null ? '—' : (recebido ? 'ok' : 'falta');
        var mesLabel = document.createElement('div');
        mesLabel.className = 'barra-mes';
        mesLabel.textContent = competenciaCurta(comp);
        grupo.appendChild(col);
        grupo.appendChild(pctLabel);
        grupo.appendChild(mesLabel);
        barrasWrap.appendChild(grupo);
      });
      barrasWrap.className = 'cc-barras';
      card.appendChild(barrasWrap);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-secondary toggle-mes-atual' + (marcadoAgora ? ' marcado' : '');
      btn.innerHTML = marcadoAgora
        ? '<i class="ph ph-check-circle"></i> Recebido em ' + competenciaCurta(compAtualStr)
        : '<i class="ph ph-circle"></i> Marcar como recebido em ' + competenciaCurta(compAtualStr);
      btn.addEventListener('click', function () { alternarDoc(cliente, tipo, !marcadoAgora); });
      card.appendChild(btn);

      cont.appendChild(card);
    });
  }

  // ---------- autenticação ----------
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('loginError').hidden = true;
    auth.signInWithEmailAndPassword(resolveLoginEmail($('loginEmail').value), $('loginSenha').value)
      .catch(function (err) {
        $('loginError').textContent = 'Não foi possível entrar: ' + (err.message || err.code);
        $('loginError').hidden = false;
      });
  });

  $('logoutBtn').addEventListener('click', function () { auth.signOut(); });

  auth.onAuthStateChanged(function (user) {
    if (unsubClientes) { unsubClientes(); unsubClientes = null; }
    if (unsubDocsMensal) { unsubDocsMensal(); unsubDocsMensal = null; }
    if (!user) {
      podeUsar = false;
      $('authGate').hidden = false;
      $('app').hidden = true;
      return;
    }
    db.collection('usuarios').doc(user.uid).get().then(function (doc) {
      var roles = (doc.exists && doc.data().roles) || [];
      podeUsar = roles.indexOf('admin') !== -1 || roles.indexOf('contabil') !== -1;
      $('authGate').hidden = true;
      $('app').hidden = false;
      if (!podeUsar) {
        document.querySelector('.wrap').innerHTML = '<div id="negado"><i class="ph ph-lock" style="font-size:32px;"></i>' +
          '<p>Sua conta não tem acesso a este painel (precisa do papel admin ou contábil).</p></div>';
        return;
      }
      atualizarMesLabel();
      subscribeClientes();
      subscribeDocsMensal();
    });
  });
})();
</script>
</body>
</html>
