<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9A2B24">
<meta name="description" content="Painel de cobrança de documentos por e-mail (extrato, comprovante, aplicação).">
<title>Pendências e envio automático via Gmail — Nilma</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('nilma_tema');
    if (t === 'claro') document.documentElement.dataset.theme = 'light';
    else if (t === 'escuro') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  /* ==========================================================================
     Tokens — copiados do entregas.html (mesma paleta, mesma escala de forma
     e espaço) pra esta tela ler como parte do mesmo aplicativo, não um app à
     parte carregado dentro de um iframe.
     ========================================================================== */
  :root {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F2F2F2;
    --border: #E3E3E3; --border-forte: #C9C9C9;
    --ink: #1A1A1A; --ink-soft: #525252; --ink-faint: #6C6C6C;
    --accent: #9A2B24; --accent-ink: #FFFFFF; --accent-soft: #F7E7E5;
    --accent-forte: color-mix(in srgb, var(--accent) 62%, var(--ink));
    --success: #17694A; --success-soft: #E2F2EA; --success-forte: color-mix(in srgb, var(--success) 62%, var(--ink));
    --warning: #8A5D12; --warning-soft: #FAF0DC; --warning-forte: color-mix(in srgb, var(--warning) 62%, var(--ink));
    --danger: #A8322F; --danger-soft: #FAE6E4; --danger-forte: color-mix(in srgb, var(--danger) 62%, var(--ink));
    /* --border-forte (#C9C9C9) faz 1,66:1 contra o branco. Serve de fio
       separador, mas não de contorno de campo/botão: a WCAG pede 3:1 pra
       borda que é o que identifica o componente — abaixo disso a pessoa não
       vê onde termina o quadradinho clicável. Mesmo cinza, só mais escuro. */
    --borda-interativa: #949494;  /* 3,03:1 */
    --foco: var(--accent);        /* 7,65:1 no claro */
    --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 10px;
    --esp-1: 4px; --esp-2: 8px; --esp-3: 12px; --esp-4: 16px;
    --t-xs: 11px; --t-sm: 12px; --t-base: 13px; --t-md: 15px;
    --linha: 52px;
    --shadow: 0 10px 28px -14px rgba(10,10,16,.45), 0 2px 6px -3px rgba(10,10,16,.18);
    /* As curvas prontas do CSS (ease, ease-out) são fracas demais — não têm o
       arranque que faz a interação parecer proposital. Nunca ease-in em UI:
       ele começa devagar justo no instante em que a pessoa está olhando. */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #17191A; --surface: #17191A; --surface-2: #232526;
    --border: #33363A; --border-forte: #45484D;
    --ink: #F2F2F2; --ink-soft: #C7C9CC; --ink-faint: #9A9DA2;
    /* No claro, "-forte" é a cor escurecida; no escuro tem que ser o oposto —
       clareada. A fórmula herdada (misturar 92% da cor com o texto quase
       branco) mal mexe nela: o verde ficava 3,13:1 contra o fundo, abaixo dos
       4,5:1 que texto precisa. Mesma matiz, só mais clara — e saturada, porque
       misturar com branco desbota e a paleta perde a identidade. */
    --accent-soft: #3A2422; --accent-forte: #D9756D;   /* 5,64:1 */
    --success-soft: #123526; --success-forte: #34A075; /* 5,40:1 */
    --warning-soft: #3A2E0F; --warning-forte: #BE9134; /* 6,12:1 */
    --danger-soft: #3A1F1D; --danger-forte: #E0716C;   /* 5,67:1 */
    --borda-interativa: #62666B; /* 3,05:1 contra o fundo escuro */
    /* O accent (#9A2B24) faz só 2,31:1 no escuro — anel de foco invisível.
       Mesmo vermelho, clareado até passar. */
    --foco: #CF5248;             /* 4,16:1 */
    color-scheme: dark;
  }
  @media (min-width: 900px) { :root { --linha: 44px; --t-md: 14px; } }

  /* Qualquer elemento com o atributo hidden fica escondido de verdade, mesmo
     que outra regra defina display nele (ex: .lista usa display:flex). */
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: var(--t-md)/1.5 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: auto;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 64px; }
  body.embutido .wrap { padding-top: 8px; }
  body.embutido .topo { display: none; }

  header.topo {
    display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3);
    padding-bottom: var(--esp-3); margin-bottom: var(--esp-4); border-bottom: 1px solid var(--border);
  }
  header.topo h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  header.topo .sub { color: var(--ink-faint); font-size: var(--t-sm); margin-top: 2px; }

  /* ---------- botões (mesma forma do entregas.html: --r-sm, sem pílula) ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 14px; border-radius: var(--r-sm);
    font: 600 var(--t-md)/1 inherit; cursor: pointer; border: 1px solid transparent;
    white-space: nowrap;
    transition: background-color 140ms ease, border-color 140ms ease, transform 140ms var(--ease-out);
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .campo { margin-bottom: var(--esp-4); }
  .campo label { display: block; font-size: var(--t-sm); color: var(--ink-soft); margin-bottom: 4px; font-weight: 500; }
  .input {
    width: 100%; height: 40px; padding: 0 var(--esp-3); border-radius: var(--r-sm);
    border: 1px solid var(--borda-interativa); background: var(--surface-2); color: var(--ink);
    font: var(--t-md) inherit;
  }
  .input::placeholder { color: var(--ink-faint); opacity: 1; }
  .input:focus { outline: none; border-color: var(--foco); box-shadow: 0 0 0 3px var(--accent-soft); }
  .campo-email { max-width: 420px; margin: 0; }
  .aviso { color: var(--ink-faint); font-size: var(--t-base); padding: 40px 0; text-align: center; }

  /* ==========================================================================
     Barra de contexto: primeiro o MÊS (é ele que dá sentido a todo o resto),
     depois a busca. Os contadores vêm abaixo, já sabendo de que mês falam.
     ========================================================================== */
  .barra { display: flex; align-items: center; gap: var(--esp-2); flex-wrap: wrap; }
  .mes-nav {
    display: flex; align-items: center; gap: 2px; background: var(--surface-2);
    border: 1px solid var(--borda-interativa); border-radius: var(--r-md); padding: 3px;
  }
  .mes-nav button {
    width: 30px; height: 30px; border-radius: var(--r-sm); border: none; background: none;
    color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;
    transition: background-color 140ms ease, color 140ms ease, transform 140ms var(--ease-out);
  }
  .mes-nav button:active { transform: scale(.9); }
  .mes-label { font-weight: 700; font-size: var(--t-base); min-width: 116px; text-align: center; }
  .btn-hoje {
    height: 30px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-soft); font: 500 var(--t-sm)/1 inherit; cursor: pointer;
    transition: border-color 140ms ease, color 140ms ease, transform 140ms var(--ease-out);
  }
  .btn-hoje:active { transform: scale(.96); }
  .busca { flex: 1; min-width: 180px; }

  /* ---------- contadores que filtram (o número é o botão) ---------- */
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin: var(--esp-3) 0 var(--esp-2); }
  .filtro {
    display: inline-flex; align-items: baseline; gap: 6px;
    height: 34px; padding: 0 12px; border-radius: var(--r-sm);
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
    font: 500 var(--t-base)/1 inherit; cursor: pointer;
    transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease,
                transform 140ms var(--ease-out);
  }
  .filtro:active { transform: scale(.97); }
  .filtro .n { font-size: var(--t-md); font-weight: 700; letter-spacing: -.02em; }
  .filtro[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600;
  }

  /* ==========================================================================
     Indicador de documento — UM componente só, usado na lista (compacto, só a
     inicial) e no detalhe (com nome e procedência). Verde cheio = recebido,
     vazado = em falta. É status, por isso verde/vazado; o vermelho da paleta
     fica reservado pra "selecionado" (filtro), pra não virar a mesma cor
     significando duas coisas diferentes na mesma tela.
     ========================================================================== */
  /* Cheio X vazado não pode ser SÓ cor: quem não distingue verde precisa de
     outro sinal. A borda tracejada ("falta preencher") vira sólida e cheia
     quando chega — a forma diz o mesmo que a cor. */
  .doc-ind {
    flex: none; width: 30px; height: 30px; border-radius: var(--r-xs);
    border: 1px dashed var(--borda-interativa); background: var(--surface); color: var(--ink-faint);
    font: 600 var(--t-sm)/1 inherit; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease,
                transform 140ms var(--ease-out);
  }
  /* É o elemento mais clicado da tela inteira — sem resposta ao toque a pessoa
     fica sem saber se o clique pegou antes de o Firestore responder. Num
     quadrado de 30px, 0.97 não se vê; 0.9 sim. */
  .doc-ind:active { transform: scale(.9); }
  .doc-ind.recebido {
    background: var(--success); border-style: solid; border-color: var(--success); color: #FFFFFF;
  }
  .doc-inds { display: flex; gap: 6px; flex: none; }

  /* ==========================================================================
     Lista de clientes — linhas de 1px igual entregas.html. O e-mail saiu da
     linha: eram 320 linhas de texto cinza repetido e ninguém lê e-mail em
     lista. O que importa é quando ele FALTA, e isso vira um alerta ao lado do
     nome; o endereço em si fica no detalhe, onde se edita.
     ========================================================================== */
  .lista { border-top: 1px solid var(--border); }
  .linha-cliente {
    display: flex; align-items: center; gap: var(--esp-3);
    min-height: var(--linha); padding: var(--esp-1) 0 var(--esp-1) 14px;
    border-bottom: 1px solid var(--border); position: relative;
    transition: background-color 120ms ease;
  }
  .linha-cliente::before {
    content: ""; position: absolute; left: 0; top: 50%; margin-top: -3px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--linha-cor, var(--border-forte));
  }
  .linha-cliente.lc-pendente { --linha-cor: var(--warning); }
  .linha-cliente.lc-completo { --linha-cor: var(--success); }

  .lc-info {
    flex: 1 1 auto; min-width: 0; cursor: pointer; background: none; border: none;
    text-align: left; padding: 0; color: inherit; font: inherit;
  }
  .lc-nome {
    font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .lc-nome .txt { overflow: hidden; text-overflow: ellipsis; }
  .lc-sem-email { flex: none; color: var(--warning-forte); font-size: .9em; }
  .lc-doc { font-size: var(--t-xs); color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; }

  /* No celular os indicadores caem numa linha só pra eles, e aí cabem os
     44px que um alvo de toque precisa ter — com 8px entre eles, senão marca
     Comprovante quando a pessoa quis marcar Extrato. */
  @media (max-width: 560px) {
    .linha-cliente { flex-wrap: wrap; padding-top: var(--esp-2); padding-bottom: var(--esp-2); }
    .lc-info { flex-basis: 100%; }
    .doc-ind { width: 44px; height: 44px; font-size: var(--t-base); }
    .doc-inds { gap: var(--esp-2); }
    /* Com a linha quebrada em duas alturas, o ponto centralizado fica ao lado
       dos quadradinhos em vez de ao lado do nome que ele descreve. */
    .linha-cliente::before { top: 15px; margin-top: 0; }
  }

  /* ==========================================================================
     Detalhe do cliente
     ========================================================================== */
  #viewDetalhe { display: flex; flex-direction: column; gap: var(--esp-4); }
  .detalhe-topo { display: flex; align-items: center; gap: var(--esp-3); flex-wrap: wrap; }
  .detalhe-topo .mes-label { min-width: 0; }
  .detalhe-cabecalho { padding-bottom: var(--esp-3); border-bottom: 1px solid var(--border); }
  .detalhe-nome { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .detalhe-razao { color: var(--ink-faint); font-size: var(--t-sm); margin-top: 2px; }
  .detalhe-meta { display: flex; flex-wrap: wrap; gap: var(--esp-3); margin-top: var(--esp-2); align-items: center; }
  .detalhe-meta span { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-sm); color: var(--ink-soft); }
  .detalhe-meta .ph { color: var(--ink-faint); font-size: .95em; }
  .detalhe-meta .mono { font-family: 'JetBrains Mono', monospace; }
  .badge-enquadramento {
    display: inline-flex; align-items: center; font-size: var(--t-xs); font-weight: 600;
    padding: 3px 8px; border-radius: var(--r-xs); background: var(--surface-2); color: var(--ink-soft);
  }

  .secao-titulo {
    font-size: var(--t-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: var(--esp-2);
  }

  /* Cada tipo de documento é uma linha que diz o que é, se chegou, e — o
     ponto principal — DE ONDE veio a marcação. Sem isso não dá pra saber se
     quem marcou foi uma pessoa ou o robô que lê o Gmail, e um robô que não
     pode ser conferido é um robô em que ninguém confia. */
  .doc-lista { border-top: 1px solid var(--border); }
  .doc-item {
    display: flex; align-items: flex-start; gap: var(--esp-3);
    padding: var(--esp-3) 0; border-bottom: 1px solid var(--border);
  }
  .doc-item .doc-ind { margin-top: 1px; }
  .doc-corpo { flex: 1; min-width: 0; }
  .doc-linha1 { display: flex; align-items: baseline; gap: var(--esp-2); flex-wrap: wrap; }
  .doc-nome { font-weight: 500; }
  .doc-estado { font-size: var(--t-sm); font-weight: 600; color: var(--ink-faint); }
  .doc-estado.recebido { color: var(--success-forte); }
  .doc-origem { font-size: var(--t-sm); color: var(--ink-faint); margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .doc-origem .ph { font-size: .95em; }
  .doc-arquivos {
    margin: var(--esp-2) 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 2px;
  }
  .doc-arquivos li {
    font-size: var(--t-xs); color: var(--ink-soft); font-family: 'JetBrains Mono', monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-arquivos li::before { content: "↳ "; color: var(--ink-faint); }

  /* Entra subindo de onde ele mora (rodapé) em vez de brotar parado no meio
     do nada — o movimento diz de onde a mensagem veio. */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--r-md);
    font-size: var(--t-base); box-shadow: var(--shadow); z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #authGate {
    position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
    justify-content: center; z-index: 50; padding: 20px;
  }
  #authGate form { width: 100%; max-width: 340px; }
  #authGate h1 { font-size: 18px; text-align: center; margin-bottom: 20px; }
  .auth-erro { color: var(--danger-forte); font-size: var(--t-base); margin: 8px 0; }
  #negado { text-align: center; padding: 60px 20px; color: var(--ink-soft); }

  /* ==========================================================================
     Troca de tela — 200ms só pra não piscar. Aparecer e sumir sem transição
     nenhuma dá a impressão de que a página quebrou e recarregou.
     ========================================================================== */
  @keyframes entrar { from { opacity: 0; transform: translateY(4px); } }
  #viewDetalhe, #viewLista { animation: entrar 200ms var(--ease-out); }

  /* ==========================================================================
     Estados de teclado — quem navega por Tab precisa enxergar onde está. Sem
     isto a tela é inoperável sem mouse, e o navegador não desenha foco
     visível por cima de fundo colorido.
     ========================================================================== */
  .doc-ind:focus-visible, .filtro:focus-visible, .lc-info:focus-visible,
  .btn:focus-visible, .mes-nav button:focus-visible, .btn-hoje:focus-visible {
    outline: 2px solid var(--foco); outline-offset: 2px;
  }

  /* ==========================================================================
     Hover só onde existe ponteiro de verdade. No celular o toque dispara
     :hover e o estado gruda na linha depois que o dedo sai.
     ========================================================================== */
  @media (hover: hover) and (pointer: fine) {
    .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
    .btn-secondary:hover { background: var(--surface-2); border-color: var(--border-forte); }
    .mes-nav button:hover { background: var(--surface); color: var(--ink); }
    .btn-hoje:hover { border-color: var(--border-forte); color: var(--ink); }
    .filtro:hover { border-color: var(--border-forte); color: var(--ink); }
    .filtro[aria-pressed="true"]:hover { color: var(--accent-ink); }
    .doc-ind:hover { border-color: var(--ink-faint); color: var(--ink); }
    .doc-ind.recebido:hover { background: var(--success-forte); border-color: var(--success-forte); color: #FFFFFF; }
    /* Numa lista de 320 linhas, saber em qual linha o ponteiro está é o que
       evita marcar o documento do cliente de cima. */
    .linha-cliente:hover { background: var(--surface-2); }
    .lc-info:hover .lc-nome .txt { color: var(--accent-forte); text-decoration: underline; }
  }

  /* ==========================================================================
     Movimento reduzido: tira o deslocamento, mantém cor e opacidade (que
     ajudam a entender o que mudou). Menos movimento, não zero.
     ========================================================================== */
  @media (prefers-reduced-motion: reduce) {
    #viewDetalhe, #viewLista { animation: none; }
    .btn:active, .filtro:active, .doc-ind:active,
    .mes-nav button:active, .btn-hoje:active { transform: none; }
    .toast { transform: translateX(-50%); transition: opacity 200ms ease; }
    .toast.show { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<div id="authGate">
  <form id="loginForm">
    <h1>Cobrança de Documentos</h1>
    <div class="campo">
      <label for="loginEmail">Usuário</label>
      <input class="input" id="loginEmail" type="text" autocomplete="username" placeholder="ex: teste" required>
    </div>
    <div class="campo">
      <label for="loginSenha">Senha</label>
      <input class="input" id="loginSenha" type="password" autocomplete="current-password" required>
    </div>
    <p class="auth-erro" id="loginError" hidden></p>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <header class="topo">
      <div>
        <h1>Cobrança de Documentos</h1>
        <div class="sub">Extrato · Comprovante · Aplicação — marque direto na lista o que já chegou</div>
      </div>
      <button class="btn btn-secondary" id="logoutBtn"><i class="ph ph-sign-out"></i> Sair</button>
    </header>

    <div id="viewLista">
      <div class="barra">
        <div class="mes-nav">
          <button type="button" id="mesAnterior" aria-label="Mês anterior"><i class="ph ph-caret-left"></i></button>
          <span class="mes-label" id="mesLabel"></span>
          <button type="button" id="mesProximo" aria-label="Próximo mês"><i class="ph ph-caret-right"></i></button>
        </div>
        <button type="button" class="btn-hoje" id="btnHoje" hidden>mês atual</button>
        <input class="input busca" id="busca" type="text" placeholder="Buscar cliente ou CNPJ...">
      </div>

      <div class="filtros">
        <button type="button" class="filtro" id="filtroPendentes" data-filtro="pendentes" aria-pressed="false">
          <span class="n" id="numPendentes">–</span> com pendência
        </button>
        <button type="button" class="filtro" id="filtroCompletos" data-filtro="completos" aria-pressed="false">
          <span class="n" id="numCompletos">–</span> completos
        </button>
        <button type="button" class="filtro" id="filtroTodos" data-filtro="todos" aria-pressed="true">
          <span class="n" id="numTodos">–</span> todos
        </button>
      </div>

      <div id="lista" class="lista" role="list" aria-label="Clientes"></div>
      <div id="listaAviso" class="aviso">Carregando clientes...</div>
    </div>

    <div id="viewDetalhe" hidden>
      <div class="detalhe-topo">
        <button type="button" class="btn btn-secondary" id="voltarBtn"><i class="ph ph-arrow-left"></i> Voltar</button>
        <span class="mes-label" id="detMesLabel"></span>
      </div>

      <div class="detalhe-cabecalho">
        <div class="detalhe-nome" id="detNome"></div>
        <div class="detalhe-razao" id="detRazao" hidden></div>
        <div class="detalhe-meta">
          <span class="mono" id="detDocWrap"><i class="ph ph-identification-card"></i><span id="detDoc"></span></span>
          <span id="detTelWrap" hidden><i class="ph ph-phone"></i><span id="detTel"></span></span>
          <span id="detCidadeWrap" hidden><i class="ph ph-map-pin"></i><span id="detCidade"></span></span>
          <span class="badge-enquadramento" id="detEnquadramento" hidden></span>
        </div>
      </div>

      <div class="campo campo-email">
        <label for="detEmailInput">E-mail de cobrança</label>
        <input class="input" id="detEmailInput" type="email" placeholder="cliente@exemplo.com">
      </div>

      <div>
        <div class="secao-titulo">Documentos do mês</div>
        <div class="doc-lista" id="detDocs"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "AIzaSyD6xg7XhX8dKTKmaYup4hRX5k9XFHEkb98",
    authDomain: "entregas-2e5e2.firebaseapp.com",
    projectId: "entregas-2e5e2",
    storageBucket: "entregas-2e5e2.firebasestorage.app",
    messagingSenderId: "1009094556836",
    appId: "1:1009094556836:web:d3b6a9283e934db064fa31"
  };
  firebase.initializeApp(firebaseConfig);
</script>
<script>
(function () {
  // Dentro do hub (entregas.html), esta página carrega num <iframe> que já
  // fica embaixo do cabeçalho "Pendências / <data>" e da barra lateral do
  // app principal — o cabeçalho e o botão Sair daqui em cima ficariam
  // duplicados, então somem quando não é acesso direto ao arquivo.
  try {
    if (window.self !== window.top) document.body.classList.add('embutido');
  } catch (e) {
    document.body.classList.add('embutido'); // acesso a window.top bloqueado = com certeza embutido
  }

  var auth = firebase.auth();
  var db = firebase.firestore();
  var $ = function (id) { return document.getElementById(id); };

  var TIPOS = [
    { chave: 'extrato', label: 'Extrato Bancário', inicial: 'E' },
    { chave: 'comprovante', label: 'Comprovante', inicial: 'C' },
    { chave: 'aplicacao', label: 'Aplicação', inicial: 'A' }
  ];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  var competenciaAtual = new Date();
  competenciaAtual.setDate(1);
  var clientesCache = [];
  var statusCache = new Map();   // clienteId -> documento de documentosMensal
  var linhas = new Map();        // clienteId -> {row, info, nomeTxt, semEmail, inds:{tipo->botão}}
  var unsubClientes = null;
  var unsubStatus = null;
  var termoBusca = '';
  var filtroStatus = 'todos';
  var clienteSelecionadoId = null;
  var clientesCarregados = false;

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function competenciaStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  // Maiúscula só na inicial. text-transform:capitalize do CSS maiusculiza TODA
  // palavra e escreve "Setembro De 2026".
  function competenciaLabel(d) {
    var mes = MESES[d.getMonth()];
    return mes.charAt(0).toUpperCase() + mes.slice(1) + ' de ' + d.getFullYear();
  }
  function ehMesAtual() {
    var hoje = new Date();
    return competenciaAtual.getFullYear() === hoje.getFullYear() && competenciaAtual.getMonth() === hoje.getMonth();
  }
  function dataCurta(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') +
      ' às ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  var DIACRITICS_RE = /[̀-ͯ]/g;
  function emailFromNome(nome) {
    var slug = nome.trim().toLowerCase()
      .normalize('NFD').replace(DIACRITICS_RE, '')
      .replace(/[^a-z0-9]+/g, '.')
      .replace(/^\.+|\.+$/g, '');
    return slug + '@nilma.local';
  }
  function resolveLoginEmail(input) {
    input = input.trim();
    return input.indexOf('@') !== -1 ? input : emailFromNome(input);
  }
  function normalizarBusca(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(DIACRITICS_RE, '');
  }
  // Login é usuario@nilma.local, não e-mail de verdade — mostrar o domínio
  // interno na procedência só polui.
  function nomeDeUsuario(email) {
    return String(email || '').split('@')[0] || 'alguém';
  }

  // ---------- navegação de mês ----------
  function irParaMes(delta) {
    competenciaAtual.setMonth(competenciaAtual.getMonth() + delta);
    aoTrocarMes();
  }
  function aoTrocarMes() {
    $('mesLabel').textContent = competenciaLabel(competenciaAtual);
    $('btnHoje').hidden = ehMesAtual();
    subscribeStatus();
  }
  $('mesAnterior').addEventListener('click', function () { irParaMes(-1); });
  $('mesProximo').addEventListener('click', function () { irParaMes(1); });
  $('btnHoje').addEventListener('click', function () {
    var hoje = new Date();
    competenciaAtual = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    aoTrocarMes();
  });
  $('busca').addEventListener('input', function () {
    termoBusca = normalizarBusca($('busca').value);
    aplicarFiltros();
  });

  // ---------- filtros pelos contadores ----------
  ['filtroPendentes', 'filtroCompletos', 'filtroTodos'].forEach(function (id) {
    $(id).addEventListener('click', function () {
      var alvo = $(id).dataset.filtro;
      filtroStatus = (filtroStatus === alvo && alvo !== 'todos') ? 'todos' : alvo;
      aplicarFiltros();
    });
  });

  // ---------- dados ----------
  function subscribeClientes() {
    unsubClientes = db.collection('clientes').where('ativo', '==', true)
      .onSnapshot(function (snap) {
        clientesCache = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        clientesCache.sort(function (a, b) { return (a.nome || '').localeCompare(b.nome || '', 'pt-BR'); });
        clientesCarregados = true;
        reconstruirLista();
        if (clienteSelecionadoId) renderDetalhe();
      }, function (err) {
        $('lista').innerHTML = '';
        linhas.clear();
        $('listaAviso').hidden = false;
        $('listaAviso').textContent = 'Erro ao carregar clientes: ' + err.message;
      });
  }

  function subscribeStatus() {
    if (unsubStatus) { unsubStatus(); unsubStatus = null; }
    var comp = competenciaStr(competenciaAtual);
    unsubStatus = db.collection('documentosMensal').where('competencia', '==', comp)
      .onSnapshot(function (snap) {
        statusCache = new Map();
        snap.docs.forEach(function (d) { statusCache.set(d.data().clienteId, d.data()); });
        atualizarTodosStatus();
        if (clienteSelecionadoId) renderDetalhe();
      }, function (err) { toast('Erro ao carregar situação do mês: ' + err.message); });
  }

  function statusDoCliente(clienteId) {
    return statusCache.get(clienteId) || {};
  }
  function recebidosDe(clienteId) {
    var st = statusDoCliente(clienteId);
    return TIPOS.filter(function (t) { return st[t.chave]; }).length;
  }

  // ---------- ações ----------
  function alternarDoc(cliente, tipo, marcarComo) {
    var comp = competenciaStr(competenciaAtual);
    var patch = {
      clienteId: cliente.id, clienteNome: cliente.nome, competencia: comp,
      atualizadoEm: new Date().toISOString(), detalhes: {}
    };
    patch[tipo.chave] = marcarComo;
    // Marcar na mão também deixa rastro: sem isso, só o que o robô grava teria
    // procedência e a metade humana da grade ficaria sem explicação.
    patch.detalhes[tipo.chave] = marcarComo
      ? { origem: 'manual', em: new Date().toISOString(), por: nomeDeUsuario(auth.currentUser && auth.currentUser.email) }
      : null;
    db.collection('documentosMensal').doc(cliente.id + '_' + comp).set(patch, { merge: true })
      .catch(function (err) { toast('Erro ao salvar: ' + err.message); });
  }

  function salvarEmail(cliente, novoEmail, inputEl) {
    novoEmail = novoEmail.trim();
    if (novoEmail === (cliente.email || '')) return;
    if (novoEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(novoEmail)) {
      toast('E-mail inválido para ' + cliente.nome);
      inputEl.value = cliente.email || '';
      return;
    }
    db.collection('clientes').doc(cliente.id).update({ email: novoEmail })
      .then(function () { toast('E-mail salvo.'); })
      .catch(function (err) {
        toast('Erro ao salvar e-mail: ' + err.message);
        inputEl.value = cliente.email || '';
      });
  }

  // ==========================================================================
  // Lista: as linhas são construídas UMA vez e depois só atualizadas. Antes
  // tudo era remontado do zero a cada tecla digitada e a cada atualização do
  // Firestore — com 320 clientes isso é remontar ~2000 nós pra mudar um
  // quadradinho.
  // ==========================================================================
  function criarLinha(cliente) {
    var row = document.createElement('div');
    row.className = 'linha-cliente';
    row.setAttribute('role', 'listitem');

    var info = document.createElement('button');
    info.type = 'button';
    info.className = 'lc-info';
    var nome = document.createElement('div');
    nome.className = 'lc-nome';
    var nomeTxt = document.createElement('span');
    nomeTxt.className = 'txt';
    nomeTxt.textContent = cliente.nome || '(sem nome)';
    var semEmail = document.createElement('i');
    semEmail.className = 'ph ph-warning-circle lc-sem-email';
    semEmail.title = 'Sem e-mail cadastrado';
    nome.appendChild(nomeTxt);
    nome.appendChild(semEmail);
    var doc = document.createElement('div');
    doc.className = 'lc-doc';
    doc.textContent = cliente.documento || '';
    info.appendChild(nome);
    info.appendChild(doc);
    info.addEventListener('click', function () { abrirDetalhe(cliente.id); });
    row.appendChild(info);

    var inds = document.createElement('div');
    inds.className = 'doc-inds';
    var indPorTipo = {};
    TIPOS.forEach(function (tipo) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'doc-ind';
      b.textContent = tipo.inicial;
      b.addEventListener('click', function () {
        alternarDoc(cliente, tipo, !b.classList.contains('recebido'));
      });
      inds.appendChild(b);
      indPorTipo[tipo.chave] = b;
    });
    row.appendChild(inds);

    linhas.set(cliente.id, { row: row, nomeTxt: nomeTxt, semEmail: semEmail, inds: indPorTipo });
    return row;
  }

  function reconstruirLista() {
    var container = $('lista');
    container.innerHTML = '';
    linhas.clear();
    var frag = document.createDocumentFragment();
    clientesCache.forEach(function (cliente) { frag.appendChild(criarLinha(cliente)); });
    container.appendChild(frag);
    atualizarTodosStatus();
  }

  function atualizarTodosStatus() {
    clientesCache.forEach(function (cliente) {
      var linha = linhas.get(cliente.id);
      if (!linha) return;
      var status = statusDoCliente(cliente.id);
      var ok = 0;
      TIPOS.forEach(function (tipo) {
        var marcado = !!status[tipo.chave];
        if (marcado) ok++;
        var b = linha.inds[tipo.chave];
        b.classList.toggle('recebido', marcado);
        b.title = tipo.label + (marcado ? ' — recebido (clique para desmarcar)' : ' — em falta (clique para marcar)');
        b.setAttribute('aria-label', b.title);
      });
      var completo = ok === TIPOS.length;
      linha.row.classList.toggle('lc-completo', completo);
      linha.row.classList.toggle('lc-pendente', !completo);
      linha.semEmail.hidden = !!cliente.email;
      linha.nomeTxt.textContent = cliente.nome || '(sem nome)';
    });
    aplicarFiltros();
  }

  function combinaBusca(cliente) {
    if (!termoBusca) return true;
    return normalizarBusca(cliente.nome).indexOf(termoBusca) !== -1 ||
      normalizarBusca(cliente.nomeFantasia).indexOf(termoBusca) !== -1 ||
      normalizarBusca(cliente.documento).indexOf(termoBusca) !== -1;
  }

  function aplicarFiltros() {
    var totalPendentes = 0, visiveis = 0;

    clientesCache.forEach(function (cliente) {
      var linha = linhas.get(cliente.id);
      if (!linha) return;
      var completo = recebidosDe(cliente.id) === TIPOS.length;
      if (!completo) totalPendentes++;

      var passaStatus = filtroStatus === 'todos' ||
        (filtroStatus === 'pendentes' && !completo) ||
        (filtroStatus === 'completos' && completo);
      var mostrar = passaStatus && combinaBusca(cliente);
      linha.row.hidden = !mostrar;
      if (mostrar) visiveis++;
    });

    // Os contadores descrevem o MÊS, não o resultado da busca — se mudassem a
    // cada letra digitada deixariam de ser o retrato do mês.
    $('numPendentes').textContent = totalPendentes;
    $('numCompletos').textContent = clientesCache.length - totalPendentes;
    $('numTodos').textContent = clientesCache.length;

    ['filtroPendentes', 'filtroCompletos', 'filtroTodos'].forEach(function (id) {
      $(id).setAttribute('aria-pressed', String($(id).dataset.filtro === filtroStatus));
    });

    var aviso = $('listaAviso');
    if (!clientesCarregados) {
      aviso.hidden = false;
      aviso.textContent = 'Carregando clientes...';
    } else if (visiveis === 0) {
      aviso.hidden = false;
      aviso.textContent = termoBusca ? 'Nenhum cliente encontrado para essa busca.'
        : (filtroStatus === 'pendentes' ? 'Nenhuma pendência neste mês.' : 'Nenhum cliente neste filtro.');
    } else {
      aviso.hidden = true;
    }
  }

  // ---------- detalhe ----------
  function abrirDetalhe(clienteId) {
    clienteSelecionadoId = clienteId;
    $('viewLista').hidden = true;
    $('viewDetalhe').hidden = false;
    renderDetalhe();
    $('voltarBtn').focus();
  }
  $('voltarBtn').addEventListener('click', function () {
    clienteSelecionadoId = null;
    $('viewDetalhe').hidden = true;
    $('viewLista').hidden = false;
  });

  function descreverOrigem(info) {
    if (!info || !info.origem) return null;
    if (info.origem === 'gmail') {
      var partes = ['Automático — lido do Gmail'];
      if (info.em) partes.push(dataCurta(info.em));
      return { icone: 'ph-robot', texto: partes.join(' · '), arquivos: info.arquivos || [] };
    }
    var t = ['Marcado à mão'];
    if (info.por) t.push('por ' + info.por);
    if (info.em) t.push(dataCurta(info.em));
    return { icone: 'ph-hand-pointing', texto: t.join(' · '), arquivos: [] };
  }

  function renderDetalhe() {
    var cliente = clientesCache.filter(function (c) { return c.id === clienteSelecionadoId; })[0];
    if (!cliente) {
      clienteSelecionadoId = null;
      $('viewDetalhe').hidden = true;
      $('viewLista').hidden = false;
      return;
    }

    var nomeFantasia = (cliente.nomeFantasia || '').trim();
    $('detNome').textContent = nomeFantasia || cliente.nome || '(sem nome)';
    $('detRazao').hidden = !(nomeFantasia && cliente.nome && cliente.nome !== nomeFantasia);
    $('detRazao').textContent = cliente.nome || '';
    $('detDoc').textContent = cliente.documento || '(sem CNPJ/CPF)';
    $('detTelWrap').hidden = !cliente.telefone;
    $('detTel').textContent = cliente.telefone || '';
    var localCidade = [cliente.bairro, cliente.cidade].filter(Boolean).join(' — ') || cliente.endereco || '';
    $('detCidadeWrap').hidden = !localCidade;
    $('detCidade').textContent = localCidade;
    $('detEnquadramento').hidden = !cliente.enquadramento;
    $('detEnquadramento').textContent = cliente.enquadramento || '';
    $('detMesLabel').textContent = competenciaLabel(competenciaAtual);

    var emailInput = $('detEmailInput');
    if (document.activeElement !== emailInput) emailInput.value = cliente.email || '';
    emailInput.onchange = function () { salvarEmail(cliente, emailInput.value, emailInput); };

    var status = statusDoCliente(cliente.id);
    var detalhes = status.detalhes || {};
    var container = $('detDocs');
    container.innerHTML = '';

    TIPOS.forEach(function (tipo) {
      var marcado = !!status[tipo.chave];

      var item = document.createElement('div');
      item.className = 'doc-item';

      var botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'doc-ind' + (marcado ? ' recebido' : '');
      botao.textContent = tipo.inicial;
      botao.title = marcado ? 'Clique para desmarcar' : 'Clique para marcar como recebido';
      botao.addEventListener('click', function () { alternarDoc(cliente, tipo, !marcado); });
      item.appendChild(botao);

      var corpo = document.createElement('div');
      corpo.className = 'doc-corpo';

      var linha1 = document.createElement('div');
      linha1.className = 'doc-linha1';
      var nome = document.createElement('span');
      nome.className = 'doc-nome';
      nome.textContent = tipo.label;
      var estado = document.createElement('span');
      estado.className = 'doc-estado' + (marcado ? ' recebido' : '');
      estado.textContent = marcado ? 'recebido' : 'em falta';
      linha1.appendChild(nome);
      linha1.appendChild(estado);
      corpo.appendChild(linha1);

      var origem = marcado ? descreverOrigem(detalhes[tipo.chave]) : null;
      if (marcado) {
        var linhaOrigem = document.createElement('div');
        linhaOrigem.className = 'doc-origem';
        var ico = document.createElement('i');
        ico.className = 'ph ' + (origem ? origem.icone : 'ph-question');
        var txt = document.createElement('span');
        txt.textContent = origem ? origem.texto : 'Origem não registrada (marcado antes deste controle existir)';
        linhaOrigem.appendChild(ico);
        linhaOrigem.appendChild(txt);
        corpo.appendChild(linhaOrigem);

        if (origem && origem.arquivos.length) {
          var ul = document.createElement('ul');
          ul.className = 'doc-arquivos';
          origem.arquivos.forEach(function (nomeArq) {
            var li = document.createElement('li');
            li.textContent = nomeArq;
            ul.appendChild(li);
          });
          corpo.appendChild(ul);
        }
      }

      item.appendChild(corpo);
      container.appendChild(item);
    });
  }

  // ---------- autenticação ----------
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('loginError').hidden = true;
    auth.signInWithEmailAndPassword(resolveLoginEmail($('loginEmail').value), $('loginSenha').value)
      .catch(function (err) {
        $('loginError').textContent = 'Não foi possível entrar: ' + (err.message || err.code);
        $('loginError').hidden = false;
      });
  });

  $('logoutBtn').addEventListener('click', function () { auth.signOut(); });

  auth.onAuthStateChanged(function (user) {
    if (unsubClientes) { unsubClientes(); unsubClientes = null; }
    if (unsubStatus) { unsubStatus(); unsubStatus = null; }
    if (!user) {
      $('authGate').hidden = false;
      $('app').hidden = true;
      return;
    }
    db.collection('usuarios').doc(user.uid).get().then(function (doc) {
      var roles = (doc.exists && doc.data().roles) || [];
      var podeUsar = roles.indexOf('admin') !== -1 || roles.indexOf('contabil') !== -1;
      $('authGate').hidden = true;
      $('app').hidden = false;
      if (!podeUsar) {
        document.querySelector('.wrap').innerHTML = '<div id="negado"><i class="ph ph-lock" style="font-size:32px;"></i>' +
          '<p>Sua conta não tem acesso a este painel (precisa do papel admin ou contábil).</p></div>';
        return;
      }
      aoTrocarMes();
      subscribeClientes();
    });
  });
})();
</script>
</body>
</html>
